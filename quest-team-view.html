<!DOCTYPE html>
<html lang="ja" data-bg="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クエスト チーム戦（モックの画面）</title>
<!-- モック 第3版の画面。quest-battle-mock.html の中で ?v=proj（投影）/ lead（リーダー）/ mem（あなた）として開く。
     見た目は quest.css（ソロのフィールド・戦闘画面と同じ部品）。動きは親ページの SIM が持つ -->
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="quest.css">
<style>
  #s-battle .bt-bg { background-image:url(img/bg/lab.webp); }
  /* 戦闘のレイアウト（第3版の2）：上＝班の帯、まん中＝敵だけ（大きく）、下＝問題（図は左に大きく） */
  #s-battle { padding:.7em 1.1em; gap:.5em; }
  #s-battle .bt-top { gap:.6em; }
  #s-battle .arena { flex:1 1 0; min-height:22%; }
  #s-battle .arena .party { display:none; }
  #s-battle .floor { height:30%; }
  #s-battle .cmd { flex:0 0 auto; max-height:62%; min-height:0; justify-content:flex-start; padding:.7em 1em; }
  #s-battle .cmd.has-img { flex:0 0 58%; }
  #s-battle .cmd.has-img { grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); grid-template-rows:auto 1fr auto auto; }
  #s-battle .cmd.has-img > .qbox { grid-column:2; grid-row:1; font-size:1.05em; }
  #s-battle .cmd.has-img { overflow:hidden; }
  #s-battle .cmd.has-img > .cmd-img { grid-column:1; grid-row:1 / span 4; max-height:100%; min-height:0; height:100%; width:100%; object-fit:contain; }
  #s-battle .cmd.has-img > :not(.qbox):not(.cmd-img) { grid-column:2; }
  #s-battle .cmd.has-img > .cmd-img { grid-row:1 / 4; }
  #s-battle .cmd.has-img > .choices { grid-row:2; align-self:start; }
  #s-battle .cmd.has-img > .btn { grid-row:3; }
  #s-battle .cmd.has-img > #skills, #s-battle .cmd.has-img > .who.who, #s-battle .cmd.has-img > .downbox.downbox { grid-column:1 / -1 !important; }
  #s-battle .cmd.has-img > #skills { grid-row:4; }
  #s-battle .cmd:not(.has-img) .qbox { font-size:1.35em; }
  #s-battle .cmd:not(.has-img) .choices button { font-size:1.2em; padding:.8em; }
  .teambar { display:flex; gap:.35em; background:rgba(14,8,40,.62); border-radius:1em; padding:.3em .7em; }
  .chip { display:flex; flex-direction:column; align-items:center; font-size:.72em; font-weight:900; width:4.6em; }
  .chip img { height:2.8em; }
  .chip .bar { width:100%; height:.45em; }
  .chip.me { color:var(--q-gold); }
  .chip.me img { filter:drop-shadow(0 0 .2em #ffd23f); }
  .chip.ko img { filter:grayscale(1) brightness(.6); }
  .chip.hurt img { animation:hit .45s; }
  /* 上の段（1本）：班・まん中（ボスのHPか場所）・自分 */
  #s-battle .topline { background:rgba(14,8,40,.62); border-radius:1em; padding:.25em .7em; gap:1em; align-items:center; }
  #s-battle .topline .teambar { background:none; padding:0; }
  .chip { position:relative; width:4em; font-size:.68em; }
  .chip img { height:2.3em; }
  .chip.aimed img { filter:drop-shadow(0 0 .25em #ff3b5c) drop-shadow(0 0 .5em #ff3b5c); }
  .chip.aimed::before { content:"❗"; position:absolute; top:-.3em; right:.2em; font-size:1.2em; animation:bob .5s ease-in-out infinite; }
  .chip.healed img { filter:drop-shadow(0 0 .4em #5cf08f); }
  .midbar { flex:1; display:flex; align-items:center; gap:.6em; font-weight:900; min-width:0; }
  .midbar .nm { white-space:nowrap; }
  .midbar .bar.boss { flex:1; height:.55em; }
  .midbar .st { font-size:.8em; border-radius:999px; padding:0 .7em; white-space:nowrap; }
  .midbar .st:empty { display:none; }
  .midbar .st.cg { background:var(--ng); animation:blink .45s infinite alternate; }
  .midbar .st.br { background:#2f7ce0; }
  .mystat { width:11em; display:flex; flex-direction:column; gap:.2em; font-size:.8em; }
  .mystat .bar { height:.75em; }
  .mystat .lbl { width:1.8em; }
  /* 予兆：攻撃の前に身をかがめ、だれをねらうか出す */
  .foes .enemy.wind img { animation:windup .35s ease-in-out infinite alternate; }
  @keyframes windup { to { transform:translateY(.25em) scale(1.05, .93) rotate(-4deg); filter:brightness(1.2) drop-shadow(0 0 .4em #ff8a3b); } }
  .windmark { position:absolute; top:-2.6em; white-space:nowrap; font-weight:900; font-size:.8em; background:#ff8a3b; color:#2a1200; border-radius:999px; padding:0 .6em; z-index:6; }
  .windmark:empty { display:none; }
  /* 技ごとのエフェクト（敵の上に重ねる） */
  .dmg small { display:block; font-size:.35em; -webkit-text-stroke:0; text-shadow:0 .1em 0 #000; }
  .fx { position:absolute; inset:-25% -35% -10%; pointer-events:none; z-index:4; }
  .fx.slash::before, .fx.blaze::before { content:""; position:absolute; inset:0; background:linear-gradient(125deg, transparent 44%, #fff 48%, #e8f4ff 50%, #fff 52%, transparent 56%); animation:slash .5s ease-out forwards; filter:drop-shadow(0 0 .5em #fff) drop-shadow(0 0 1.2em #9fd8ff); }
  .fx.blaze::before { background:linear-gradient(125deg, transparent 38%, #ffd23f 45%, #fff 50%, #ff7a1c 55%, transparent 62%); filter:drop-shadow(0 0 .6em #ff7a1c); }
  .fx.blaze::after { content:""; position:absolute; inset:15%; border-radius:50%; background:radial-gradient(circle, rgba(255,160,40,.7), transparent 65%); animation:boom .6s ease-out forwards; }
  @keyframes slash { from { clip-path:inset(0 100% 100% 0); } 60% { clip-path:inset(0 0 0 0); opacity:1; } to { clip-path:inset(0 0 0 0); opacity:0; } }
  .fx.flare::before { content:""; position:absolute; inset:20%; border-radius:50%; background:radial-gradient(circle, #fff 0 10%, #ffd23f 25%, #ff5a1c 50%, transparent 70%); animation:boom .55s ease-out forwards; }
  @keyframes boom { from { transform:scale(.2); opacity:1; } to { transform:scale(1.6); opacity:0; } }
  .fx.spark::before { content:""; position:absolute; left:35%; right:35%; top:-20%; bottom:20%; background:#fff6a0; clip-path:polygon(55% 0, 20% 48%, 48% 48%, 25% 100%, 82% 40%, 54% 40%, 78% 0); filter:drop-shadow(0 0 .5em #ffe600) drop-shadow(0 0 1em #7cc8ff); animation:zap .5s steps(2) forwards; }
  @keyframes zap { 0%, 40% { opacity:1; } 20%, 60% { opacity:.2; } 100% { opacity:0; } }
  .fx.stellar::before, .fx.stellar::after { content:"★ ✦ ★"; position:absolute; left:0; right:0; top:-40%; text-align:center; font-size:2.4em; color:#fff3b8; text-shadow:0 0 .4em #ffd23f; letter-spacing:.4em; animation:fall .7s ease-in forwards; }
  .fx.stellar::after { content:"✦ ★ ✦"; animation-delay:.15s; opacity:0; }
  @keyframes fall { from { transform:translateY(0); opacity:1; } to { transform:translateY(160%); opacity:0; } }
  .fx.ragna::before { content:""; position:absolute; inset:-10%; background:conic-gradient(from 0deg, transparent 0 10%, #ffd23f 12%, transparent 14% 35%, #fff 37%, transparent 39% 60%, #ffd23f 62%, transparent 64% 85%, #fff 87%, transparent 89%); border-radius:50%; animation:boom .7s ease-out forwards; }
  .fx.light::before { content:""; position:absolute; left:40%; right:40%; top:-30%; bottom:0; background:linear-gradient(transparent, rgba(255,255,220,.95), transparent); filter:blur(.2em); animation:boom .5s ease-out forwards; }
  .quake { animation:quake .4s; }
  @keyframes quake { 25% { transform:translate(.4em, -.2em); } 50% { transform:translate(-.4em, .2em); } 75% { transform:translate(.2em, .1em); } }
  /* ド派手：衝撃の輪・飛び散る火花・技名のカットイン */
  .ring { position:absolute; left:50%; top:45%; width:6em; height:6em; margin:-3em 0 0 -3em; border-radius:50%; border:.35em solid var(--rc, #fff); box-shadow:0 0 1em var(--rc, #fff), inset 0 0 1em var(--rc, #fff); pointer-events:none; z-index:5; animation:ring .55s ease-out forwards; }
  .ring.big { border-width:.6em; animation-duration:.8s; }
  @keyframes ring { from { transform:scale(.2); opacity:1; } to { transform:scale(var(--rs, 3)); opacity:0; } }
  .pt { position:absolute; left:50%; top:45%; width:.55em; height:.55em; border-radius:50%; background:var(--pc, #fff); box-shadow:0 0 .6em var(--pc, #fff), 0 0 1.2em var(--pc, #fff); pointer-events:none; z-index:5; animation:pt var(--pd, .7s) cubic-bezier(.1,.8,.3,1) forwards; }
  @keyframes pt { from { transform:translate(0,0) scale(1.3); opacity:1; } to { transform:translate(var(--dx), var(--dy)) scale(.2); opacity:0; } }
  .hitflash { position:absolute; inset:0; z-index:4; pointer-events:none; background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.95), transparent 55%); mix-blend-mode:screen; animation:rf .35s forwards; }
  .cutin { position:absolute; left:-10%; right:-10%; top:34%; z-index:35; pointer-events:none; text-align:center; font-weight:900; font-size:2.6em; color:#fff; padding:.15em 0; transform:skewY(-4deg);
           background:linear-gradient(90deg, transparent, var(--cc, rgba(40,20,120,.9)) 15%, var(--cc, rgba(40,20,120,.9)) 85%, transparent); text-shadow:0 .08em 0 #000, 0 0 .5em var(--cg, #7cc8ff); letter-spacing:.12em; animation:cutin 1s cubic-bezier(.2,1,.3,1) forwards; }
  .cutin small { display:block; font-size:.38em; letter-spacing:0; opacity:.85; }
  .cutin.ult { font-size:3.6em; top:28%; --cc:rgba(140,60,0,.92); --cg:#ffd23f; color:#fff3b8; }
  @keyframes cutin { 0% { transform:skewY(-4deg) translateX(60%); opacity:0; } 18% { transform:skewY(-4deg) translateX(0); opacity:1; } 80% { transform:skewY(-4deg) translateX(-3%); opacity:1; } 100% { transform:skewY(-4deg) translateX(-60%); opacity:0; } }
  .quake.big { animation:quakeBig .6s; }
  @keyframes quakeBig { 10% { transform:translate(1em, -.5em) rotate(.6deg); } 30% { transform:translate(-1em, .6em) rotate(-.6deg); } 50% { transform:translate(.7em, .3em); } 70% { transform:translate(-.5em, -.3em); } 90% { transform:translate(.2em, .1em); } }
  .dmg { font-size:3.2em; }
  .dmg.crit { font-size:4.4em; color:#ffd23f; text-shadow:0 0 .4em #ff7a1c; }
  .ultflash { position:absolute; inset:0; background:#fff7d0; pointer-events:none; z-index:30; animation:rf .6s; }
  .foes { position:absolute; left:2%; right:2%; top:0; bottom:3%; display:flex; justify-content:space-around; align-items:flex-end; gap:1%; }
  .foes .enemy { position:relative; right:auto; bottom:auto; flex:1; min-width:0; cursor:pointer; transition:filter .2s; }
  .foes .enemy img { max-width:100%; object-fit:contain; }
  .foes .enemy .etag { font-size:.95em; }
  .foes .enemy .etag .bar { width:8em; }
  .foes .enemy.tg .etag span { background:var(--q-gold); color:var(--ink-dark); }
  .foes .enemy .aim { position:absolute; top:-1.5em; font-weight:900; color:var(--q-gold); text-shadow:0 .08em 0 rgba(0,0,0,.6); animation:bob 1s ease-in-out infinite; white-space:nowrap; }
  .foes .enemy.chg img { filter:drop-shadow(0 0 .5em #ff3b5c) drop-shadow(0 0 1.2em #ff3b5c); animation:shiver .25s linear infinite; }
  .foes .enemy.dead { pointer-events:none; }
  .foes .enemy.dead img { animation:down .7s forwards; }
  .foes .enemy.dead .etag { opacity:0; transition:opacity .5s; }
  .etag .cg { background:var(--ng) !important; color:#fff !important; animation:blink .45s infinite alternate; }
  @keyframes shiver { 0%,100% { transform:translateX(0); } 50% { transform:translateX(.12em); } }
  @keyframes blink { to { opacity:.45; } }
  .mate .bar.hp { width:5.2em; height:.55em; }
  .mate.me .bar.hp { width:7em; height:.7em; }
  .mate.hurt .hero { animation:hit .45s; }
  .ovban { position:absolute; left:0; right:0; top:32%; text-align:center; font-weight:900; font-size:2.1em; text-shadow:0 .1em 0 #000, 0 0 .6em #000; z-index:30; pointer-events:none; animation:ovb 2s forwards; }
  .ovban.big { color:#ff8a9a; font-size:2.5em; }
  @keyframes ovb { 0% { opacity:0; transform:scale(.6); } 12% { opacity:1; transform:scale(1.08); } 20% { transform:scale(1); } 85% { opacity:1; } 100% { opacity:0; } }
  .redflash { position:absolute; inset:0; background:#ff2040; opacity:0; pointer-events:none; z-index:25; animation:rf .5s; }
  @keyframes rf { 30% { opacity:.35; } }
  .cmd .who { font-size:.85em; opacity:.8; }
  .skillrow { display:flex; gap:.5em; justify-content:flex-end; align-items:center; }
  .skillrow .lbl2 { font-weight:900; font-size:.8em; opacity:.7; }
  .tgtrow { display:flex; gap:.35em; align-items:center; margin-right:auto; }
  .tgtrow button { font:inherit; font-weight:900; font-size:.8em; display:flex; align-items:center; gap:.3em; border:.15em solid rgba(255,255,255,.3); background:rgba(255,255,255,.1); color:#fff; border-radius:999px; padding:.15em .7em .15em .2em; cursor:pointer; }
  .tgtrow button img { height:1.8em; }
  .tgtrow button.on { background:var(--q-gold); color:var(--ink-dark); border-color:var(--q-gold); }
  .tgtrow button.dead { opacity:.25; pointer-events:none; }
  .tgtrow button.cg { border-color:var(--ng); box-shadow:0 0 .5em var(--ng); }
  .tgtrow kbd { font:inherit; font-size:.8em; background:rgba(0,0,0,.35); border-radius:.3em; padding:0 .3em; }
  .foes .enemy:hover img { filter:brightness(1.25) drop-shadow(0 0 .4em #ffd23f); }
  .foes .enemy .hint { position:absolute; bottom:-.2em; font-size:.75em; font-weight:900; opacity:0; transition:opacity .2s; white-space:nowrap; text-shadow:0 .08em 0 #000; }
  .foes .enemy:hover .hint { opacity:1; }
  .skillrow .act { flex-direction:row; gap:.5em; padding:.35em .9em; }
  .downbox { background:#5a1830; border-radius:.7em; padding:.4em .8em; font-weight:900; text-align:center; }
  .bt-top .team { display:flex; gap:.6em; }
  /* 練習（探索中の班員） */
  #s-prac { gap:.9em; }
  #s-prac .cmd { flex:1; justify-content:flex-start; }
  .prac-head { display:flex; gap:.8em; align-items:center; }
  .prac-head .panel { padding:.5em 1em; }
  /* フィールド */
  .door-lock { position:absolute; display:flex; align-items:center; justify-content:center; font-size:1em; z-index:200; pointer-events:none; }
  /* 投影 */
  #s-proj { padding:.6em; gap:.5em; background:#0a0720; }
  .pj-head { display:flex; justify-content:space-between; align-items:center; font-weight:900; }
  .pj-head .q-title { font-size:1.5em; }
  .pj-grid { flex:1; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:1fr 1fr; gap:.5em; min-height:0; }
  .tm { position:relative; border-radius:.7em; overflow:hidden; border:.15em solid rgba(255,255,255,.25); background:#1a1238; min-height:0; }
  .tm.mine { border-color:var(--q-gold); box-shadow:0 0 .8em rgba(255,210,63,.5); }
  .tm .th { position:absolute; left:0; right:0; top:0; z-index:40; display:flex; justify-content:space-between; padding:.25em .6em; font-weight:900; background:rgba(14,8,40,.75); }
  .tm .th .k { color:var(--q-gold); }
  .tm .mbg { position:absolute; inset:-1em; background:url(img/bg/lab.webp) center/cover; filter:blur(4px) brightness(.5); }
  .tm .mfoes { position:absolute; right:3%; top:16%; bottom:30%; left:38%; display:flex; justify-content:space-around; align-items:flex-end; }
  .tm .mfoe { display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; flex:1; min-width:0; position:relative; }
  .tm .mfoe img { max-height:80%; max-width:100%; object-fit:contain; animation:bob 2.4s ease-in-out infinite; }
  .tm .mfoe .bar { width:80%; height:.5em; margin-top:.2em; }
  .tm .mfoe.dead { opacity:0; transition:opacity .6s; }
  .tm .mfoe.chg img { filter:drop-shadow(0 0 .4em #ff3b5c); }
  .tm .mfoe .cgt { position:absolute; top:0; background:var(--ng); border-radius:999px; padding:0 .5em; font-size:.75em; font-weight:900; animation:blink .45s infinite alternate; }
  .tm .mparty { position:absolute; left:3%; bottom:5%; right:40%; display:flex; gap:.2em; align-items:flex-end; }
  .tm .mparty span { flex:1; display:flex; flex-direction:column; align-items:center; font-size:.7em; font-weight:900; }
  .tm .mparty img { height:3.2em; }
  .tm .mparty .bar { width:90%; height:.4em; }
  .tm .mparty .ko img { filter:grayscale(1) brightness(.6); transform:rotate(-70deg); }
  .tm .pdmg { position:absolute; top:10%; font-weight:900; font-size:1.6em; color:#fff; -webkit-text-stroke:.05em #2a1280; animation:dmg 1s forwards; pointer-events:none; }
  .tm .mfield { position:absolute; inset:0; overflow:hidden; }
  .tm .mfield .fd-map { transition:transform .25s linear; }
  .tm .status { position:absolute; left:0; right:0; bottom:0; z-index:40; text-align:center; font-weight:900; font-size:.85em; padding:.2em; background:rgba(14,8,40,.7); }
  .tm .ovban { font-size:1.4em; }
  /* ボス戦 */
  #s-battle.boss .bt-bg { background-image:url(img/bg/fantasy.webp); filter:blur(5px) brightness(.35) saturate(1.3) hue-rotate(-30deg); }
  #s-battle.boss .floor { background:radial-gradient(ellipse 60% 70% at 50% 30%, rgba(255,90,120,.35), transparent 70%), linear-gradient(transparent, rgba(0,0,0,.4)); }
  .foes .enemy.final { flex:2.2; }
  .foes .enemy.final .etag { display:none; }
  .bossbar { position:relative; z-index:2; display:flex; align-items:center; gap:.7em; font-weight:900; font-size:1.05em; background:rgba(14,8,40,.72); border:.12em solid rgba(255,120,140,.55); border-radius:999px; padding:.3em 1em; }
  .bossbar .nm { white-space:nowrap; color:#ffd0d8; }
  .bossbar .bar { flex:1; }
  .bossbar .st { font-size:.8em; background:var(--q-panel); border-radius:999px; padding:0 .7em; }
  .bossbar .st.cg { background:var(--ng); animation:blink .45s infinite alternate; }
  .bossbar .st.br { background:#2f7ce0; }
  .foes .enemy.barrier::after { content:""; position:absolute; left:50%; transform:translateX(-50%); aspect-ratio:1; top:4%; bottom:2%; border-radius:50%; border:.25em solid rgba(124,200,255,.9); background:radial-gradient(circle, rgba(124,200,255,.05) 50%, rgba(124,200,255,.35)); box-shadow:0 0 1.2em #7cc8ff; animation:glow 1.2s ease-in-out infinite alternate; pointer-events:none; z-index:3; }
  .dmg.guard { color:#9fd8ff; font-size:1.8em; }

  #s-clear .lvup { -webkit-text-stroke:0; text-shadow:0 .08em 0 #2a1280; font-size:2.2em; }
  #s-clear .story { background:none; box-shadow:none; padding:0; }

  .tm .mfoe.barrier img { filter:drop-shadow(0 0 .5em #7cc8ff) drop-shadow(0 0 .2em #7cc8ff); }

</head>
<body>
<div id="app">

<!-- 投影：全班 -->
<section class="screen" id="s-proj">
  <div class="pj-head"><div><span class="q-sub">2年3組 ・ 天気の変化のダンジョン</span> <span class="q-title">クエスト</span></div><div class="panel" style="padding:.3em 1em">のこり <b style="color:var(--q-gold)">4:12</b></div></div>
  <div class="pj-grid" id="pjGrid"></div>
</section>

<!-- リーダー：フィールド（ソロと同じ部品） -->
<section class="screen" id="s-town">
  <div class="fd-hud">
    <div class="panel fd-place">
      <div class="q-sub">2班 ・ 天気の変化のダンジョン</div>
      <b id="fdName"></b>
      <div class="fd-timer" id="fdTimer"></div>
    </div>
    <div class="grow"></div>
    <div class="panel row" style="padding:.5em .9em"><img class="hero sm" id="hudHero" alt=""><div><b>リーダー</b><span class="you-lead">先頭</span></div></div>
  </div>
  <div class="fd-wrap" id="wrap"><div class="fd-map" id="map"></div></div>
  <div class="fd-help" id="fdHelp">矢印キー（WASD）か、行きたい場所をクリックで移動。<b>魔物にぶつかると戦闘</b>。群れを倒すと、奥の番人の部屋の扉が開く。</div>
  <div class="fd-msg hide" id="fdMsg"></div>
  <div class="fd-flash" id="fdFlash"></div>
</section>

<!-- 班員：探索中の練習 -->
<section class="screen q-bg-lab" id="s-prac">
  <div class="prac-head">
    <div class="panel grow"><div class="q-sub">2班 ・ 天気の変化のダンジョン</div><b id="pracPlace" style="font-size:1.3em"></b></div>
    <div class="panel me-stat" id="pracStat"></div>
  </div>
