/* たいまつ：床に面した壁に、部屋ごとにまばらに */

(function () { for (var y = 0; y < MH; y++) for (var x = 0; x < MW; x++) if (isWall(x, y) && !isWall(x, y + 1) && cell(x, y + 1) !== 'f' && (x * 7 + y * 3) % 4 === 0 && !BLOCK.has(cell(x, y + 1)) || false) TORCHES.push([x + .5, y + .4]); })();

/* ---------- 今の見た目 ---------- */

/* ---------- 物・魔物・主人公 ---------- */

  MOBS.forEach(function (m, i) { h += '<div class="mob" style="' + bx(m[0], m[1]) + ';z-index:' + (m[1] * 10 + 5) + '"><img src="' + zako(U, i % 6) + '" alt=""></div>'; });
  h += '<div class="chr" id="hero" style="width:' + ts + 'px;height:' + ts + 'px"><img src="img/rikaria/chara/mage-a.webp" alt=""></div>';

/* ---------- 歩く・カメラ・光のつぶ ---------- */
function blocked(x, y) { var c = cell(x, y); return c === undefined || BLOCK.has(c) || MOBS.some(function (m) { return m[0] === x && m[1] === y; }); }
function route(tx, ty) {

var hold = null, STEP = 220;

var KEYS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
