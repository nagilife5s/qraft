<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base href="../">
<title>リカリア 町の13段階</title>
<style>body{margin:0;padding:16px;background:#140d38;color:#fff;font-family:"Hiragino Maru Gothic ProN",sans-serif}h1{font-size:1.3em}p{color:#c9c0ea}
.seg button{font:inherit;font-weight:800;border:0;background:#241a4a;color:#cfc6ff;padding:6px 14px;border-radius:999px;cursor:pointer;margin-right:6px}.seg button.on{background:#ffd86b;color:#2a1f4a}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px;margin-top:12px}figure{margin:0;background:#241a4a;border-radius:12px;overflow:hidden}img{width:100%;display:block;cursor:zoom-in}figcaption{padding:8px 12px;font-size:.9em;color:#ddd}b{color:#ffd86b}em{font-style:normal;background:#6a35e8;border-radius:99px;padding:0 .6em;margin-left:.4em;font-size:.85em}
#big{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center}#big img{max-width:97vw;max-height:95vh;width:auto}</style></head><body>
<h1>リカリア 町の13段階</h1><p>授業のチーム戦でボスを倒すと、クラスの町が1段階ずつ育つ。「歩く町」は、ひとりで冒険で実際に歩く町を、段階ごとに全体を縮めて撮ったもの（2026-11-24）。紫のしるしは、段階が記録されていないクラスが始まる段階。絵をタップすると大きく見られる。</p>
<div class="seg"><button class="on" data-v="walk">歩く町</button><button data-v="story">物語の絵</button></div>
<div class="g"><figure><img src="mock/town-walk/stage-0.webp" data-alt="img/rikaria/town/stage-0.webp" alt=""><figcaption><b>0. 廃墟の村</b> <em>1年の4月</em><br>がれきと枯れ木。こわれた噴水</figcaption></figure><figure><img src="mock/town-walk/stage-1.webp" data-alt="img/rikaria/town/stage-1.webp" alt=""><figcaption><b>1. 片付いた村</b><br>がれきが片付き、道ができた</figcaption></figure><figure><img src="mock/town-walk/stage-2.webp" data-alt="img/rikaria/town/stage-2.webp" alt=""><figcaption><b>2. 畑の村</b><br>畑と井戸がよみがえり、木に葉が戻った</figcaption></figure><figure><img src="mock/town-walk/stage-3.webp" data-alt="img/rikaria/town/stage-3.webp" alt=""><figcaption><b>3. 家の建つ村</b><br>民家が建ち直り、村の人が増えた</figcaption></figure><figure><img src="mock/town-walk/stage-4.webp" data-alt="img/rikaria/town/stage-4.webp" alt=""><figcaption><b>4. 村</b> <em>2年の4月</em><br>噴水に水が戻った</figcaption></figure><figure><img src="mock/town-walk/stage-5.webp" data-alt="img/rikaria/town/stage-5.webp" alt=""><figcaption><b>5. 広場の村</b><br>石畳の広場に街灯がともった</figcaption></figure><figure><img src="mock/town-walk/stage-6.webp" data-alt="img/rikaria/town/stage-6.webp" alt=""><figcaption><b>6. 水車の村</b><br>川に橋がかかり、水車が回りはじめた</figcaption></figure><figure><img src="mock/town-walk/stage-7.webp" data-alt="img/rikaria/town/stage-7.webp" alt=""><figcaption><b>7. 市場の村</b><br>市場に屋台が並び、旗と花がかざられた</figcaption></figure><figure><img src="mock/town-walk/stage-8.webp" data-alt="img/rikaria/town/stage-8.webp" alt=""><figcaption><b>8. 町</b> <em>3年の4月</em><br>町を囲む壁と門ができた</figcaption></figure><figure><img src="mock/town-walk/stage-9.webp" data-alt="img/rikaria/town/stage-9.webp" alt=""><figcaption><b>9. 時計塔の町</b><br>2階建ての家並みに時計塔が建った</figcaption></figure><figure><img src="mock/town-walk/stage-10.webp" data-alt="img/rikaria/town/stage-10.webp" alt=""><figcaption><b>10. 学びの町</b><br>図書館と天文台が建った</figcaption></figure><figure><img src="mock/town-walk/stage-11.webp" data-alt="img/rikaria/town/stage-11.webp" alt=""><figcaption><b>11. 城のある町</b><br>奥の城の修復が進んだ</figcaption></figure><figure><img src="mock/town-walk/stage-12.webp" data-alt="img/rikaria/town/stage-12.webp" alt=""><figcaption><b>12. 城下町</b><br>城がよみがえり、城下町が完成した</figcaption></figure></div><div id="big"></div>
<script>var b=document.getElementById('big');document.querySelectorAll('.g img').forEach(function(i){i.dataset.walk=i.getAttribute('src');i.onclick=function(){b.innerHTML='<img src="'+i.src+'">';b.style.display='flex'}});b.onclick=function(){b.style.display='none'};
document.querySelectorAll('.seg button').forEach(function(x){x.onclick=function(){document.querySelectorAll('.seg button').forEach(function(y){y.classList.toggle('on',y===x)});document.querySelectorAll('.g img').forEach(function(i){i.src=x.dataset.v==='walk'?i.dataset.walk:i.dataset.alt})}});</script></body></html>
