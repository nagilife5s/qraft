<title>リカリア 町の見た目モック</title>
<!-- 2026-11-17 モック。ひとりで冒険の町（段階8）の地面を、つながったタイル（キャンバスで手続き的に描く）と光の演出で描きなおす案。
     本番（quest.html / quest.css）は変えていない。地図の形は quest.html の buildTown(8) と同じ並び。
     ?mode=old|new  ?light=day|dusk で開ける。T キー：見た目の切りかえ、L キー：光の切りかえ。 -->
<style>

  var cnt = [0, 0, 0, 0, 0];

function hash(x, y) { var h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }

  for (var y = 0; y < MH; y++) for (var x = 0; x < MW; x++) h += '<div class="tile ' + OLDCLS[G[y][x]] + ((x + y) % 2 ? ' alt' : '') + '" style="left:' + x * TS + 'px;top:' + y * TS + 'px;width:' + TS + 'px;height:' + TS + 'px"></div>';
  document.getElementById('oldtiles').innerHTML = h;
}

/* ---------- 建物・物・人 ---------- */
var hero = { x: 4, y: 11, fx: 4, fy: 11, dir: 'right', path: [], last: 0 };
function paintEnts() {
  var ts = TS, h = '';
  function img(src, l, t, w, hh, z, cls) { return '<img class="ent ' + (cls || '') + '" src="' + src + '" alt="" style="left:' + l * ts + 'px;top:' + t * ts + 'px;width:' + w * ts + 'px;height:' + hh * ts + 'px;z-index:' + z + '">'; }
  for (var y = 0; y < MH; y++) for (var x = 0; x < MW; x++) { var pr = PROPS[G[y][x]]; if (pr) { var s = pr[1]; h += img('img/quest/' + pr[0] + '.webp', x + .5 - s / 2, y + 1 - s, s, s, y * 10 + 4); } }
  M.blds.forEach(function (b) {
    var bw = b.w + .6, bh = b.h + 1.6, lk = M.look[b.f];
    h += img(lk ? 'img/quest/town/' + lk + '.webp' : 'img/quest/' + BIMG[b.f] + '.webp', b.x - .3, b.y + b.h - bh, bw, bh, (b.y + b.h - 1) * 10 + 4);
    h += '<span class="bsign" style="left:' + (b.x + b.w / 2) * ts + 'px;top:' + (b.y + b.h - bh + .3) * ts + 'px">' + FACS[b.f] + (lk === 'castle-ruin' ? 'の跡' : '') + '</span>';
  });
  h += img('img/quest/bld-fountain.webp', 16 - .4, 11 - .5, 2.8, 2.6, 124);
  M.objs.forEach(function (o) { h += img('img/quest/town/' + o.s + '.webp', o.x + o.w / 2 - o.dw / 2, o.y + o.h - o.dh, o.dw, o.dh, o.z || ((o.y + o.h - 1) * 10 + 4)); });
  NPCS.forEach(function (n) { h += '<div class="chr" style="left:' + n.x * ts + 'px;top:' + n.y * ts + 'px;width:' + ts + 'px;height:' + ts + 'px;z-index:' + (n.y * 10 + 5) + '"><img src="img/quest/' + n.img + '.webp" alt=""></div>'; });
  h += '<div class="gatearrow" style="left:' + 35 * ts + 'px;top:' + 11 * ts + 'px;width:' + ts + 'px;height:' + 2 * ts + 'px">→</div>';
  h += '<div class="chr hero" id="hero" style="width:' + ts + 'px;height:' + ts + 'px"><img src="img/rikaria/chara/mage-a.webp" alt=""></div>';
  /* 街灯・塔の窓・噴水の光 */
  var gl = [];
  for (y = 0; y < MH; y++) for (x = 0; x < MW; x++) if (G[y][x] === 'L') gl.push([x + .5, y - .25, 2.6, 'rgba(255,196,110,.75)']);
  (M.towers || []).forEach(function (t) { gl.push([t[0] + .5, t[1] + .35, 1.4, 'rgba(255,200,120,.6)']); });
  gl.push([17.4, 11.2, 3.4, 'rgba(150,220,255,.45)']);
  gl.forEach(function (g) { h += '<div class="glow" style="left:' + (g[0] - g[2]) * ts + 'px;top:' + (g[1] - g[2]) * ts + 'px;width:' + 2 * g[2] * ts + 'px;height:' + 2 * g[2] * ts + 'px;background:radial-gradient(circle, ' + g[3] + ' 0%, ' + g[3].replace(/[\d.]+\)$/, '0.22)') + ' 35%, rgba(0,0,0,0) 70%);animation-delay:-' + (g[0] * 0.37 % 2.6).toFixed(2) + 's"></div>'; });
  document.getElementById('ents').innerHTML = h;
  var E = document.getElementById('ents'); (M.towers || []).forEach(function (t) { E.appendChild(towerCanvas(t[0], t[1])); }); var gc = gateCanvas(); if (gc) E.appendChild(gc);
  var map = document.getElementById('map'); map.style.width = MW * ts + 'px'; map.style.height = MH * ts + 'px'; map.style.fontSize = ts * .5 + 'px';
}

/* ---------- 歩く ---------- */
function blocked(x, y) { var c = cell(x, y); return c === undefined || BLOCK.has(c); }
function route(tx, ty) {
  var prev = new Map(), K = function (x, y) { return y * MW + x; }, q = [[hero.x, hero.y]]; prev.set(K(hero.x, hero.y), null);
  while (q.length) { var p = q.shift(); if (p[0] === tx && p[1] === ty) break;
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) { var nx = p[0] + d[0], ny = p[1] + d[1]; if (prev.has(K(nx, ny)) || blocked(nx, ny)) return; prev.set(K(nx, ny), p); q.push([nx, ny]); }); }
  var path = [], cur = prev.has(K(tx, ty)) ? [tx, ty] : null;
  while (cur && !(cur[0] === hero.x && cur[1] === hero.y)) { path.unshift(cur); cur = prev.get(K(cur[0], cur[1])); }
  hero.path = path;
}
var hold = null, STEP = 220;
function step(dx, dy) {
  hero.dir = dx < 0 ? 'left' : dx > 0 ? 'right' : dy < 0 ? 'up' : 'down';
  var nx = hero.x + dx, ny = hero.y + dy; if (blocked(nx, ny)) return false;
  hero.x = nx; hero.y = ny; hero.last = performance.now(); return true;
}
var KEYS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
document.addEventListener('keydown', function (e) {
  if (e.key === 't' || e.key === 'T') return setMode(document.body.classList.contains('old') ? 'new' : 'old');
  if (e.key === 'l' || e.key === 'L') return setLight(document.body.classList.contains('dusk') ? 'day' : 'dusk');
  if (KEYS[e.key]) { e.preventDefault(); hold = KEYS[e.key]; hero.path = []; }
});
document.addEventListener('keyup', function (e) { if (KEYS[e.key]) hold = null; });
document.getElementById('wrap').addEventListener('click', function (e) {
  var r = document.getElementById('map').getBoundingClientRect(); route(Math.floor((e.clientX - r.left) / TS), Math.floor((e.clientY - r.top) / TS));
});
setInterval(function () {
  if (hold) step(hold[0], hold[1]); else if (hero.path.length) { var p = hero.path.shift(); step(p[0] - hero.x, p[1] - hero.y); }
}, STEP);

/* ---------- カメラと光のつぶ ---------- */
var cam = { x: 0, y: 0, init: false }, motes = [], fx = document.getElementById('fx'), fctx = fx.getContext('2d'), SPARK = [];
function frame(t) {
  var wrap = document.getElementById('wrap'), ww = wrap.clientWidth, wh = wrap.clientHeight, ts = TS;
  var k = clamp((t - hero.last) / STEP, 0, 1); hero.fx = mix(hero.fx, hero.x, hero.fx === hero.x ? 1 : .0) ;
  /* 前のマスから今のマスへ、STEP かけて動く */
  if (hero.px == null) { hero.px = hero.x; hero.py = hero.y; }
  if (hero.tx !== hero.x || hero.ty !== hero.y) { hero.sx = hero.px; hero.sy = hero.py; hero.tx = hero.x; hero.ty = hero.y; }
  hero.px = mix(hero.sx == null ? hero.x : hero.sx, hero.x, k); hero.py = mix(hero.sy == null ? hero.y : hero.sy, hero.y, k);
  var he = document.getElementById('hero');
  if (he) { he.style.left = hero.px * ts + 'px'; he.style.top = hero.py * ts + 'px'; he.style.zIndex = Math.round(hero.py * 10 + 9); he.classList.toggle('left', hero.dir === 'left'); he.classList.toggle('walk', k < 1); }
  var W = MW * ts, H = MH * ts, tx = clamp(ww / 2 - (hero.px + .5) * ts, ww - W, 0), ty = clamp(wh / 2 - (hero.py + .5) * ts, wh - H, 0);
  if (!cam.init) { cam.x = tx; cam.y = ty; cam.init = true; } else { cam.x = mix(cam.x, tx, .18); cam.y = mix(cam.y, ty, .18); }
  document.getElementById('map').style.transform = 'translate(' + cam.x.toFixed(1) + 'px,' + cam.y.toFixed(1) + 'px)';
  /* fx：水のきらめきと光のつぶ */
  if (fx.width !== ww || fx.height !== wh) { fx.width = ww; fx.height = wh; }
  fctx.clearRect(0, 0, ww, wh);
  if (!document.body.classList.contains('old')) {
    var dusk = document.body.classList.contains('dusk'), s = t / 1000;
    fctx.globalCompositeOperation = 'lighter';
    SPARK.forEach(function (p) {
      var a = Math.max(0, Math.sin(s * p.sp + p.ph)); if (a < .05) return;
      var x = p.x * ts + cam.x + Math.sin(s * .5 + p.ph) * ts * .08, y = p.y * ts + cam.y; if (x < -20 || y < -20 || x > ww + 20 || y > wh + 20) return;
      fctx.strokeStyle = 'rgba(255,255,255,' + (a * .7) + ')'; fctx.lineWidth = Math.max(1.2, ts * .03);
      fctx.beginPath(); fctx.moveTo(x - ts * .12 * a, y); fctx.lineTo(x + ts * .12 * a, y); fctx.stroke();
    });
    motes.forEach(function (m) {
      m.y -= m.v; m.x += Math.sin(s * m.w + m.ph) * .25; if (m.y < -10) { m.y = wh + 10; m.x = Math.random() * ww; }
      var a = (.45 + .55 * Math.sin(s * 1.7 + m.ph)) * (dusk ? .95 : .55), r = m.r * (ts / 56);
      var g = fctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, r * 4); g.addColorStop(0, 'rgba(' + m.c + ',' + a + ')'); g.addColorStop(.25, 'rgba(' + m.c + ',' + a * .45 + ')'); g.addColorStop(1, 'rgba(' + m.c + ',0)');
      fctx.fillStyle = g; fctx.beginPath(); fctx.arc(m.x, m.y, r * 4, 0, 7); fctx.fill();
    });
    fctx.globalCompositeOperation = 'source-over';
  }
  requestAnimationFrame(frame);
}

/* ---------- 切りかえ ---------- */
function setMode(v) { document.body.classList.toggle('old', v === 'old'); document.body.classList.toggle('new', v !== 'old'); segOn('segMode', v); }
function setLight(v) { document.body.classList.toggle('dusk', v === 'dusk'); document.body.classList.toggle('day', v !== 'dusk'); segOn('segLight', v); }
function segOn(id, v) { document.querySelectorAll('#' + id + ' button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); }); }
document.querySelectorAll('#segMode button').forEach(function (b) { b.onclick = function () { setMode(b.dataset.v); }; });
document.querySelectorAll('#segLight button').forEach(function (b) { b.onclick = function () { setLight(b.dataset.v); }; });

function build() {
  var wrap = document.getElementById('wrap').getBoundingClientRect();
  TS = Math.max(24, Math.floor(Math.min(wrap.width / 17, wrap.height / 10.5)));
  TX = Math.min(64, Math.round(TS * Math.min(window.devicePixelRatio || 1, 1.5)));
  paintTerrain(document.getElementById('terrain')); paintOld(); paintEnts(); cam.init = false;
  document.getElementById('loading').style.display = 'none';
  window.READY = true;
}
var qs = new URLSearchParams(location.search);
setMode(qs.get('mode') || 'new'); setLight(qs.get('light') || 'dusk');
if (qs.get('x')) { hero.x = +qs.get('x'); hero.y = +qs.get('y'); }
(function () {
  var r = rng(3);
  for (var i = 0; i < 26; i++) motes.push({ x: r() * window.innerWidth, y: r() * window.innerHeight, v: .12 + r() * .3, r: 1.2 + r() * 1.8, w: .3 + r() * .6, ph: r() * 6, c: ['255,226,140', '255,240,200', '220,190,255', '255,190,220'][i % 4] });
  for (var y = 0; y < MH; y++) for (var x = 0; x < MW; x++) if (G[y][x] === '~') for (var j = 0; j < 2; j++) SPARK.push({ x: x + r(), y: y + r(), sp: .8 + r() * 1.6, ph: r() * 6 });
})();
setTimeout(function () { build(); requestAnimationFrame(frame); }, 30);
var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(build, 200); });
</script>
</body>
