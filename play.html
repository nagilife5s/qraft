<!DOCTYPE html>
<html lang="ja" data-bg="pop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qraft</title>
<link rel="icon" type="image/png" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="theme.css?v=20261022144625">
</head>
<body>
<div id="app">

<!-- 参加 -->
<section class="screen" id="s-join">
  <div class="center" style="flex:1; display:flex; flex-direction:column; gap:1.2em">
    <img class="logo-img" src="img/logo-wordmark.webp" alt="Qraft" style="height:7.6em">
    <div class="joincol">
      <div class="flabel">PIN（先生の画面の6けた）</div>
      <input class="field" id="pin" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="123456">
      <div class="flabel">ニックネーム</div>
      <input class="field" id="nick" autocomplete="off" maxlength="20" placeholder="なまえ">
      <button class="btn" id="btnJoin" style="margin-top:.4em">参加する</button>
      <div id="joinErr" class="err hide"></div>
    </div>
  </div>
</section>

<!-- 待機 -->
<section class="screen" id="s-wait">
  <div class="center" style="flex:1; display:flex; flex-direction:column; gap:.7em">
    <img class="logo-img" src="img/logo-wordmark.webp" alt="Qraft" style="height:7.6em">
    <div style="font-weight:900; font-size:2.6em">参加できました！</div>
    <div class="pill" id="meNick" style="font-size:1.6em"></div>
    <div class="mut" style="font-size:1.3em; margin-top:.4em">先生が始めるのを待っています</div>
    <div class="dots" style="margin-top:.6em"><span></span><span></span><span></span></div>
  </div>
</section>

<!-- 出題中・回答後 -->
<section class="screen" id="s-q">
  <div class="stu-top"><span class="pill" id="sqno"></span><span class="pill secpill" id="secpill" style="background:var(--pop1)"></span></div>
  <div class="timebar" id="timebar"><i></i></div>
  <div class="stu-q" id="sq"><img id="sqimg" class="qimg hide" alt=""><span id="sqtext"></span></div>
  <div class="stu-tiles" id="stiles"></div>
  <div id="textbox" class="hide">
    <input type="text" id="textAns" maxlength="40" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="ここに答えを入力">
    <div class="tnote" id="tnote"></div>
  </div>
  <div class="q-foot">
    <button class="btn hide" id="btnSubmit">送信</button>
    <div class="center" id="ansState" style="display:flex; font-weight:900; font-size:1.3em; min-height:1.6em"></div>
  </div>
</section>

<!-- 結果：正解 -->
<section class="screen res ok" id="s-ok">
  <div class="confetti" id="conf-ok"></div>
  <div class="inner">
    <div class="icon">✓</div><h2>正解！</h2>
    <div class="plus">+<span id="okpts">0</span> 点</div>
    <div class="ans" id="okans"></div>
    <div class="rank">いま <b id="okrank"></b> 位 / <span id="okn"></span>人</div>
    <div class="hint"><span class="up" id="okup"></span> ・ 合計 <span id="oktotal">0</span> 点</div>
  </div>
</section>

<!-- 結果：不正解 -->
<section class="screen res ng" id="s-ng">
  <div class="inner">
    <div class="icon">✕</div><h2>ざんねん…</h2>
    <div class="ans" id="ngans"></div>
    <div class="rank">いま <b id="ngrank"></b> 位 / <span id="ngn"></span>人</div>
    <div class="hint">合計 <span id="ngtotal">0</span> 点　次はとり返そう！</div>
  </div>
</section>

<!-- 結果：時間切れ -->
<section class="screen res late" id="s-late">
  <div class="inner">
    <div class="icon">⏱</div><h2>時間切れ！</h2>
    <div class="ans" id="lateans"></div>
    <div class="rank">いま <b id="laterank"></b> 位 / <span id="laten"></span>人</div>
    <div class="hint">合計 <span id="latetotal">0</span> 点　次は早めに押そう！</div>
  </div>
</section>

<!-- 集計中 -->
<section class="screen" id="s-collect">
  <div class="center" style="flex:1; display:flex; flex-direction:column; gap:.7em">
    <div style="font-weight:900; font-size:2.4em">集計中…</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</section>

<!-- ランキング -->
<section class="screen" id="s-rank">
  <div class="stu-top"><span class="pill" id="kprog"></span><span class="pill" style="background:var(--pop1)">🏆 ランキング</span></div>
  <div style="flex:1; display:flex; align-items:center"><div class="rk rkAnim" id="rk" style="width:100%"></div></div>
  <div class="center" style="display:flex"><span class="pill" id="mepill" style="font-size:1.4em; background:var(--pop1)"></span></div>
</section>

<!-- 終了 -->
<section class="screen" id="s-end">
  <div class="confetti" id="conf-end"></div>
  <div class="center" style="flex:1; display:flex; flex-direction:column; gap:.6em">
    <div class="title2" style="font-size:2.6em">🎉 ゲーム終了！</div>
    <div class="card" style="min-width:16em">
      <div class="mut" style="color:#5b5478; font-weight:800">あなたの順位</div>
      <div style="font-size:4.4em; font-weight:900; color:var(--bg2); line-height:1.1"><span id="endrank">-</span><small style="font-size:.4em"> 位 / <span id="endn">-</span>人</small></div>
      <div style="font-weight:900; font-size:1.3em"><span id="endpts">0</span> 点</div>
    </div>
    <div class="mut" style="font-size:1.1em" id="endtop"></div>
  </div>
</section>

<!-- 退出・部屋が閉じた -->
<section class="screen" id="s-kicked"><div class="center" style="flex:1; display:flex; flex-direction:column; gap:.7em"><div style="font-weight:900; font-size:2.2em">この部屋から退出になりました</div></div></section>
<section class="screen" id="s-closed"><div class="center" style="flex:1; display:flex; flex-direction:column; gap:.7em"><div style="font-weight:900; font-size:2.4em">ゲームは終了しました</div><div class="mut">ありがとうございました！</div></div></section>

</div>

<script src="firebase-config.js?v=20261022144625"></script>
<script type="module">
import { signIn, db, ref, set, get, onValue, serverTimestamp, serverNow, CHOICE_STYLE,
         $, el, fmt, motionOn, showScreen, stopAnim, countUp, confetti, buildRank,
         loadBackgrounds, applyBg, mountStage } from './lib.js?v=20261022144625';

mountStage();

var uid = null, pin = null, nick = '';
var state = null, scores = {}, kicked = false, closed = false;
var answeredQ = -1, pickedIdx = -1, selMask = 0, lastKey = '', timerId = null, BGS = [], bgReady = false;

/* ---------------------------------------------------------------- 起動と参加 */
(async function boot() {
  BGS = await loadBackgrounds(); bgReady = true; applyBg('pop', BGS, true);
  showScreen('s-join');
  try { uid = (await signIn()).uid; }
  catch (e) { joinErr(e.message); $('btnJoin').disabled = true; return; }

  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('qraft.player') || 'null'); } catch (e) {}
  var qp = new URLSearchParams(location.search).get('pin');            /* QRコードから来たときは、PINが入っている */
  if (saved) { $('pin').value = saved.pin; $('nick').value = saved.nick; }
  if (qp && /^\d{6}$/.test(qp)) { $('pin').value = qp; if (saved && saved.pin !== qp) $('nick').value = saved.nick || ''; }
  /* 画面を更新しても、同じ人として自動で戻る */
  if (saved && saved.pin && saved.nick && (!qp || qp === saved.pin)) join(saved.pin, saved.nick, true);
  else if (qp) $('nick').focus();
})();

function joinErr(msg) { $('joinErr').textContent = msg; $('joinErr').classList.remove('hide'); }

$('btnJoin').onclick = function () { join($('pin').value.trim(), $('nick').value.trim(), false); };
$('nick').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnJoin').click(); });

async function join(p, n, silent) {
  $('joinErr').classList.add('hide');
  if (!/^\d{6}$/.test(p)) { if (!silent) joinErr('PINは6けたの数字です'); return; }
  if (!n) { if (!silent) joinErr('ニックネームを入れてください'); return; }
  $('btnJoin').disabled = true;
  try {
    if (!(await get(ref(db, 'rooms/' + p + '/hostUid'))).exists()) {
      try { localStorage.removeItem('qraft.player'); } catch (e) {}
      throw new Error(silent ? '' : 'その PIN の部屋が見つかりません。');
    }
    var stt = (await get(ref(db, 'rooms/' + p + '/state'))).val();
    if (stt && stt.mode === 'chase') {          /* 追いかけっこの部屋は、専用の画面へ */
      try { localStorage.setItem('qraft.player', JSON.stringify({ pin: p, nick: n })); } catch (e) {}
      location.replace('chase-play.html?pin=' + p + (/[?&]sess=1/.test(location.search) ? '&sess=1' : '')); return;
    }
    if ((await get(ref(db, 'rooms/' + p + '/kicked/' + uid))).exists()) {
      kicked = true;
    } else {
      await set(ref(db, 'rooms/' + p + '/players/' + uid), { nick: n });
    }
    pin = p; nick = n;
    try { localStorage.setItem('qraft.player', JSON.stringify({ pin: p, nick: n })); } catch (e) {}
    start();
  } catch (e) {
    if (e.message) joinErr(e.message);
    $('btnJoin').disabled = false;
  }
}

function start() {
  $('meNick').textContent = nick;
  onValue(ref(db, 'rooms/' + pin + '/state'), function (s) {
    state = s.val();
    if (!state) { closed = true; clearSaved(); }
    else if (bgReady) applyBg(state.bg || 'pop', BGS);          /* 先生が選んだ背景に合わせる */
    render();
  });
  onValue(ref(db, 'rooms/' + pin + '/scores'), function (s) { scores = s.val() || {}; render(); });
  onValue(ref(db, 'rooms/' + pin + '/kicked/' + uid), function (s) { if (s.val()) { kicked = true; clearSaved(); render(); } });
  if (!timerId) timerId = setInterval(tick, 100);
  render();
}

function clearSaved() { try { localStorage.removeItem('qraft.player'); } catch (e) {} }

/* ---------------------------------------------------------------- 順位 */
function myRank() {
  var me = scores[uid];
  if (!me) return null;
  var ids = Object.keys(scores);
  var better = ids.filter(function (id) { return scores[id].total > me.total; }).length;
  /* この問題の前の順位（得点から、この問題で増えた分を引いて数える） */
  var myPrev = me.total - me.last;
  var before = ids.filter(function (id) { return scores[id].total - scores[id].last > myPrev; }).length + 1;
  return { rank: better + 1, n: ids.length, total: me.total, move: before - (better + 1) };
}

/* ---------------------------------------------------------------- 描画（画面が変わるときだけ作り直す） */
function render() {
  if (kicked) { if (lastKey !== 'kicked') { lastKey = 'kicked'; stopAnim(); showScreen('s-kicked'); } return; }
  if (closed) { if (lastKey !== 'closed') { lastKey = 'closed'; stopAnim(); showScreen('s-closed'); } return; }
  if (!state) return;
  var r = myRank();

  if (state.phase === 'lobby') {
    if (lastKey !== 'lobby') { lastKey = 'lobby'; stopAnim(); showScreen('s-wait'); }
  } else if (state.phase === 'question') {
    var key = 'q:' + state.i;
    if (lastKey !== key) { lastKey = key; stopAnim(); drawQuestion(); showScreen('s-q'); }
  } else if (state.phase === 'result') {
    var me = scores[uid], has = me && me.qi === state.i;
    var variant = !has ? 'collect' : me.ok ? 'ok' : me.c >= 0 ? 'ng' : 'late';
    var key2 = 'res:' + state.i + ':' + variant;
    if (lastKey !== key2) { lastKey = key2; stopAnim(); drawResult(variant, me, r); }
  } else if (state.phase === 'ranking') {
    var key3 = 'rank:' + state.i;
    if (lastKey !== key3) {
      lastKey = key3; stopAnim(); showScreen('s-rank');
      $('kprog').textContent = (state.i + 1) + ' / ' + state.n + '問 終了';
      buildRank($('rk'), (state.rows || []).map(function (x) { return Object.assign({}, x); }), nick);
    }
    $('mepill').textContent = r ? 'あなたは ' + r.rank + '位 / ' + r.n + '人（' + fmt(r.total) + '点）' : '';
  } else if (state.phase === 'end') {
    if (lastKey !== 'end') {
      lastKey = 'end'; stopAnim(); showScreen('s-end'); confetti($('conf-end'), 40);
      $('endrank').textContent = r ? r.rank : '-'; $('endn').textContent = r ? r.n : '-';
      countUp($('endpts'), r ? r.total : 0, 900, 500, true);
      $('endtop').textContent = (state.top || []).slice(0, 3).map(function (t, i) { return (i + 1) + '位 ' + t.nick; }).join(' ・ ');
    } else if (r) {
      $('endrank').textContent = r.rank; $('endn').textContent = r.n;
    }
  }
}

function drawQuestion() {
  $('sqno').textContent = '問題 ' + (state.i + 1) + ' / ' + state.n;
  $('sqtext').textContent = state.text;
  var im = $('sqimg');
  if (state.image) { im.src = state.image; im.classList.remove('hide'); } else { im.classList.add('hide'); }
  $('sq').classList.toggle('hasimg', !!state.image);
  var isText = state.type === 'text', choices = state.choices || [];
  var box = $('stiles'); box.textContent = ''; box.className = 'stu-tiles n' + choices.length;
  box.classList.toggle('hide', isText); $('textbox').classList.toggle('hide', !isText);
  selMask = 0;
  choices.forEach(function (c, idx) {
    var b = el('button', 'tile t' + idx);
    b.appendChild(el('span', 'sh', CHOICE_STYLE[idx].shape));
    if (c.image) { var im = el('img', 'ch-img'); im.src = c.image; im.alt = ''; b.appendChild(im); }
    if (c.t) b.appendChild(el('span', 'tx', c.t));
    b.onclick = function () { if (state.multi) toggle(idx, b); else answer(idx); };
    box.appendChild(b);
  });
  var sb = $('btnSubmit'); sb.classList.toggle('hide', !(state.multi || isText)); sb.disabled = true;
  $('ansState').textContent = state.multi ? 'あてはまるものを すべて選んで「送信」' : '';
  if (isText) {
    var inp = $('textAns'); inp.value = ''; inp.disabled = false;
    inp.inputMode = state.numeric ? 'decimal' : 'text';
    $('tnote').textContent = state.numeric ? '数字で答えてね' : '答えを打ち込んで、Enter か「送信」';
    setTimeout(function () { inp.focus(); }, 350);
  }
  var ring = $('timebar'); ring.classList.remove('hurry');
  answeredQ = answeredQ === state.i ? answeredQ : -1;    /* 画面を更新しても、回答済みの印は引き継ぐ */
  if (answeredQ === state.i) markPicked();
}

function drawResult(variant, me, r) {
  if (variant === 'collect') { showScreen('s-collect'); return; }
  var q;
  if (state.type === 'text') { q = (state.accept || []).slice(0, 3).join(' ／ '); }
  else { var cs = [].concat(state.correct); q = cs.map(function (i) { var c = state.choices[i]; return CHOICE_STYLE[i].shape + ' ' + (c.t || '（画像）'); }).join('　'); }
  var ansText = '正解は ' + q;
  if (variant === 'ok') {
    showScreen('s-ok'); confetti($('conf-ok'), 26);
    countUp($('okpts'), me.last, 900, 900, false);
    countUp($('oktotal'), me.total, 900, 1500, true);
    $('okans').textContent = q;
    $('okrank').textContent = r ? r.rank : '-'; $('okn').textContent = r ? r.n : '-';
    var mv = r ? r.move : 0;
    $('okup').textContent = mv > 0 ? '▲ ' + mv + 'つ上がった！' : mv < 0 ? '▼ ' + (-mv) + 'つ下がった' : '順位キープ！';
  } else if (variant === 'ng') {
    showScreen('s-ng');
    $('ngans').textContent = ansText; $('ngrank').textContent = r ? r.rank : '-'; $('ngn').textContent = r ? r.n : '-';
    countUp($('ngtotal'), me.total, 900, 1500, true);
  } else {
    showScreen('s-late');
    $('lateans').textContent = ansText; $('laterank').textContent = r ? r.rank : '-'; $('laten').textContent = r ? r.n : '-';
    countUp($('latetotal'), me.total, 900, 1500, true);
  }
}

/* ---------------------------------------------------------------- 回答 */
async function answer(idx) {
  if (!state || state.phase !== 'question' || answeredQ === state.i) return;
  var q = state.i;
  answeredQ = q; pickedIdx = idx;
  markPicked();
  try {
    await set(ref(db, 'rooms/' + pin + '/answers/' + q + '/' + uid), { c: idx, t: serverTimestamp() });
    $('ansState').textContent = '✋ 回答しました！ みんなを待っています…';
  } catch (e) {
    answeredQ = -1; pickedIdx = -1;
    document.querySelectorAll('#stiles .tile').forEach(function (x) { x.disabled = false; x.classList.remove('picked', 'dim'); });
    $('ansState').textContent = 'すでに回答済みか、送れませんでした。';
  }
}

function markPicked() {
  document.querySelectorAll('#stiles .tile').forEach(function (b, i) {
    var mine = state && state.multi ? !!(selMask & (1 << i)) : i === pickedIdx;
    b.classList.toggle('dim', !mine);
    b.classList.toggle('picked', mine && !(state && state.multi));
    b.disabled = true; b.style.pointerEvents = 'none';
  });
  $('btnSubmit').classList.add('hide');
}

/* 入力式：打ち込んだ答えを送る（合っているかの判定は先生の画面で行うので、正解は生徒の端末に送られない） */
async function submitText() {
  var v = $('textAns').value.trim(); if (!v) return;
  var q = state.i;
  answeredQ = q; $('textAns').disabled = true; $('btnSubmit').classList.add('hide');
  try {
    await set(ref(db, 'rooms/' + pin + '/answers/' + q + '/' + uid), { s: v.slice(0, 60), t: serverTimestamp() });
    $('ansState').textContent = '✋ 回答しました！ 「' + v.slice(0, 20) + '」';
  } catch (e) {
    answeredQ = -1; $('textAns').disabled = false; $('btnSubmit').classList.remove('hide');
    $('ansState').textContent = 'すでに回答済みか、送れませんでした。';
  }
}
$('textAns').addEventListener('input', function () { $('btnSubmit').disabled = !this.value.trim(); });
$('textAns').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing && this.value.trim()) { e.preventDefault(); $('btnSubmit').click(); } });

/* 複数選択：押すたびに選択が付く・外れる。最後に「送信」 */
function toggle(idx, b) {
  if (!state || answeredQ === state.i) return;
  selMask ^= (1 << idx);
  b.classList.toggle('sel', !!(selMask & (1 << idx)));
  $('btnSubmit').disabled = selMask === 0;
}
$('btnSubmit').onclick = async function () {
  if (!state || state.phase !== 'question' || answeredQ === state.i) return;
  if (state.type === 'text') { submitText(); return; }
  if (!state.multi || !selMask) return;
  var q = state.i;
  answeredQ = q; markPicked();
  try {
    await set(ref(db, 'rooms/' + pin + '/answers/' + q + '/' + uid), { m: selMask, t: serverTimestamp() });
    $('ansState').textContent = '✋ 回答しました！ みんなを待っています…';
  } catch (e) {
    answeredQ = -1;
    document.querySelectorAll('#stiles .tile').forEach(function (x) { x.disabled = false; x.style.pointerEvents = ''; x.classList.remove('dim'); });
    $('btnSubmit').classList.remove('hide');
    $('ansState').textContent = 'すでに回答済みか、送れませんでした。';
  }
};

/* 残り時間の表示（サーバー時刻で計算） */
function tick() {
  if (!state || state.phase !== 'question' || !state.t) return;
  var limitMs = state.limit * 1000;
  var left = Math.max(0, limitMs - (serverNow() - state.t));
  var tb = $('timebar');
  tb.firstChild.style.width = (left / limitMs * 100) + '%';
  tb.classList.toggle('hurry', left <= 5000 && left > 0);
  $('secpill').textContent = '残り ' + Math.ceil(left / 1000) + ' 秒';
  if (left <= 0) {
    document.querySelectorAll('#stiles .tile').forEach(function (b, i) {
      var mine = state.multi ? !!(selMask & (1 << i)) && answeredQ === state.i : i === pickedIdx;
      if (!mine) { b.disabled = true; b.classList.add('dim'); b.classList.remove('sel'); }
    });
    $('btnSubmit').classList.add('hide'); $('textAns').disabled = true;
    if (answeredQ !== state.i) $('ansState').textContent = '時間切れです';
  }
}
</script>
</body>
</html>
