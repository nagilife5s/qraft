<style>
  .hud-btns { display:flex; gap:.4em; }

  .itembar button:disabled { opacity:.4; cursor:default; }
  #s-battle .bt-bg { background-image:url(img/bg/lab.webp); }

  .czk-u .h { display:flex; justify-content:space-between; font-weight:800; gap:.5em; } .czk-u small { color:#c9c0ea; }

  .smith button.go { border:0; border-radius:999px; padding:.45em 1.1em; font:inherit; font-weight:900; background:#ff8a1c; color:#fff; cursor:pointer; margin-top:.4em; min-height:44px; }
  .smith button.go:disabled { background:#4b4380; color:#9a93b8; cursor:default; }
  @media (max-width:640px) { .smith { grid-template-columns:1fr; } }

  .zk-bar button { border:1px solid #6a5bd6; background:transparent; color:#fff; border-radius:999px; padding:.25em .9em; font:inherit; font-weight:800; cursor:pointer; min-height:40px; }
  .zk-bar button.on { background:#6a5bd6; }
  .zk-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px,1fr)); gap:.5em; overflow-y:auto; min-height:0; }
  .zk-card { background:rgba(0,0,0,.3); border-radius:.7em; padding:.45em; text-align:center; font-size:.85em; color:#fff; }
  .zk-card { min-width:0; }
  .zk-card img { display:block; margin:0 auto; width:76px; height:76px; object-fit:contain; }
  .zk-card b { display:block; white-space:nowrap; overflow:hidden; text-overflow:clip; line-height:1.3; }   /* 名前は画像の下に1行（長い名前は字を小さく。2026-11-20） */

  .zk-card small { display:block; font-size:.8em; color:#c9c0ea; }
  .zk-prog { height:.6em; background:#2a2260; border-radius:9px; overflow:hidden; margin:.3em 0 .2em; }
  .zk-prog i { display:block; height:100%; background:linear-gradient(90deg,#7b5cff,#7fe3ff); }
  .pk.zk { background:#120d3a; color:#fff; }
  .ura-img { filter:hue-rotate(250deg) saturate(1.6) brightness(.85) drop-shadow(0 0 14px #b44cff); }
  /* 技の一覧：スクロールできることが分かるように（スクロールバーを見せる・下に「まだあります」。2026-11-16） */
  .sk-wrap { position:relative; min-width:18em; min-height:0; overflow:hidden; display:flex; flex-direction:column; align-self:stretch; }
  .sk-wrap .skills { flex:1; min-height:0; overflow-y:scroll; align-content:start; padding-right:.5em; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; scrollbar-width:auto; scrollbar-color:#ffd23f rgba(255,255,255,.15); }
  .sk-wrap .skills::-webkit-scrollbar { width:12px; } .sk-wrap .skills::-webkit-scrollbar-thumb { background:#ffd23f; border-radius:6px; } .sk-wrap .skills::-webkit-scrollbar-track { background:rgba(255,255,255,.15); border-radius:6px; }
  .sk-wrap .skills:focus-visible { outline:.15em solid #ffd23f; outline-offset:.2em; }
  .sk-more { position:absolute; left:0; right:1em; bottom:0; padding:2.2em 0 .3em; text-align:center; font-weight:900; color:#ffe27a; pointer-events:none; background:linear-gradient(transparent, rgba(20,12,50,.95) 60%); transition:opacity .2s; }
  .sk-more.off { opacity:0; }
  /* rikaria.css の窓・メニューの行（quest.css?v=20261121050000 と混ぜないよう .gm-bg の中だけ） */
.gm-bg .cur { position:absolute; top:50%; width:.62em; height:.95em; margin-top:-.475em; opacity:0; pointer-events:none;
  background:linear-gradient(135deg, #ffffff, #7ff0ff 40%, #1fb6e8 75%, #1a6fc0); clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%); filter:drop-shadow(0 0 .3em #35e0ff) drop-shadow(0 0 .15em #fff); }
.gm-bg .win { position:relative; width:min(34em, 94%); margin-top:1.4em; background:rgba(10,12,44,.86); border:.18em solid #fff; border-radius:.7em; box-shadow:0 0 0 .22em rgba(10,12,44,.86), 0 .8em 2em rgba(0,0,0,.55); padding:1.5em .9em .8em; }
.gm-bg .wtitle { position:absolute; left:1em; top:-.95em; background:rgba(10,12,44,1); border:.14em solid #fff; border-radius:.45em; padding:.15em .9em; font-weight:900; font-size:1.15em; letter-spacing:.2em; }

.gm-bg .ritem.sel { background:linear-gradient(90deg, rgba(255,226,122,.18), rgba(255,226,122,.04)); }

.gm-bg .ritem .ic img { height:100%; width:auto; max-width:2.4em; object-fit:contain; filter:drop-shadow(0 .1em .15em rgba(0,0,0,.5)); }
.gm-bg .ritem .ic img + img { margin-left:-.5em; }
.gm-bg .ritem .txt { display:flex; flex-direction:column; gap:.15em; }
.gm-bg .ritem b { font-size:1.35em; font-weight:900; letter-spacing:.08em; }
.gm-bg .ritem small { font-size:.88em; font-weight:700; opacity:.75; }
.gm-bg .ritem.sel b { color:#ffe27a; }
.gm-bg .ritem.back { grid-template-columns:1.4em 1fr; margin-top:.5em; border-top:.08em dashed rgba(255,255,255,.3); border-radius:0 0 .4em .4em; padding:.7em .5em .45em; }
.gm-bg .ritem.back b { font-size:1.05em; }

  .gm-bg { position:fixed; inset:0; z-index:800; background:rgba(10,6,36,.55); display:flex; align-items:center; justify-content:center; }
  .gm-bg .win { width:min(24em, 92%); margin:0; font-size:clamp(14px, 2.4vh, 22px); }
  .gm-bg .ritem { grid-template-columns:1.4em 1fr; padding:.6em .5em; }
  .gm-bg .ritem b { font-size:1.25em; }
  .gm-confirm { display:flex; flex-direction:column; gap:.6em; padding:.4em .5em; }
  .gm-confirm .row { gap:.6em; }
  /* タイトルへもどる（町の右上に、目立つ色で。2026-11-16） */
  .btn.totitle { text-decoration:none; background:rgba(255,226,122,.95); color:#2a1280; }
  .wm-tabs { display:flex; gap:.4em; }
  #wmGo { font-size:1.15em; padding:.45em 1.2em; }
  .wm-hint { width:100%; box-sizing:border-box; background:rgba(255,226,122,.95); color:#2a1280; font-weight:900; font-size:1.1em; text-align:center; border-radius:.6em; padding:.35em 1em; white-space:normal; }

  .src label { display:flex; align-items:center; gap:.4em; font-weight:800; font-size:.92em; flex-wrap:wrap; }
  .src select { font:inherit; font-size:.9em; border-radius:.4em; padding:.15em .3em; max-width:11em; }

  .pk-list label { display:flex; gap:.5em; align-items:flex-start; padding:.45em .7em; border-bottom:1px solid #eee; font-size:.92em; cursor:pointer; }
  .pk-list label small { color:#6a6488; }
  .pk select, .pk button { font:inherit; padding:.4em .9em; border-radius:.5em; border:1px solid #bdb5de; background:#fff; color:#241c4a; cursor:pointer; }

<body>
<div id="app">

<!-- ログイン -->
<section class="screen center q-bg-town" id="s-login" style="gap:1em">
  <a class="toplink" href="rikaria.html">← タイトルへもどる</a>
  <div class="q-title">⚔️ クエスト ・ ひとりで冒険</div>
  <div class="card" style="display:flex;flex-direction:column;gap:.8em;align-items:center">
    <div class="row"><b>学年</b><div class="seg" id="segG"><button type="button" data-v="1">1年</button><button type="button" data-v="2">2年</button><button type="button" data-v="3">3年</button></div></div>
    <div class="row"><b>組</b><div class="seg" id="segC"></div></div>
    <b>出席番号</b><div class="numgrid" id="nums"></div>
    <div id="loginErr" class="err hide"></div>
  </div>
</section>

<!-- キャラ作成 -->
<section class="screen center q-bg-town" id="s-make" style="gap:1em;overflow:auto">
  <div class="q-title">職業をえらぼう</div>
  <div class="jobcards six" id="jobcards"></div>
  <div class="row" style="flex-wrap:wrap;justify-content:center"><b>見た目</b><div class="seg" id="typeSeg"><button type="button" data-v="a" class="on">タイプA<small>（短い髪）</small></button><button type="button" data-v="b">タイプB<small>（長い髪）</small></button></div></div>
  <div class="row"><b>キャラの名前</b><input class="namebox" id="cname" maxlength="8" placeholder="8文字まで"></div>
  <!-- 注意は名前の欄のすぐ下に出す（ボタンの下だと 1366×657 で画面の下に切れた。2026-11-15） -->
  <div id="makeErr" class="err hide" style="margin-top:0"></div>
  <div class="mut" id="makeNote" style="font-size:.85em">画面には本名ではなく、この名前が出ます。職業と名前は、あとから変えられません。</div>
  <button class="btn" id="btnMake">この職業にする</button>
</section>

<!-- フィールド（町・エリア） -->
<section class="screen" id="s-town">
  <div class="fd-hud">
    <div class="panel fd-place">
      <div class="q-sub" id="fdSub"></div>
      <b id="fdName"></b>
      <div class="row" id="fdStage" style="gap:.4em;margin-top:.2em"><span class="q-sub" style="font-size:.8em">発展</span><div class="stage" id="stage"></div><span class="q-sub" id="stageName" style="font-size:.8em"></span></div>
      <div id="fdTimer" class="fd-timer hide"></div>
    </div>
    <div class="grow"></div>
    <div class="panel row" style="padding:.5em .9em">
      <img class="hero sm" id="hudHero" alt="">
      <div><b id="hudName"></b> <span class="mut" id="hudLv"></span>
        <div class="row" style="gap:.4em;margin-top:.2em"><span class="lbl">HP</span><div class="bar hp" style="width:7em"><i id="hudHp"></i><b id="hudHpT"></b></div></div></div>
      <span class="pill" id="hudGold"></span>
    </div>
    <div class="hud-btns"><button class="btn ghost hide" id="goHome">町へもどる</button><button class="btn totitle" id="goMenu" type="button" aria-haspopup="dialog">メニュー</button></div>
  </div>
  <div class="fd-wrap"><div class="fd-map" id="map"></div></div>
  <canvas class="dg-mini" id="dgMini" aria-hidden="true"></canvas>
  <div class="dg-toast" id="dgToast" role="status"></div>
  <div class="dg-pad" id="dgPad" aria-label="移動ボタン"><span></span><button type="button" data-d="0,-1" aria-label="上">▲</button><span></span><button type="button" data-d="-1,0" aria-label="左">◀</button><button type="button" data-d="0,1" aria-label="下">▼</button><button type="button" data-d="1,0" aria-label="右">▶</button></div>
  <div class="fd-help" id="fdHelp">矢印キー（WASD）か、行きたい場所をクリックで移動。</div>
  <div class="fd-msg hide" id="fdMsg"></div>
  <div class="fd-flash" id="fdFlash"></div>
</section>

<!-- 冒険の地図 -->
<section class="screen" id="s-world" style="padding:1.2em 1.6em;gap:.8em;background:#1a1238">
  <div class="row">
    <div class="grow"><div class="q-sub" id="wmSub"></div><div class="q-title" style="white-space:nowrap">冒険の地図</div></div>
    <div class="wm-tabs seg" id="wmTabs"><button type="button" data-v="1">1年</button><button type="button" data-v="2">2年</button><button type="button" data-v="3">3年</button></div>
    <div class="panel" style="width:22em;padding:.6em 1em"><div class="wm-year" id="wmYear"></div></div>
    <button class="btn ghost" id="wmBack">町へもどる</button>
  </div>
  <div class="wm-hint hide" id="wmHint">🗺 行きたいダンジョンを押してね。1年〜3年の、どの単元にも行けるよ。</div>
  <div class="wm-body">
    <div class="wm-box"><div class="wm-map" id="wmMap"></div></div>
    <div class="wm-side hide" id="wmSide"></div>
    <div class="wm-legend"><span><i style="background:var(--ok)"></i>クリア</span><span><i style="background:var(--q-gold)"></i>いま挑戦中</span><span class="mut">場所を押すと説明が出る</span></div>
  </div>
</section>

<!-- ステータス・スキル -->
<section class="screen q-bg-town" id="s-stat" style="gap:1em">
  <div class="row"><div class="q-title grow">ステータス・スキル</div><span class="pill" id="spLeft"></span><button class="btn ghost" id="statBack">もどる</button></div>
  <div class="row" style="align-items:stretch;flex:1;min-height:0;flex-wrap:nowrap;overflow:hidden">
    <div class="panel" style="width:17em;flex:none;display:flex;flex-direction:column;gap:.7em;align-items:center;overflow-y:auto;min-height:0">
      <img class="hero stat-hero" id="stHero" alt="">
      <div style="text-align:center"><b style="font-size:1.4em" id="stName"></b><br><span class="mut" id="stJob"></span></div>
      <div class="stat-grid" id="stGrid"></div>
      <div class="bar xp" style="width:100%"><i id="stXp"></i><b id="stXpT"></b></div>
      <div style="width:100%" id="stEq"></div>
      <div class="inv" id="stInv"></div>
    </div>
    <div class="sk-wrap grow"><div class="skills" id="skills" tabindex="0" aria-label="技の一覧（スクロールできます）"></div><div class="sk-more" id="skMore" aria-hidden="true">▼ まだあります（下へスクロール）</div></div>
  </div>
</section>

<!-- 戦闘 -->
<section class="screen" id="s-battle">
  <div class="bt-bg"></div>
  <div class="bt-top">
    <span class="pill" id="bArea" style="background:rgba(18,10,48,.7);color:#fff"></span>
    <div class="grow"></div>
    <div class="panel me-stat">
      <div class="row" style="gap:.4em"><span class="lbl">HP</span><div class="bar hp grow"><i id="myhp"></i><b id="myhpT"></b></div></div>
      <div class="row" style="gap:.4em"><span class="lbl">MP</span><div class="bar mp grow"><i id="mymp"></i><b id="mympT"></b></div></div>
      <div class="bfx" id="bfx"></div>
    </div>
  </div>
  <div class="arena">
    <div class="floor"></div>
    <div class="party" id="party"></div>
    <div class="enemy" id="enemy">
      <div class="etag"><span id="ename"></span><div class="bar hp"><i id="ehp"></i></div><div class="eweak" id="eweak"></div></div>
      <img id="eimg" alt="">
      <div class="eshadow"></div>
    </div>
  </div>
  <div class="cmd" id="cmd"></div>
</section>

</div>
