<!DOCTYPE html>
<html lang="ja" data-bg="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qraft クエスト（ひとりで冒険）</title>
<link rel="icon" type="image/png" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="theme.css?v=20261111153512">
<link rel="stylesheet" href="quest.css?v=20261111153512">
<style>
  .hud-btns { display:flex; gap:.4em; }
  .hud-btns .btn { font-size:.85em; padding:.35em .9em; }
  .eq-row { display:flex; justify-content:space-between; gap:1em; font-weight:800; font-size:.9em; }
  .inv { display:flex; gap:.5em; flex-wrap:wrap; justify-content:center; }
  .inv span { background:rgba(255,255,255,.15); border-radius:999px; padding:.15em .7em; font-weight:800; font-size:.85em; }
  .shop-items button:disabled { opacity:.45; cursor:default; }
  .itembar { display:flex; gap:.4em; justify-content:center; flex-wrap:wrap; }
  .itembar button { font:inherit; font-weight:800; font-size:.85em; border:0; border-radius:999px; padding:.25em .8em; background:#fff; color:var(--ink-dark); cursor:pointer; }
  .itembar button:disabled { opacity:.4; cursor:default; }
  #s-battle .bt-bg { background-image:url(img/bg/lab.webp); }
  .tin { font:inherit; font-size:1.1em; font-weight:800; padding:.5em .8em; border-radius:.6em; border:0; width:100%; }
  .wm-side { max-height:calc(100% - 1.6em); overflow:auto; }
  .titles { display:flex; flex-direction:column; gap:.3em; }
</style>
</head>
<body>
<div id="app">

<!-- ログイン -->
<section class="screen center q-bg-town" id="s-login" style="gap:1em">
  <a class="toplink" href="index.html">← トップへ</a>
  <div class="q-title">⚔️ クエスト ・ ひとりで冒険</div>
  <div class="card" style="display:flex;flex-direction:column;gap:.8em;align-items:center">
    <div class="row"><b>学年</b><div class="seg" id="segG"><button type="button" data-v="1">1年</button><button type="button" data-v="2">2年</button><button type="button" data-v="3">3年</button></div></div>
    <div class="row"><b>組</b><div class="seg" id="segC"></div></div>
    <b>出席番号</b><div class="numgrid" id="nums"></div>
    <div id="loginErr" class="err hide"></div>
  </div>
</section>

<!-- キャラ作成 -->
<section class="screen center q-bg-town" id="s-make" style="gap:1em;overflow:auto">
  <div class="q-title">職業をえらぼう</div>
  <div class="jobcards" id="jobcards"></div>
  <div class="row" style="flex-wrap:wrap;justify-content:center"><b>見た目</b><div class="seg" id="typeSeg"><button type="button" data-v="a" class="on">タイプA<small>（短い髪）</small></button><button type="button" data-v="b">タイプB<small>（長い髪）</small></button></div></div>
  <div class="row"><b>キャラの名前</b><input class="namebox" id="cname" maxlength="8" placeholder="8文字まで"></div>
  <div class="mut" style="font-size:.85em">画面には本名ではなく、この名前が出ます。職業と名前は、あとから変えられません。</div>
  <button class="btn" id="btnMake">この職業にする</button>
  <div id="makeErr" class="err hide"></div>
</section>

<!-- フィールド（町・エリア） -->
<section class="screen" id="s-town">
  <div class="fd-hud">
    <div class="panel fd-place">
      <div class="q-sub" id="fdSub"></div>
      <b id="fdName"></b>
      <div class="row" id="fdStage" style="gap:.4em;margin-top:.2em"><span class="q-sub" style="font-size:.8em">発展</span><div class="stage" id="stage"></div><span class="q-sub" id="stageName" style="font-size:.8em"></span></div>
      <div id="fdTimer" class="fd-timer hide"></div>
    </div>
    <div class="grow"></div>
    <div class="panel row" style="padding:.5em .9em">
      <img class="hero sm" id="hudHero" alt="">
      <div><b id="hudName"></b> <span class="mut" id="hudLv"></span>
        <div class="row" style="gap:.4em;margin-top:.2em"><span class="lbl">HP</span><div class="bar hp" style="width:7em"><i id="hudHp"></i><b id="hudHpT"></b></div></div></div>
      <span class="pill" id="hudGold"></span>
    </div>
    <div class="hud-btns"><button class="btn ghost" id="goWorld">地図</button><button class="btn ghost" id="goStat">ステータス</button></div>
  </div>
  <div class="fd-wrap"><div class="fd-map" id="map"></div></div>
  <div class="fd-help" id="fdHelp">矢印キー（WASD）か、行きたい場所をクリックで移動。</div>
  <div class="fd-msg hide" id="fdMsg"></div>
  <div class="fd-flash" id="fdFlash"></div>
</section>

<!-- 冒険の地図 -->
<section class="screen" id="s-world" style="padding:1.2em 1.6em;gap:.8em;background:#1a1238">
  <div class="row">
    <div class="grow"><div class="q-sub" id="wmSub"></div><div class="q-title">冒険の地図</div></div>
    <div class="panel" style="width:22em;padding:.6em 1em"><div class="wm-year" id="wmYear"></div></div>
    <button class="btn ghost" id="wmBack">フィールドへ</button>
  </div>
  <div class="wm-body">
    <div class="wm-box"><div class="wm-map" id="wmMap"></div></div>
    <div class="wm-side hide" id="wmSide"></div>
    <div class="wm-legend"><span><i style="background:var(--ok)"></i>クリア</span><span><i style="background:var(--q-gold)"></i>いま挑戦中</span><span><i style="background:#9a96aa"></i>霧（未開放）</span><span class="mut">場所を押すと説明が出る</span></div>
  </div>
</section>

<!-- ステータス・スキル -->
<section class="screen q-bg-town" id="s-stat" style="gap:1em">
  <div class="row"><div class="q-title grow">ステータス・スキル</div><span class="pill" id="spLeft"></span><button class="btn ghost" id="statBack">もどる</button></div>
  <div class="row" style="align-items:stretch;flex:1;min-height:0;flex-wrap:wrap">
    <div class="panel" style="width:17em;display:flex;flex-direction:column;gap:.7em;align-items:center">
      <img class="hero stat-hero" id="stHero" alt="">
      <div style="text-align:center"><b style="font-size:1.4em" id="stName"></b><br><span class="mut" id="stJob"></span></div>
      <div class="stat-grid" id="stGrid"></div>
      <div class="bar xp" style="width:100%"><i id="stXp"></i><b id="stXpT"></b></div>
      <div style="width:100%" id="stEq"></div>
      <div class="inv" id="stInv"></div>
    </div>
    <div class="skills grow" id="skills" style="align-content:start;min-width:18em"></div>
  </div>
</section>

<!-- 戦闘 -->
<section class="screen" id="s-battle">
  <div class="bt-bg"></div>
  <div class="bt-top">
    <span class="pill" id="bArea" style="background:rgba(18,10,48,.7);color:#fff"></span>
    <div class="grow"></div>
    <div class="panel me-stat">
      <div class="row" style="gap:.4em"><span class="lbl">HP</span><div class="bar hp grow"><i id="myhp"></i><b id="myhpT"></b></div></div>
      <div class="row" style="gap:.4em"><span class="lbl">MP</span><div class="bar mp grow"><i id="mymp"></i><b id="mympT"></b></div></div>
    </div>
  </div>
  <div class="arena">
    <div class="floor"></div>
    <div class="party" id="party"></div>
    <div class="enemy" id="enemy">
      <div class="etag"><span id="ename"></span><div class="bar hp"><i id="ehp"></i></div></div>
      <img id="eimg" alt="">
      <div class="eshadow"></div>
    </div>
  </div>
  <div class="cmd" id="cmd"></div>
</section>

</div>

<script src="firebase-config.js?v=20261111153512"></script>
<script type="module">

         SK_MAX, SK_UNLOCK, SK_FREE, skOf, canUse, skMult, WEAPONS, ARMORS, weaponName, armorName, ITEMS, ITEM_KEYS, FACS, RESPEC_COST,
         statsOf, soloMult, soloReward, soloEnemyHp, BOSS } from './quest.js?v=20261111153512';

var Y = fiscalYear(), me = { g: 0, c: 0, n: 0 }, sid = '', ch = null, CLS = {}, SETS = [], AREAS = [], look = 'a', job = 'mage';

segPick('segG', 'g'); segPick('segC', 'c'); segPick('nums', 'n');

    ch = (await get(ref(db, 'quest/' + Y + '/chars/' + sid))).val();

/* ------------------------------------------------------------ キャラ作成 */
function makeScreen() {
  var box = $('jobcards'); box.textContent = '';

    var c = el('div', 'jobcard' + (k === job ? ' on' : '')); c.dataset.job = k;

    c.appendChild(el('h3', '', JOBS[k].name)); c.appendChild(el('p', '', JOBS[k].desc));
    c.onclick = function () { job = k; document.querySelectorAll('.jobcard').forEach(function (x) { x.classList.toggle('on', x.dataset.job === k); }); };
    box.appendChild(c);
  });
  showScreen('s-make');
}
$('typeSeg').onclick = function (e) {
  var b = e.target.closest('button'); if (!b) return; look = b.dataset.v;
  this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
  document.querySelectorAll('.jobcard img').forEach(function (im) { im.src = heroImg(im.parentNode.dataset.job, look); });
};
$('btnMake').onclick = async function () {
  var nm = $('cname').value.trim(); if (!nm) { err('makeErr', 'キャラの名前を入れてください'); return; }

  var c = { n: nm, j: job, lk: look, lv: 1, exp: 0, gold: 0, sp: 0, sk: { 0: 0, 1: 1, 2: 0 }, u: { '.sv': 'timestamp' } };
  try { await set(ref(db, 'quest/' + Y + '/chars/' + sid), c); ch = c; enterTown(); }
  catch (e) { err('makeErr', 'キャラを作れませんでした（ほかの人が先に作ったかもしれません）'); $('btnMake').disabled = false; }
};

/* キャラを保存する（ルールで、1回に増やせるのは 経験値300・ゴールド200 まで） */
async function saveChar() {
  var c = Object.assign({}, ch); c.u = { '.sv': 'timestamp' };
  try { await set(ref(db, 'quest/' + Y + '/chars/' + sid), c); return true; }
  catch (e) { alert('保存できませんでした。通信を確かめて、もう一度ためしてください。'); return false; }
}

/* ------------------------------------------------------------ エリア（単元）。学年の単元を順に並べる */
var WM_POS = [[30, 44], [52, 60], [58, 27], [81, 63], [40, 22], [70, 45], [24, 62], [64, 80]];
function buildAreas() {

  var foundNow = false;
  AREAS = list.slice(0, WM_POS.length).map(function (a, i) {
    var ar = (CLS.areas && CLS.areas[a.id]) || {};
    var st = ar.done ? 'clear' : (!foundNow ? 'now' : 'lock');
    if (st === 'now') foundNow = true;
    return Object.assign(a, { i: i, name: names[a.id] || a.unit + 'の封印の地', st: st, ar: ar, x: WM_POS[i][0], y: WM_POS[i][1] });
  });
}

/* ------------------------------------------------------------ フィールド（quest-mock.html の歩き方をそのまま使う） */
var STEP = 280;
function rng(seed) { return function () { return (seed = (seed * 16807) % 2147483647) / 2147483647; }; }
function grid(w, h, c) { return Array.from({ length: h }, function () { return Array(w).fill(c); }); }
function fill(g, x0, y0, x1, y1, c) { for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) if (g[y] && g[y][x] !== undefined) g[y][x] = c; }

  { x: 10, y: 14, img: 'npc-child', nm: '村の子ども', say: '魔物は、封印された知識が姿を変えたものなんだって。正解すると、知識が元にもどるんだよ！' },

  { x: 31, y: 10, img: 'npc-merchant', nm: '旅の商人', say: 'この門の先がエリアさ。地図で行き先を選んでから門を通るといい。霧の奥のボスは、授業でみんなと倒すんだ。' }
];
function buildTown() {
  var W = 36, H = 24, g = grid(W, H, '.');
  fill(g, 0, 0, W - 1, 1, 'T'); fill(g, 0, H - 2, W - 1, H - 1, 'T'); fill(g, 0, 0, 1, H - 1, 'T'); fill(g, W - 2, 0, W - 1, H - 1, 'T');
  fill(g, 28, 2, 29, H - 3, '~'); fill(g, 2, 11, W - 3, 12, '='); fill(g, 28, 11, 29, 12, 'H'); fill(g, W - 2, 11, W - 1, 12, 'G');
  fill(g, 12, 8, 21, 15, 'P'); fill(g, 16, 7, 17, 7, '=');
  fill(g, 6, 9, 6, 10, '='); fill(g, 25, 8, 25, 10, '='); fill(g, 6, 13, 6, 14, '='); fill(g, 25, 13, 25, 14, '=');
  fill(g, 3, 19, 12, 19, 'F'); fill(g, 22, 19, 26, 19, 'F');
  var blds = [{ x: 13, y: 2, w: 8, h: 5, f: 5 }, { x: 4, y: 6, w: 4, h: 3, f: 1 }, { x: 23, y: 4, w: 4, h: 4, f: 2 }, { x: 4, y: 15, w: 4, h: 3, f: 3 }, { x: 23, y: 15, w: 5, h: 3, f: 4 }];
  blds.forEach(function (b) { fill(g, b.x, b.y, b.x + b.w - 1, b.y + b.h - 1, 'B'); });
  fill(g, 16, 11, 17, 12, 'O');
  var r = rng(7);
  for (var y = 2; y < H - 2; y++) for (var x = 2; x < W - 2; x++) {
    if (g[y][x] !== '.') continue;
    var near = [[0, 1], [1, 0], [0, -1], [-1, 0]].some(function (d) { var v = g[y + d[1]] && g[y + d[1]][x + d[0]]; return !'.,'.includes(v == null ? 'T' : v); });
    var v = r();
    if (!near && v < .07) g[y][x] = 'T'; else if (v < .17) g[y][x] = ','; else if (!near && v < .19) g[y][x] = 'r';
  }
  [[3, 10], [9, 10], [15, 10], [22, 10], [26, 10], [3, 13], [11, 13], [22, 13], [27, 13]].forEach(function (p) { g[p[1]][p[0]] = 'L'; });
  [[12, 8], [21, 8], [12, 15], [21, 15]].forEach(function (p) { g[p[1]][p[0]] = 'V'; });
  [[8, 7], [8, 8], [3, 17], [27, 6]].forEach(function (p) { g[p[1]][p[0]] = 'R'; }); [[8, 16], [22, 6]].forEach(function (p) { g[p[1]][p[0]] = 'C'; });

  [[2, 4], [2, 8], [33, 4], [33, 18], [20, 20], [10, 21]].forEach(function (p) { if (g[p[1]][p[0]] === '.' || g[p[1]][p[0]] === ',') g[p[1]][p[0]] = 'U'; });

function buildArea() {
  var W = 42, H = 26, g = grid(W, H, '#');
  function room(x0, y0, x1, y1) { fill(g, x0, y0, x1, y1, 'k'); }

  fill(g, 32, 6, 40, 19, 'f'); fill(g, 0, 12, 0, 13, '<'); fill(g, 1, 12, 31, 13, 'c');
  for (var x = 16; x <= 26; x += 2) g[4][x] = 's';

  [[18, 7], [19, 7], [23, 7], [24, 7], [18, 17], [19, 17], [23, 17], [24, 17], [6, 4], [10, 22]].forEach(function (p) { g[p[1]][p[0]] = 't'; });

  [[21, 9], [21, 16]].forEach(function (p) { g[p[1]][p[0]] = 'q'; });
  [[15, 4], [27, 4], [4, 2], [12, 19]].forEach(function (p) { g[p[1]][p[0]] = 'y'; });

  [[4, 6], [11, 6], [4, 23], [5, 23]].forEach(function (p) { g[p[1]][p[0]] = 'z'; });

var TILE_CLS = { T: 't-tree', '.': 't-grass', ',': 't-flower', '=': 't-path', P: 't-plaza', '~': 't-water', H: 't-bridge', F: 't-fence', r: 't-rock', G: 't-gate', B: 't-grass', O: 't-plaza',
  k: 't-floor', '#': 't-wall', c: 't-carpet', s: 't-shelf', t: 't-table', x: 't-crystal', f: 't-fog', '<': 't-exitw' };
var BLOCK = new Set(['T', '~', 'F', 'r', 'B', 'O', '#', 's', 't', 'x', 'U', 'L', 'R', 'C', 'S', 'V', 'q', 'y', 'p', 'z', 'N']);
var PROPS = { T: ['prop-tree', 1.5, 't-grass'], r: ['prop-rock', 1, 't-grass'], U: ['prop-bush', 1.05, 't-grass'], L: ['prop-lamp', 1.6, 't-path'], R: ['prop-barrel', 1, 't-grass'], C: ['prop-crates', 1.15, 't-grass'], S: ['prop-sign', 1.25, 't-grass'], V: ['prop-flowers', .95, 't-plaza'],
  s: ['prop-shelf', 1.4, 't-floor'], t: ['prop-labtable', 1.15, 't-floor'], x: ['prop-crystal', 1.2, 't-floor'], q: ['prop-cauldron', 1.15, 't-floor'], y: ['prop-bookshelf', 1.8, 't-floor'], p: ['prop-pipes', 1.2, 't-floor'], z: ['prop-sacks', 1.1, 't-floor'] };
var BIMG = { 1: 'bld-item', 2: 'bld-church', 3: 'bld-weapon', 4: 'bld-library', 5: 'bld-castle' };
var MAPS = { town: buildTown(), area: buildArea() };
var FD = { key: 'town', pos: [4, 11], trail: [], mobs: [], path: [], hold: null, ts: 40, timers: [], busy: false };

  $('stGrid').innerHTML = '<span>HP</span><span>' + s.mhp + '</span><span>MP</span><span>' + MP_MAX + '</span><span>攻撃</span><span>' + s.atk + '</span><span>防御</span><span>' + s.def + '</span><span>💰</span><span>' + (ch.gold || 0) + '</span>';
  var nx = expToNext(ch.lv); $('stXp').style.width = ((ch.exp || 0) / nx * 100) + '%'; $('stXpT').textContent = 'つぎのレベルまで ' + (nx - (ch.exp || 0));
  $('stEq').innerHTML = '<div class="eq-row"><span>武器</span><span>' + weaponName(ch.j, eq.w) + '</span></div><div class="eq-row"><span>防具</span><span>' + armorName(eq.a) + '</span></div>';
  $('stInv').innerHTML = ITEM_KEYS.map(function (k) { return '<span>' + ITEMS[k].ic + ' ' + ITEMS[k].n + ' ×' + inv(k) + '</span>'; }).join('');
  $('spLeft').textContent = 'スキルポイント ' + (ch.sp || 0);
  var box = $('skills'); box.textContent = '';
  JOBS[ch.j].acts.forEach(function (a, i) {
    var d = el('div', 'skill' + (a.ult ? ' ult' : '')), g = el('div', 'grow');
    var nm = el('div', 'nm', a.n); if (i) nm.appendChild(el('span', 'tag', a.ult ? '大技' : '技')); g.appendChild(nm);
    var desc = a.heal ? (a.revive ? '班全員を復活・全回復' : '班のHPを回復') + '・回復量 +' + (sk[i] * 10) + '%' : '攻撃 ×' + a.a + '・威力 +' + (sk[i] * 10) + '%';
    desc += a.mp ? '　MP ' + a.mp : ''; if (a.streak) desc += '・' + a.streak + '連続正解で使える';
    if (!canUse(ch, i)) desc += '　🔒 ' + SK_UNLOCK[i] + 'ポイントで使えるようになる';
    g.appendChild(el('div', 'ds', desc));
    var pips = el('div', 'pips'); for (var k = 0; k < SK_MAX; k++) pips.appendChild(el('i', k < sk[i] ? 'on' : ''));
    g.appendChild(pips); d.appendChild(g);
    var b = el('button', '', '＋'); b.type = 'button'; b.disabled = !(ch.sp > 0) || sk[i] >= SK_MAX;
    b.onclick = async function () { b.disabled = true; var s2 = skOf(ch); s2[i]++; ch.sk = { 0: s2[0], 1: s2[1], 2: s2[2] }; ch.sp--; await saveChar(); drawStat(); };
    d.appendChild(b); box.appendChild(d);
  });
}

/* ------------------------------------------------------------ 戦闘（ひとりで冒険。正解は手元で判定する：家庭学習と同じ公開セットを使う） */
var B = null, POOLS = {};
async function poolOf(a) {
  if (POOLS[a.id]) return POOLS[a.id];
  var pool = [];
  for (var i = 0; i < a.sets.length; i++) { try { pool = pool.concat((await (await fetch('home/' + a.sets[i].id + '.json')).json()).questions); } catch (e) {} }
  POOLS[a.id] = { q: pool, queue: [] }; return POOLS[a.id];
}
async function startBattle(mob) {
  var P = await poolOf(curArea);
  if (!P.q.length) { FD.busy = false; say('<h3>問題が読めない</h3>通信を確かめて、もう一度ためしてください。'); return; }
  var max = soloEnemyHp(curArea.i);
  B = { mob: mob, e: ENEMIES[mob.id], hp: max, max: max, streak: 0, P: P };
  $('bArea').textContent = curArea.name; $('eimg').src = B.e.img; $('ename').textContent = B.e.n; $('enemy').className = 'enemy';
  $('party').innerHTML = '<div class="mate me"><span class="you">あなた</span><img class="hero" src="' + heroImg(ch.j, ch.lk) + '" alt="">' + ch.n + '</div>';
  showScreen('s-battle'); drawMe(); askQ();
}
function drawMe() {
  var s = statsOf(ch);
  $('myhp').style.width = (HP / s.mhp * 100) + '%'; $('myhpT').textContent = HP + '/' + s.mhp;
  $('mymp').style.width = (MP / MP_MAX * 100) + '%'; $('mympT').textContent = MP + '/' + MP_MAX;
  $('ehp').style.width = (B.hp / B.max * 100) + '%';
}
function itemBar(box) {
  var bar = el('div', 'itembar');
  ['potion', 'ether'].forEach(function (k) {
    var b = el('button', '', ITEMS[k].ic + ' ' + ITEMS[k].n + ' ×' + inv(k)); b.type = 'button';
    b.disabled = !inv(k) || (k === 'potion' && HP >= statsOf(ch).mhp) || (k === 'ether' && MP >= MP_MAX);
    b.onclick = async function () { ch.inv = Object.assign({}, ch.inv); ch.inv[k]--; if (k === 'potion') HP = Math.min(statsOf(ch).mhp, HP + 20); else MP = Math.min(MP_MAX, MP + 3); drawMe(); bar.replaceWith(itemBar(box)); await saveChar(); };
    bar.appendChild(b);
  });
  if (inv('wing')) { var w = el('button', '', '🪶 帰還の羽 ×' + inv('wing')); w.type = 'button'; w.onclick = async function () { ch.inv = Object.assign({}, ch.inv); ch.inv.wing--; await saveChar(); enterTown(); }; bar.appendChild(w); }
  return bar;
}
function askQ() {
  var P = B.P; if (!P.queue.length) P.queue = shuffle(P.q.map(function (_, i) { return i; }));
  var qi = P.queue.pop(), q = prepareQuestion(P.q[qi], true); q.qi = qi; B.q = q;
  var box = $('cmd'); box.textContent = '';
  var qb = el('div', 'qbox'); qb.appendChild(el('span', 'qnum', B.e.n + 'の問題' + (q.multi ? '（あてはまるものを すべて）' : '')));
  qb.appendChild(document.createTextNode(q.text));
  if (q.image) { var im = el('img', 'qimg'); im.src = q.image; im.style.maxHeight = '8em'; qb.appendChild(im); }
  box.appendChild(qb);
  if (q.type === 'text') {
    var inp = el('input', 'tin'); inp.type = 'text'; inp.placeholder = q.numeric ? '数字で答えてね' : 'ここに答えを入力'; inp.autocomplete = 'off';
    var sb = el('button', 'btn', '答える'); sb.onclick = function () { if (inp.value.trim()) judge(null, inp.value.trim()); };
    inp.onkeydown = function (e) { if (e.key === 'Enter' && !e.isComposing) sb.click(); };
    box.appendChild(inp); box.appendChild(sb); setTimeout(function () { inp.focus(); }, 100);
  } else {
    var chs = el('div', 'choices'), sel = 0;
    q.choices.forEach(function (c, i) {
      var b = el('button'); b.type = 'button';
      if (c.image) { var ci = el('img'); ci.src = c.image; ci.style.maxHeight = '3em'; b.appendChild(ci); }
      b.appendChild(document.createTextNode(c.t || ''));
      b.onclick = function () { if (q.multi) { sel ^= (1 << i); b.classList.toggle('right', !!(sel & (1 << i))); sub.disabled = !sel; } else judge(maskOf([i]), null); };
      chs.appendChild(b);
    });
    box.appendChild(chs);
    var sub = el('button', 'btn', '答える'); sub.disabled = true; sub.onclick = function () { if (sel) judge(sel, null); };
    if (q.multi) box.appendChild(sub);
  }
  box.appendChild(itemBar(box));
}
function judge(mask, text) {
  var q = B.q, ok = q.type === 'text' ? isTextCorrect(text, q.accept) : mask === maskOf(q.correct), box = $('cmd');
  box.querySelectorAll('button, input').forEach(function (b) { b.disabled = true; });
  box.querySelectorAll('.choices button').forEach(function (b, i) { b.classList.remove('right'); b.classList.add(q.correct.indexOf(i) >= 0 ? 'right' : 'dim'); });
  if (ok) {
    B.streak++; MP = Math.min(MP_MAX, MP + 1); drawMe();
    setTimeout(function () {
      box.textContent = ''; box.appendChild(el('div', 'banner ok', '✓ せいかい！ 技をえらぼう'));
      var acts = el('div', 'actions');
      JOBS[ch.j].acts.forEach(function (a, i) {
        var b = el('button', 'act' + (a.ult ? ' ult' : '')); b.type = 'button';
        b.appendChild(el('b', '', a.n));
        b.appendChild(el('small', '', !canUse(ch, i) ? '🔒 スキルで解放' : a.heal ? 'HPを回復' : '攻撃 ×' + a.a));
        b.appendChild(el('span', 'mp', a.mp ? 'MP ' + a.mp + (a.streak ? '・' + a.streak + '連続' : '') : 'MP 0'));
        b.disabled = !canUse(ch, i) || MP < a.mp || (a.streak && B.streak < a.streak);
        b.onclick = function () { act(i); };
        acts.appendChild(b);
      });
      box.appendChild(acts);
    }, 500);
  } else {
    B.streak = 0;
    var d = Math.max(3, enemyHit(ch.j, false) - (statsOf(ch).def - JOBS[ch.j].def)); HP = Math.max(0, HP - d);
    var pos = Math.min(B.P.queue.length, 3 + Math.floor(Math.random() * 4)); B.P.queue.splice(B.P.queue.length - pos, 0, q.qi);
    setTimeout(function () {
      drawMe();
      var msg = '✕ ざんねん… ' + B.e.n + 'の攻撃！ ' + d + 'のダメージ' + (q.type === 'text' ? '　正解は「' + q.accept.slice(0, 3).join(' ／ ') + '」' : '');
      box.appendChild(el('div', 'banner ng', msg));
      var nx = el('button', 'btn', HP ? 'つぎへ' : '町へもどる'); nx.style.alignSelf = 'center';
      nx.onclick = function () { if (HP) askQ(); else faint(); };
      box.appendChild(nx);
    }, 400);
  }
}
function act(i) {
  var a = JOBS[ch.j].acts[i], s = statsOf(ch), box = $('cmd');
  MP -= a.mp;
  var dmg = Math.round(s.atk * a.a * skMult(ch, i) * soloMult(ch.lv) * (0.9 + Math.random() * 0.2)), msg = ch.n + 'の' + a.n + '！';
  if (a.heal) { HP = Math.min(s.mhp, HP + Math.ceil(s.mhp * a.heal * skMult(ch, i))); msg += ' HPが回復！'; }
  if (dmg > 0) {
    B.hp = Math.max(0, B.hp - dmg); msg += ' ' + dmg + 'のダメージ';
    var en = $('enemy'); en.classList.remove('hit'); void en.offsetWidth; en.classList.add('hit');
    var dd = el('div', 'dmg' + (a.ult ? ' crit' : ''), String(dmg)); document.querySelector('#s-battle .arena').appendChild(dd); setTimeout(function () { dd.remove(); }, 1000);
  }
  drawMe(); box.textContent = ''; box.appendChild(el('div', 'banner ok', msg));
  setTimeout(function () { if (B.hp <= 0) win(); else askQ(); }, 1000);
}
async function win() {
  $('enemy').classList.add('down');
  var rw = soloReward(B.max, curArea.st === 'clear'), lv0 = ch.lv;
  ch.gold = (ch.gold || 0) + rw.gold; var up = addExp(ch, rw.exp);
  var saved = await saveChar();
  var box = $('cmd'); box.textContent = '';
  box.appendChild(el('div', 'banner ok', B.e.n + 'を たおした！　けいけんち +' + rw.exp + '　💰 +' + rw.gold + (up ? '　LEVEL UP! Lv.' + lv0 + '→' + ch.lv + '（スキルポイント +' + up + '）' : '') + (saved ? '' : '（保存できませんでした）')));
  if (up) HP = statsOf(ch).mhp;
  var nx = el('button', 'btn', 'フィールドにもどる'); nx.style.alignSelf = 'center';
  nx.onclick = function () {
    FD.mobs = FD.mobs.filter(function (m) { return m !== B.mob; });
    showScreen('s-town'); setTimeout(function () { openField('area', FD.pos); if (!FD.mobs.length) say('<h3>エリアの魔物をすべて倒した！</h3>町にもどると、また魔物があらわれる。'); });
  };
  box.appendChild(nx);
}
function faint() { alert(ch.n + 'は たおれてしまった…。町で休んで、もう一度挑戦しよう。'); enterTown(); }
</script>
