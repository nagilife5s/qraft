<!DOCTYPE html>
<html lang="ja" data-bg="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qraft クエスト（ひとりで冒険）</title>
<link rel="icon" type="image/png" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="theme.css?v=20261113170142">
<link rel="stylesheet" href="quest.css?v=20261113170142">
<style>
  .hud-btns { display:flex; gap:.4em; }
  .hud-btns .btn { font-size:.85em; padding:.35em .9em; }
  .eq-row { display:flex; justify-content:space-between; gap:1em; font-weight:800; font-size:.9em; }
  .inv { display:flex; gap:.5em; flex-wrap:wrap; justify-content:center; }
  .inv span { background:rgba(255,255,255,.15); border-radius:999px; padding:.15em .7em; font-weight:800; font-size:.85em; }
  .shop-items button:disabled { opacity:.45; cursor:default; }
  .itembar { display:flex; gap:.4em; justify-content:center; flex-wrap:wrap; }
  .itembar button { font:inherit; font-weight:800; font-size:.85em; border:0; border-radius:999px; padding:.25em .9em; min-height:44px; background:#fff; color:var(--ink-dark); cursor:pointer; }
  #s-battle .arena { min-height:8.5em; }
  /* まちがえたあと：選択肢を低くして、「つぎへ」「町へもどる」がいつも見えるように */
  #cmd.res-on .choices button { padding-top:.3em; padding-bottom:.3em; }
  #cmd.res-on .banner { padding:.25em .5em; }
  #cmd > .btn.next { font-size:1.2em; padding:.4em 2em; position:sticky; bottom:0; z-index:2; justify-self:center; }
  #cmd.res-on.has-img > .cmd-img { max-height:min(28cqh, 20em); }   /* 問題の箱が大きくなっても、キャラが場所の名前に重ならない */
  .itembar button:disabled { opacity:.4; cursor:default; }
  #s-battle .bt-bg { background-image:url(img/bg/lab.webp); }
  .tin { font:inherit; font-size:1.1em; font-weight:800; padding:.5em .8em; border-radius:.6em; border:0; width:100%; }
  .wm-side { max-height:calc(100% - 1.6em); overflow:auto; }
  .titles { display:flex; flex-direction:column; gap:.3em; }
</style>
</head>
<body>
<div id="app">

<!-- ログイン -->
<section class="screen center q-bg-town" id="s-login" style="gap:1em">
  <a class="toplink" href="rikaria.html">← トップへ</a>
  <div class="q-title">⚔️ クエスト ・ ひとりで冒険</div>
  <div class="card" style="display:flex;flex-direction:column;gap:.8em;align-items:center">
    <div class="row"><b>学年</b><div class="seg" id="segG"><button type="button" data-v="1">1年</button><button type="button" data-v="2">2年</button><button type="button" data-v="3">3年</button></div></div>
    <div class="row"><b>組</b><div class="seg" id="segC"></div></div>
    <b>出席番号</b><div class="numgrid" id="nums"></div>
    <div id="loginErr" class="err hide"></div>
  </div>
</section>

<!-- キャラ作成 -->
<section class="screen center q-bg-town" id="s-make" style="gap:1em;overflow:auto">
  <div class="q-title">職業をえらぼう</div>
  <div class="jobcards six" id="jobcards"></div>
  <div class="row" style="flex-wrap:wrap;justify-content:center"><b>見た目</b><div class="seg" id="typeSeg"><button type="button" data-v="a" class="on">タイプA<small>（短い髪）</small></button><button type="button" data-v="b">タイプB<small>（長い髪）</small></button></div></div>
  <div class="row"><b>キャラの名前</b><input class="namebox" id="cname" maxlength="8" placeholder="8文字まで"></div>
  <div class="mut" style="font-size:.85em">画面には本名ではなく、この名前が出ます。職業と名前は、あとから変えられません。</div>
  <button class="btn" id="btnMake">この職業にする</button>
  <div id="makeErr" class="err hide"></div>
</section>

<!-- フィールド（町・エリア） -->
<section class="screen" id="s-town">
  <div class="fd-hud">
    <div class="panel fd-place">
      <div class="q-sub" id="fdSub"></div>
      <b id="fdName"></b>
      <div class="row" id="fdStage" style="gap:.4em;margin-top:.2em"><span class="q-sub" style="font-size:.8em">発展</span><div class="stage" id="stage"></div><span class="q-sub" id="stageName" style="font-size:.8em"></span></div>
      <div id="fdTimer" class="fd-timer hide"></div>
    </div>
    <div class="grow"></div>
    <div class="panel row" style="padding:.5em .9em">
      <img class="hero sm" id="hudHero" alt="">
      <div><b id="hudName"></b> <span class="mut" id="hudLv"></span>
        <div class="row" style="gap:.4em;margin-top:.2em"><span class="lbl">HP</span><div class="bar hp" style="width:7em"><i id="hudHp"></i><b id="hudHpT"></b></div></div></div>
      <span class="pill" id="hudGold"></span>
    </div>
    <div class="hud-btns"><button class="btn ghost hide" id="goHome">町へもどる</button><button class="btn ghost" id="goWorld">地図</button><button class="btn ghost" id="goStat">ステータス</button></div>
  </div>
  <div class="fd-wrap"><div class="fd-map" id="map"></div></div>
  <div class="fd-help" id="fdHelp">矢印キー（WASD）か、行きたい場所をクリックで移動。</div>
  <div class="fd-msg hide" id="fdMsg"></div>
  <div class="fd-flash" id="fdFlash"></div>
</section>

<!-- 冒険の地図 -->
<section class="screen" id="s-world" style="padding:1.2em 1.6em;gap:.8em;background:#1a1238">
  <div class="row">
    <div class="grow"><div class="q-sub" id="wmSub"></div><div class="q-title">冒険の地図</div></div>
    <div class="panel" style="width:22em;padding:.6em 1em"><div class="wm-year" id="wmYear"></div></div>
    <button class="btn ghost" id="wmBack">フィールドへ</button>
  </div>
  <div class="wm-body">
    <div class="wm-box"><div class="wm-map" id="wmMap"></div></div>
    <div class="wm-side hide" id="wmSide"></div>
    <div class="wm-legend"><span><i style="background:var(--ok)"></i>クリア</span><span><i style="background:var(--q-gold)"></i>いま挑戦中</span><span><i style="background:#9a96aa"></i>霧（未開放）</span><span class="mut">場所を押すと説明が出る</span></div>
  </div>
</section>

<!-- ステータス・スキル -->
<section class="screen q-bg-town" id="s-stat" style="gap:1em">
  <div class="row"><div class="q-title grow">ステータス・スキル</div><span class="pill" id="spLeft"></span><button class="btn ghost" id="statBack">もどる</button></div>
  <div class="row" style="align-items:stretch;flex:1;min-height:0;flex-wrap:wrap">
    <div class="panel" style="width:17em;display:flex;flex-direction:column;gap:.7em;align-items:center">
      <img class="hero stat-hero" id="stHero" alt="">
      <div style="text-align:center"><b style="font-size:1.4em" id="stName"></b><br><span class="mut" id="stJob"></span></div>
      <div class="stat-grid" id="stGrid"></div>
      <div class="bar xp" style="width:100%"><i id="stXp"></i><b id="stXpT"></b></div>
      <div style="width:100%" id="stEq"></div>
      <div class="inv" id="stInv"></div>
    </div>
    <div class="skills grow" id="skills" style="align-content:start;min-width:18em;overflow:auto"></div>
  </div>
</section>

<!-- 戦闘 -->
<section class="screen" id="s-battle">
  <div class="bt-bg"></div>
  <div class="bt-top">
    <span class="pill" id="bArea" style="background:rgba(18,10,48,.7);color:#fff"></span>
    <div class="grow"></div>
    <div class="panel me-stat">
      <div class="row" style="gap:.4em"><span class="lbl">HP</span><div class="bar hp grow"><i id="myhp"></i><b id="myhpT"></b></div></div>
      <div class="row" style="gap:.4em"><span class="lbl">MP</span><div class="bar mp grow"><i id="mymp"></i><b id="mympT"></b></div></div>
      <div class="bfx" id="bfx"></div>
    </div>
  </div>
  <div class="arena">
    <div class="floor"></div>
    <div class="party" id="party"></div>
    <div class="enemy" id="enemy">
      <div class="etag"><span id="ename"></span><div class="bar hp"><i id="ehp"></i></div><div class="eweak" id="eweak"></div></div>
      <img id="eimg" alt="">
      <div class="eshadow"></div>
    </div>
  </div>
  <div class="cmd" id="cmd"></div>
</section>

</div>

<script src="firebase-config.js?v=20261113170142"></script>
<script type="module">
import { signIn, db, ref, set, get, $, el, showScreen, shuffle, prepareQuestion, maskOf, isTextCorrect } from './lib.js?v=20261113170142';
import { addExp, expToNext, migrateChar, newChar, JOBS as RJOBS, JOB_KEYS, LEARN, RANK_POW, RANK_SEC, LOAD_N, ELEMS, ELEM, UNITS,
         heroImg, fieldImg, skillName, rankOf, rankCost, canRankUp, rankUp, spUsed, loadoutOf, weakOf, statsOf } from './rikaria-data.js?v=20261113170142';
import { fiscalYear, ENEMIES, TOWN, TOWN_DEFAULT,
         weaponList, armorList, weaponName, armorName, TOWN_MAX, soloDayCap, dayNo, ITEMS, ITEM_KEYS, FACS, RESPEC_COST, ensureOwner, battleGuide,
         soloMult, soloReward, soloEnemyHp, soloEnemyAtkX, BOSS, cmdImg } from './quest.js?v=20261113170142';

var Y = fiscalYear(), me = { g: 0, c: 0, n: 0 }, sid = '', ch = null, CLS = {}, SETS = [], AREAS = [], look = 'a', job = 'mage';
var curArea = null, HP = 0, MP = 0;
var UID = null, lastWrite = 0;
function err(id, m) { $(id).textContent = m; $(id).classList.toggle('hide', !m); }
function stage() { return CLS.stage != null ? Math.min(TOWN_MAX, CLS.stage) : [0, 0, 4, 8][me.g] || 0; }   /* まだ町がないクラスは、学年の4月の段階 */
function town() { return CLS.town || TOWN_DEFAULT; }
function inv(k) { return (ch.inv && ch.inv[k]) || 0; }
/*
 * キャラは第2版（リカリア・2026-11-13）の形で読み書きする（ルールが第1版の sk を受け付けないため）。
 * 職業6つ・技10個・ランク（sr）・持っていく技（ld＝技4つ＋必殺技1つ）は、チーム戦（rikaria-data.js）と同じものを使う。
 * ひとりで冒険は「1人対1体・1問ずつ」なので、班や秒数の効果は下の act() で読みかえる（秒 → 問題の数、班 → 自分）。
 */
function RJ() { return RJOBS[ch.j] || RJOBS.warrior; }
function jobName() { return RJ().n; }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
/* 仲間がいないと意味がない技（ひとりで冒険では使えない） */
function teamOnly(s) { return !!(s.mpOne || s.mpAll); }
/* 効果の続く長さ：チーム戦の秒数 → 問題の数（5秒で1問） */
function turnsOf(sec, r) { return Math.max(1, Math.round(sec * RANK_SEC[r] / 5)); }
var ELM = 'fire';   /* 精霊使いの今の精霊 */
/* 敵のタイプ（苦手な精霊を決める）。工房の6体は rikaria-data.js の単元の表から */
var ZTYPE = {}; UNITS[0].z.forEach(function (z) { ZTYPE[z.n] = z.t; });

/* 施設の人（町の絵とNPC.md 2. 2026-11-13 確定）。FACS と同じ順。say＝村（0〜4）／にぎわう村（5〜8）／町（9〜12） */
var FAC_NPC = [
  { id: 'chief', nm: '村長ロウ', say: ['この村も、霧にのまれてしまった。だが、きみたちが答えるたびに、少しずつ景色がもどってくる', '見てごらん、人が帰ってきた。きみたちの正解が、この広場をにぎやかにしたんだ', 'もう村とは呼べんな。ここは、きみたちが三年かけて建てた町だ'] },
  { id: 'item', nm: '店主ミナ', say: ['品物は少ないけど、回復のしずくならあるよ。むりしないでね', '新しいしずくが入ったよ！ 町が育つと、仕入れも増えるんだ', 'いちばん効くのをそろえておいたよ。最後の冒険、気をつけて'] },
  { id: 'sister', nm: 'シスター・エル', say: ['よく来ましたね。ここでは、見た目を変えられますよ', '技のランクは、ここで見直せますよ。迷ったら、仲間と相談を', 'あなたたちの歩みを、ずっと見守っています'] },
  { id: 'smith', nm: '鍛冶屋ガルド', say: ['炉の火がやっと戻った。まずは基本の一本からだ', '腕が鳴るぜ。前より強い品を打てるようになった', 'これがおれの最高の仕事だ。持っていけ'] },
  { id: 'librarian', nm: '司書ノート', say: ['棚はほとんど白紙。取りもどした知識の書が、ここに並んでいくよ', '書がずいぶん増えたね。読み返すと、忘れにくくなるよ', '全部の棚がうまった。これはきみたちの三年間そのものだ'] },
  { id: 'gate', nm: '門番ベルク', say: ['この先は霧の中だ。いつか、城がよみがえる日まで待っていてくれ', '城の壁に、少しずつ光が戻ってきた。もう少しだ', 'よく来た、英雄たち。城が、きみたちを待っていた'] }
];
function npcBand() { var st = stage(); return st >= 9 ? 2 : st >= 5 ? 1 : 0; }
function npcHead(fi) {
  var p = FAC_NPC[fi], w = el('div', 'who'), im = el('img', 'npc6 hide'); im.alt = '';
  im.onload = function () { im.classList.remove('hide'); }; im.onerror = function () { im.remove(); };   /* 顔の絵がまだ無いときは出さない */
  im.src = 'img/quest/npc6-' + p.id + '.webp';
  var d = el('div', 'line'); d.appendChild(el('h3', '', p.nm)); d.appendChild(document.createTextNode('「' + p.say[npcBand()] + '」'));
  w.appendChild(im); w.appendChild(d); return w;
}

/* ------------------------------------------------------------ ログイン（家庭学習と同じ：学年・組・出席番号） */
for (var c = 1; c <= 9; c++) { var b0 = el('button', '', c + '組'); b0.type = 'button'; b0.dataset.v = c; $('segC').appendChild(b0); }
for (var n = 1; n <= 40; n++) { var b1 = el('button', '', String(n)); b1.type = 'button'; b1.dataset.v = n; $('nums').appendChild(b1); }
function segPick(id, key) { $(id).onclick = function (e) { var b = e.target.closest('button'); if (!b) return; me[key] = Number(b.dataset.v); this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); if (key === 'n') login(); }; }
segPick('segG', 'g'); segPick('segC', 'c'); segPick('nums', 'n');

(async function boot() {
  showScreen('s-login');
  try { UID = (await signIn()).uid; } catch (e) { err('loginErr', e.message); return; }
  try { SETS = await (await fetch('home/index.json', { cache: 'no-cache' })).json(); } catch (e) { err('loginErr', '問題の一覧を読めませんでした'); }
  try { var s = JSON.parse(localStorage.getItem('qraft.quest.me') || 'null'); if (s) { me = s; ['segG:g', 'segC:c', 'nums:n'].forEach(function (k) { var p = k.split(':'); $(p[0]).querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', Number(b.dataset.v) === me[p[1]]); }); }); } } catch (e) {}
})();
async function login() {
  err('loginErr', '');
  if (!me.g || !me.c) { err('loginErr', '学年と組を選んでください'); return; }
  sid = me.g + '-' + me.c + '-' + me.n;
  if (!(await ensureOwner({ db: db, ref: ref, get: get, set: set }, Y, sid, UID, me.g + '年' + me.c + '組' + me.n + '番'))) return;
  try {
    ch = (await get(ref(db, 'quest/' + Y + '/chars/' + sid))).val();
    CLS = (await get(ref(db, 'quest/' + Y + '/classes/' + me.g + '-' + me.c))).val() || {};
  } catch (e) { err('loginErr', '読みこめませんでした: ' + e.message); return; }
  try { localStorage.setItem('qraft.quest.me', JSON.stringify(me)); } catch (e) {}
  buildAreas();
  if (!ch) return makeScreen();
  if (migrateChar(ch)) { delete ch.u; if (!(await saveChar())) return; }   /* 第1版のキャラを移す（振っていたポイントは返る） */
  lastWrite = Date.now();   /* 前の書き込みから20秒あける決まりがあるので、読みこんだ時点から数える */
  enterTown();
}

/* ------------------------------------------------------------ キャラ作成 */
function makeScreen() {
  var box = $('jobcards'); box.textContent = '';
  JOB_KEYS.forEach(function (k) {
    var c = el('div', 'jobcard' + (k === job ? ' on' : '')); c.dataset.job = k;
    var im = el('img', 'hero'); im.src = heroImg(k, look); c.appendChild(im);
    c.appendChild(el('h3', '', RJOBS[k].n)); c.appendChild(el('p', '', RJOBS[k].trait));
    c.onclick = function () { job = k; document.querySelectorAll('.jobcard').forEach(function (x) { x.classList.toggle('on', x.dataset.job === k); x.setAttribute('aria-pressed', x.dataset.job === k ? 'true' : 'false'); }); };
    c.tabIndex = 0; c.setAttribute('role', 'button'); c.setAttribute('aria-pressed', k === job ? 'true' : 'false');   /* キーボードでも選べる */
    c.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); c.onclick(); } };
    box.appendChild(c);
  });
  showScreen('s-make');
}
$('typeSeg').onclick = function (e) {
  var b = e.target.closest('button'); if (!b) return; look = b.dataset.v;
  this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
  document.querySelectorAll('.jobcard img').forEach(function (im) { im.src = heroImg(im.parentNode.dataset.job, look); });
};
$('btnMake').onclick = async function () {
  var nm = $('cname').value.trim(); if (!nm) { err('makeErr', 'キャラの名前を入れてください'); return; }
  $('btnMake').disabled = true;
  /* 学年の始まりの目安のレベルから始める（1年 Lv1・2年 Lv16・3年 Lv30。その分のスキルポイントつき） */
  var c = newChar(nm, job, look, me.g); c.u = { '.sv': 'timestamp' };
  try { await set(ref(db, 'quest/' + Y + '/chars/' + sid), c); ch = c; lastWrite = Date.now(); enterTown(); }
  catch (e) { err('makeErr', 'キャラを作れませんでした（ほかの人が先に作ったかもしれません）'); $('btnMake').disabled = false; }
};

/*
 * キャラを保存する。ルールの決まり（firebase-rules.json）
 *   ・戦闘の報酬（gain=true）は、1回に経験値300・ゴールド200まで。前の書き込みから20秒以上あける
 *   ・買い物は、値段の分だけゴールドが減っていること。レベル・経験値は変えない
 * 報酬は、20秒たっていなければ待ってから保存し、だめなら少し待って2回までやり直す。
 */
async function saveChar(gain) {
  var c = Object.assign({}, ch); delete c.sk; c.u = { '.sv': 'timestamp' };
  for (var i = 0; i < 3; i++) {
    if (gain) { var w = lastWrite + 21000 - Date.now(); if (w > 0) await new Promise(function (r) { setTimeout(r, w); }); }
    try { await set(ref(db, 'quest/' + Y + '/chars/' + sid), c); lastWrite = Date.now(); return true; }
    catch (e) { if (!gain) break; lastWrite = Date.now(); }
  }
  alert('保存できませんでした。通信を確かめて、もう一度ためしてください。'); return false;
}

/* ------------------------------------------------------------ エリア（単元）。学年の単元を順に並べる */
var WM_POS = [[30, 44], [52, 60], [58, 27], [81, 63], [40, 22], [70, 45], [24, 62], [64, 80]];
function buildAreas() {
  var seen = {}, list = [];
  SETS.filter(function (s) { return s.grade === me.g; }).forEach(function (s) {
    if (!seen[s.unit]) { seen[s.unit] = { id: me.g + '-' + s.unit, unit: s.unit, uo: s.uo, sets: [] }; list.push(seen[s.unit]); }
    seen[s.unit].sets.push(s);
  });
  list.sort(function (a, b) { return a.uo - b.uo; });
  var names = { '1-分類': 'ささやきの森', '1-物質': 'まどろみの錬金工房', '1-音・光・力': 'ひびきの洞窟', '1-大地': 'ゆらぎの火山' };
  var foundNow = false;
  AREAS = list.slice(0, WM_POS.length).map(function (a, i) {
    var ar = (CLS.areas && CLS.areas[a.id]) || {};
    var st = ar.done ? 'clear' : (!foundNow ? 'now' : 'lock');
    if (st === 'now') foundNow = true;
    return Object.assign(a, { i: i, name: names[a.id] || a.unit + 'の封印の地', st: st, ar: ar, x: WM_POS[i][0], y: WM_POS[i][1] });
  });
}

/* ------------------------------------------------------------ フィールド（quest-mock.html の歩き方をそのまま使う） */
var STEP = 280;
function rng(seed) { return function () { return (seed = (seed * 16807) % 2147483647) / 2147483647; }; }
function grid(w, h, c) { return Array.from({ length: h }, function () { return Array(w).fill(c); }); }
function fill(g, x0, y0, x1, y1, c) { for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) if (g[y] && g[y][x] !== undefined) g[y][x] = c; }
var NPCS = [

  var box = $('cmd'); box.textContent = ''; box.classList.remove('has-img');   /* 図つきの問題のあとは、右半分に寄ってしまっていた */
  box.appendChild(el('div', 'banner ok', B.e.n + 'を たおした！　記録しています…'));   /* 前の記録から20秒たつまで待つことがある */
  var saved = await saveChar(true);
  box.textContent = '';
  box.appendChild(el('div', 'banner ok', B.e.n + 'を たおした！　けいけんち +' + rw.exp + (rw.gold ? '　💰 +' + rw.gold : '　💰 今日の上限に達しました') + (up ? '　LEVEL UP! Lv.' + lv0 + '→' + ch.lv + '（スキルポイント +' + up + '）' : '') + (saved ? '' : '（保存できませんでした）')));
  if (up) HP = statsOf(ch).mhp;
  var nx = el('button', 'btn', 'フィールドにもどる'); nx.style.alignSelf = 'center';
  nx.onclick = function () {
    FD.mobs = FD.mobs.filter(function (m) { return m !== B.mob; });
    showScreen('s-town'); setTimeout(function () { openField('area', FD.pos); if (!FD.mobs.length) say('<h3>エリアの魔物をすべて倒した！</h3>町にもどると、また魔物があらわれる。'); });
  };
  box.appendChild(nx);
}
function faint() { alert(ch.n + 'は たおれてしまった…。町で休んで、もう一度挑戦しよう。'); enterTown(); }
</script>
</body>
</html>
