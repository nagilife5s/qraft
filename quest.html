<div id="app">

<!-- ログイン -->

    <div id="loginErr" class="err hide"></div>
  </div>
</section>

<!-- キャラ作成 -->
<section class="screen center q-bg-town" id="s-make" style="gap:1em;overflow:auto">

  <div class="row" style="flex-wrap:wrap;justify-content:center"><b>見た目</b><div class="seg" id="typeSeg"><button type="button" data-v="a" class="on">タイプA<small>（短い髪）</small></button><button type="button" data-v="b">タイプB<small>（長い髪）</small></button></div></div>

  <div id="makeErr" class="err hide" style="margin-top:0"></div>
  <div class="mut" id="makeNote" style="font-size:.85em">画面には本名ではなく、この名前が出ます。職業と名前は、あとから変えられません。</div>
  <button class="btn" id="btnMake">この職業にする</button>
</section>

<!-- フィールド（町・エリア） -->
<section class="screen" id="s-town">
  <div class="fd-hud">
    <div class="panel fd-place">
      <div class="q-sub" id="fdSub"></div>
      <b id="fdName"></b>
      <div class="row" id="fdStage" style="gap:.4em;margin-top:.2em"><span class="q-sub" style="font-size:.8em">発展</span><div class="stage" id="stage"></div><span class="q-sub" id="stageName" style="font-size:.8em"></span></div>
      <div id="fdTimer" class="fd-timer hide"></div>
    </div>
    <div class="grow"></div>
    <div class="panel row" style="padding:.5em .9em">
      <img class="hero sm" id="hudHero" alt="">
      <div><b id="hudName"></b> <span class="mut" id="hudLv"></span>
        <div class="row" style="gap:.4em;margin-top:.2em"><span class="lbl">HP</span><div class="bar hp" style="width:7em"><i id="hudHp"></i><b id="hudHpT"></b></div></div></div>
      <span class="pill" id="hudGold"></span>
    </div>
    <div class="hud-btns"><button class="btn ghost hide" id="goHome">町へもどる</button><button class="btn totitle" id="goMenu" type="button" aria-haspopup="dialog">メニュー</button></div>
  </div>
  <div class="fd-wrap"><div class="fd-map" id="map"></div></div>
  <div class="fd-help" id="fdHelp">矢印キー（WASD）か、行きたい場所をクリックで移動。</div>
  <div class="fd-msg hide" id="fdMsg"></div>
  <div class="fd-flash" id="fdFlash"></div>
</section>

<!-- 冒険の地図 -->
<section class="screen" id="s-world" style="padding:1.2em 1.6em;gap:.8em;background:#1a1238">
  <div class="row">
    <div class="grow"><div class="q-sub" id="wmSub"></div><div class="q-title" style="white-space:nowrap">冒険の地図</div></div>
    <div class="wm-tabs seg" id="wmTabs"><button type="button" data-v="1">1年</button><button type="button" data-v="2">2年</button><button type="button" data-v="3">3年</button></div>
    <div class="panel" style="width:22em;padding:.6em 1em"><div class="wm-year" id="wmYear"></div></div>
    <button class="btn ghost" id="wmBack">町へもどる</button>
  </div>
  <div class="wm-hint hide" id="wmHint">🗺 行きたいダンジョンを押してね。1年〜3年の、どの単元にも行けるよ。</div>
  <div class="wm-body">
    <div class="wm-box"><div class="wm-map" id="wmMap"></div></div>
    <div class="wm-side hide" id="wmSide"></div>
    <div class="wm-legend"><span><i style="background:var(--ok)"></i>クリア</span><span><i style="background:var(--q-gold)"></i>いま挑戦中</span><span class="mut">場所を押すと説明が出る</span></div>
  </div>
</section>

<!-- ステータス・スキル -->
<section class="screen q-bg-town" id="s-stat" style="gap:1em">
  <div class="row"><div class="q-title grow">ステータス・スキル</div><span class="pill" id="spLeft"></span><button class="btn ghost" id="statBack">もどる</button></div>
  <div class="row" style="align-items:stretch;flex:1;min-height:0;flex-wrap:nowrap;overflow:hidden">
    <div class="panel" style="width:17em;flex:none;display:flex;flex-direction:column;gap:.7em;align-items:center;overflow-y:auto;min-height:0">
      <img class="hero stat-hero" id="stHero" alt="">
      <div style="text-align:center"><b style="font-size:1.4em" id="stName"></b><br><span class="mut" id="stJob"></span></div>
      <div class="stat-grid" id="stGrid"></div>
      <div class="bar xp" style="width:100%"><i id="stXp"></i><b id="stXpT"></b></div>
      <div style="width:100%" id="stEq"></div>
      <div class="inv" id="stInv"></div>
    </div>
    <div class="sk-wrap grow"><div class="skills" id="skills" tabindex="0" aria-label="技の一覧（スクロールできます）"></div><div class="sk-more" id="skMore" aria-hidden="true">▼ まだあります（下へスクロール）</div></div>
  </div>
</section>

<!-- 戦闘 -->
<section class="screen" id="s-battle">
  <div class="bt-bg"></div>
  <div class="bt-top">
    <span class="pill" id="bArea" style="background:rgba(18,10,48,.7);color:#fff"></span>
    <div class="grow"></div>
    <div class="panel me-stat">
      <div class="row" style="gap:.4em"><span class="lbl">HP</span><div class="bar hp grow"><i id="myhp"></i><b id="myhpT"></b></div></div>
      <div class="row" style="gap:.4em"><span class="lbl">MP</span><div class="bar mp grow"><i id="mymp"></i><b id="mympT"></b></div></div>
      <div class="bfx" id="bfx"></div>
    </div>
  </div>
  <div class="arena">
    <div class="floor"></div>
    <div class="party" id="party"></div>
    <div class="enemy" id="enemy">
      <div class="etag"><span id="ename"></span><div class="bar hp"><i id="ehp"></i></div><div class="eweak" id="eweak"></div></div>
      <img id="eimg" alt="">
      <div class="eshadow"></div>
    </div>
  </div>
  <div class="cmd" id="cmd"></div>
</section>

</div>

function toggleMus() { MUS_ON = !MUS_ON; try { localStorage.setItem('qraft.quest.bgm', MUS_ON ? 'on' : 'off'); } catch (e) {} var n = MUS; MUS = null; if (MUS_ON) music(n); else bgm(null); }

    if (s.stun) f.stun = Math.max(f.stun, r >= 2 ? 2 : 1);
    if (s.slow) f.slow = Math.max(f.slow, 2 + r);
    if (s.dot) f.dot = { d: Math.max(1, Math.round(st.atk * soloMult(ch.lv) * s.dot.pow * P)), t: turnsOf(s.dot.sec, r) };
    msg += ' ' + (done > 1 ? done + '回で ' : '') + total + 'のダメージ' + (anyCrit ? '　会心の一撃！' : '') + (anyWeak ? '　苦手をついた！' : '');
    var en = $('enemy'); en.classList.remove('hit'); void en.offsetWidth; en.classList.add('hit');
    var dd = el('div', 'dmg' + (s.ult || anyCrit ? ' crit' : ''), String(total)); document.querySelector('#s-battle .arena').appendChild(dd); setTimeout(function () { dd.remove(); }, 1000);
  }
  if (notes.length) msg += '　' + notes.join('・');
  drawMe(); box.textContent = ''; box.classList.remove('has-img'); box.appendChild(el('div', 'banner ok', msg));
  setTimeout(nextTurn, 1000);
}
async function win() {
  $('enemy').classList.add('down'); music('r-victory');
  var uid0 = unitOfArea(curArea).id, again = !!(ch.bc && ch.bc[uid0]);   /* ボスは、自分がもう倒したことがあれば復習（半分） */
  var rw = soloReward(B.max, B.boss ? again : curArea.st === 'clear', me.g, B.boss), lv0 = ch.lv, today = dayNo();
  if (B.boss) ch.bc = Object.assign({}, ch.bc || {}, (function (o) { o[uid0] = true; return o; })({}));
  /* 1日に稼げるゴールドの上限（gd＝日の番号・gg＝その日に稼いだ額。ルールでも同じ計算で止める） */
  var gg = ch.gd === today ? (ch.gg || 0) : 0; rw.gold = Math.max(0, Math.min(rw.gold, soloDayCap(me.g) - gg));
  ch.gd = today; ch.gg = gg + rw.gold;
  ch.gold = (ch.gold || 0) + rw.gold; var up = addExp(ch, rw.exp);
  var box = $('cmd'); box.textContent = ''; box.classList.remove('has-img');   /* 図つきの問題のあとは、右半分に寄ってしまっていた */
  box.appendChild(el('div', 'banner ok', B.e.n + 'を たおした！　記録しています…'));   /* 前の記録から20秒たつまで待つことがある */
  var saved = await saveChar(true);
  box.textContent = '';
  box.appendChild(el('div', 'banner ok', B.e.n + 'を たおした！' + (B.boss ? '　👑 ボスをたおした！' : '') + '　けいけんち +' + rw.exp + (rw.gold ? '　💰 +' + rw.gold : '　💰 今日の上限に達しました') + (up ? '　LEVEL UP! Lv.' + lv0 + '→' + ch.lv + '（スキルポイント +' + up + '）' : '') + (saved ? '' : '（保存できませんでした）')));
  if (up) HP = statsOf(ch).mhp;
  var nx = el('button', 'btn', 'フィールドにもどる'); nx.style.alignSelf = 'center';
  nx.onclick = function () {
    FD.mobs = FD.mobs.filter(function (m) { return m !== B.mob; });
    showScreen('s-town'); setTimeout(function () { openField('area', B.boss ? [31, 12] : FD.pos); if (B.boss) say('<h3>👑 ボスをたおした！</h3>' + unitOfArea(curArea).unit + 'の霧は、あなたの力で晴れた。'); else if (!FD.mobs.length) say('<h3>エリアの魔物をすべて倒した！</h3>町にもどると、また魔物があらわれる。'); });
  };
  box.appendChild(nx);
}
function faint() { alert(ch.n + 'は たおれてしまった…。町で休んで、もう一度挑戦しよう。'); enterTown(); }
</script>
