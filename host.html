<!DOCTYPE html>
<html lang="ja" data-bg="pop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qraft 先生用</title>
<link rel="icon" type="image/png" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="theme.css?v=20261022205840">
</head>
<body>
<div id="app">

<!-- ① 準備 -->
<section class="screen" id="s-setup">
  <div class="setup-wrap">
    <img class="logo-img" src="img/logo-wordmark.webp" alt="Qraft" style="height:5em">
    <div class="card setup">
      <div><a class="backlink" href="index.html">← もどる</a></div>
      <label style="margin-top:0">問題セット（学年・単元で絞り込み、複数えらべます）</label>
      <div id="picker"></div>
      <div class="selbar hide" id="selBar"><span id="selInfo"></span><span id="selChips"></span><button type="button" class="linkbtn" id="selClear">選びなおす</button></div>
      <div id="pwRow" class="hide"><label for="pw">問題のパスワード</label>
        <input type="password" id="pw" autocomplete="off" placeholder="先生だけが知っているパスワード">
        <div class="note">一度入れると、このパソコンのこのブラウザに覚えておきます</div></div>
      <div class="two">
        <div><label for="count">出題数</label><input id="count" type="number" min="1" value="8"><div class="note" id="countNote"></div></div>
        <div><label for="limitSel">1問の制限時間</label>
          <select id="limitSel"><option value="10">10 秒</option><option value="20" selected>20 秒</option><option value="30">30 秒</option><option value="45">45 秒</option><option value="60">60 秒</option></select></div>
      </div>
      <label class="chk"><input id="shuf" type="checkbox" checked> 選択肢の順番をシャッフルする</label>
      <label class="chk"><input id="textTime" type="checkbox" checked> 入力式の問題は、制限時間を1.5倍にする</label>
      <label>背景</label><div class="bgrow"></div>
      <div style="text-align:center;margin-top:1.4em"><button class="btn" id="btnCreate">ルームを作る</button></div>
      <div id="setupErr" class="err hide"></div>
    </div>
  </div>
</section>

<!-- ② 待機室 -->
<section class="screen" id="s-lobby" style="padding-top:2.2em; gap:1em">
  <div class="lobby-top"><img class="logo-img" src="img/logo-wordmark.webp" alt="Qraft" style="height:4.6em"><span class="qno" id="setTitle"></span></div>
  <div class="joinbox">
    <div class="card" style="flex:1.05"><div class="lab">① このアドレスを開く</div><div class="url" id="joinUrl"></div></div>
    <div class="card" style="flex:1.35"><div class="lab">② PINを入れる</div><div class="pin" id="pin">------</div></div>
    <div class="card" id="qrcard" style="flex:.55"><div class="qr" id="qr"></div><div class="lab" style="margin-top:.5em">QRで開く</div></div>
  </div>
  <div class="cnt-line">
    <b>👥 <span id="pcount">0</span>人が参加中</b>
    <div style="display:flex;gap:.8em;align-items:center">
      <div class="bgpick"><button type="button" class="fab">🎨 背景</button><div class="sw"></div></div>
      <button class="btn" id="btnStart" disabled>ゲームを始める</button>
    </div>
  </div>
  <div class="players" id="players"></div>
</section>

<!-- ③ 出題中 -->
<section class="screen" id="s-q">
  <div class="qhead"><span class="qno" id="qno"></span><div class="ring" id="ring"><b>20</b></div><span class="qno" id="ansCount"></span></div>
  <div class="qcard" id="qcard"><img id="qimg" class="qimg hide" alt=""><span id="qtext"></span></div>
  <div class="grid4" id="tiles"></div>
  <div class="hostbar"></div>
</section>

<!-- ④ 正解発表 -->
<section class="screen" id="s-reveal">
  <div class="qhead"><span class="qno" id="rqno"></span><span class="title2">正解は…！</span><span class="qno" id="rans"></span></div>
  <div class="qcard small" id="rqtext"></div>
  <div class="dist" id="dist"></div>
  <div class="hostbar"></div>
</section>

<!-- ⑤ ランキング -->
<section class="screen" id="s-rank">
  <div class="qhead"><span class="qno" id="kprog"></span><span class="title2">🏆 ランキング</span><span class="qno">順位が動きます</span></div>
  <div style="flex:1; display:flex; align-items:center"><div class="rk rkAnim" id="rk" style="width:100%"></div></div>
  <div class="hostbar"></div>
</section>

<!-- ⑥ 終了 -->
<section class="screen" id="s-end">
  <div class="confetti" id="conf"></div>
  <div class="center" style="flex:1; display:flex; flex-direction:column; gap:.6em">
    <div class="title2" style="font-size:2.8em">🎉 ゲーム終了！</div>
    <div class="podium" id="podium"></div>
    <div class="mut" id="rest" style="font-weight:800; font-size:1.2em"></div>
    <button class="btn sub" id="btnClose" style="margin-top:1em">ルームを閉じる</button>
    <div class="mut" style="font-size:.95em">閉じると、生徒の画面にも終了が表示されます</div>
  </div>
  <div class="bgpick fixed"><button type="button" class="fab">🎨 背景</button><div class="sw"></div></div>
</section>

</div>

<script src="firebase-config.js?v=20261022205840"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module">
import { mountSetPicker, avatarEl, signIn, db, ref, set, get, update, remove, onValue, serverTimestamp, serverNow,
         calcScore, CHOICE_STYLE, RESULT_SEC, RANK_SEC, sleep, shuffle,
         $, el, fmt, motionOn, showScreen, later, stopAnim, countUp, confetti, qrSvg, buildRank,
         loadBackgrounds, applyBg, buildBgPickers, savedBg, saveBg, mountStage, decryptSet, prepareQuestion, maskOf, isTextCorrect, normText } from './lib.js?v=20261022205840';

mountStage();

var uid = null, pin = null;
var game = [];            /* [{text, image, choices[], correct}] */
var limit = 20;           /* 秒 */
var players = {};         /* uid -> {nick} */
var scores = {};          /* uid -> {nick,total,last,ok,qi,c} */
var answers = {};         /* 現在の問題の回答 uid -> {c,t} */
var unsubAnswers = null;
var paused = false, skip = false, ended = false, started = false;
var tStart = 0, rankRows = [], setTitle = '';
var BGS = [], curBg = savedBg();

/* 先生の操作バー（一時停止・次へ・終了・背景）を、必要な画面に差し込む */
var HOSTBAR = '<button class="btn ghost hb-pause">一時停止</button><button class="btn ghost hb-next">次へ</button><button class="btn ghost hb-end">終了</button>' +
  '<span class="pausebadge hide hb-badge">⏸ 一時停止中</span><span style="flex:1"></span>' +
  '<div class="bgpick"><button type="button" class="fab">🎨 背景</button><div class="sw"></div></div>';
document.querySelectorAll('.hostbar').forEach(function (b) { b.innerHTML = HOSTBAR; });

/* ---------------------------------------------------------------- 背景（先生だけが選べる） */
function pickBg(k) {
  curBg = k; saveBg(k); applyBg(k, BGS);
  /* 部屋ができていれば、生徒の画面にも反映する。state は先生だけが書けるルールなので、生徒は変えられない */
  if (pin) update(ref(db, 'rooms/' + pin + '/state'), { bg: k }).catch(function () {});
}

/* state は丸ごと書き直すので、毎回 bg を含める */
function stateOf(extra) { return Object.assign({ bg: curBg, t: serverTimestamp() }, extra); }

/* ---------------------------------------------------------------- 準備 */
(async function init() {
  try {
    uid = (await signIn()).uid;
    BGS = await loadBackgrounds();
    if (!BGS.some(function (b) { return b.key === curBg; })) curBg = 'pop';
    applyBg(curBg, BGS, true);
    buildBgPickers(BGS, curBg, pickBg);

    SETS = await (await fetch('questions/index.json', { cache: 'no-cache' })).json();   /* 一覧は、いつも最新を取る */
    try { $('pw').value = localStorage.getItem('qraft.pw') || ''; } catch (e) {}
    try { JSON.parse(localStorage.getItem('qraft.picked') || '[]').forEach(function (f) { if (SETS.some(function (x) { return x.file === f; })) picked[f] = true; }); } catch (e) {}   /* 前回の選択を引き継ぐ */
    $('selClear').onclick = function () { Object.keys(picked).forEach(function (k) { delete picked[k]; }); picker.render(); updateSel(); };
    $('count').oninput = function () { countTouched = true; updateSel(); };
    picker = mountSetPicker($('picker'), { sets: SETS, key: function (s) { return s.file; }, picked: picked, onChange: updateSel }); updateSel();
  } catch (e) { setupErr(e.message); $('btnCreate').disabled = true; }
  showScreen('s-setup');
})();

var SETS = [], picked = {}, picker = null, countTouched = false;

function entryOf(file) { return SETS.filter(function (s) { return s.file === file; })[0]; }
/* 選んだセットのまとめ（合計問題数・出題数の初期値・パスワード欄） */
function updateSel() {
  var files = Object.keys(picked).filter(entryOf);
  var total = files.reduce(function (n, f) { return n + entryOf(f).count; }, 0);
  $('selBar').classList.toggle('hide', !files.length);
  $('selInfo').textContent = '選んだセット：' + files.length + 'つ・合計 ' + total + '問';
  var chips = $('selChips'); chips.textContent = '';
  files.slice(0, 6).forEach(function (f) {
    var c = el('span', 'chip2'); c.appendChild(el('span', '', entryOf(f).title));
    var x = el('button', '', '×'); x.type = 'button'; x.title = 'この選択をはずす';
    x.onclick = function () { delete picked[f]; picker.render(); updateSel(); };
    c.appendChild(x); chips.appendChild(c);
  });
  if (files.length > 6) chips.appendChild(el('span', 'chip2', 'ほか ' + (files.length - 6) + 'つ'));
  var cnt = $('count'); cnt.max = Math.max(1, total);
  if (!countTouched) cnt.value = total ? Math.min(total, 20) : '';
  $('countNote').textContent = total ? '選んだ ' + total + ' 問から、ランダムに出します' : '';
  $('pwRow').classList.toggle('hide', !files.some(function (f) { return entryOf(f).enc; }));
  try { localStorage.setItem('qraft.picked', JSON.stringify(files)); } catch (e) {}
}

function setupErr(msg) { $('setupErr').textContent = msg; $('setupErr').classList.remove('hide'); }

$('btnCreate').onclick = async function () {
  $('setupErr').classList.add('hide');
  $('btnCreate').disabled = true;
  try {
    var files = Object.keys(picked).filter(entryOf);
    if (!files.length) throw new Error('問題セットを1つ以上えらんでください');
    var needPw = files.some(function (f) { return entryOf(f).enc; }), pwv = $('pw').value;
    if (needPw && !pwv) throw new Error('問題のパスワードを入れてください');
    var pool = [], titles = [];
    for (var k = 0; k < files.length; k++) {
      var entry = entryOf(files[k]);
      $('btnCreate').textContent = '読み込み中… (' + (k + 1) + '/' + files.length + ')';
      var data = await (await fetch('questions/' + entry.file)).json();
      if (data.enc) data = await decryptSet(data, pwv);        /* パスワードが違うと、ここで「パスワードが違います」になる */
      pool = pool.concat(data.questions); titles.push(entry.title);
    }
    if (needPw) { try { localStorage.setItem('qraft.pw', pwv); } catch (e) {} }
    setTitle = files.length === 1 ? titles[0] : titles[0] + ' ほか' + (files.length - 1) + 'セット';
    var qs = shuffle(pool.slice());
    var n = Math.max(1, Math.min(Number($('count').value) || qs.length, qs.length));
    qs = qs.slice(0, n);
    limit = Number($('limitSel').value);
    var doShuffle = $('shuf').checked;
    game = qs.map(function (q) { return prepareQuestion(q, doShuffle); });
    game.forEach(function (q) { q.limit = (q.type === 'text' && $('textTime').checked) ? Math.round(limit * 1.5) : limit; });   /* 入力には時間がかかる */

    /* 使われていない PIN を引く */
    for (var i = 0; i < 20; i++) {
      pin = String(Math.floor(100000 + Math.random() * 900000));
      if (!(await get(ref(db, 'rooms/' + pin + '/hostUid'))).exists()) break;
    }
    await set(ref(db, 'rooms/' + pin + '/hostUid'), uid);
    await set(ref(db, 'rooms/' + pin + '/state'), stateOf({ phase: 'lobby' }));

    onValue(ref(db, 'rooms/' + pin + '/players'), function (s) { players = s.val() || {}; renderLobby(); });

    var base = location.href.replace(/host\.html.*$/, '');
    var host = base.replace(/^https?:\/\//, '');
    var u = $('joinUrl'); u.textContent = '';
    var cut = host.indexOf('/');
    u.appendChild(document.createTextNode(cut < 0 ? host : host.slice(0, cut)));
    u.appendChild(document.createElement('wbr'));
    u.appendChild(document.createTextNode(cut < 0 ? 'play.html' : host.slice(cut) + 'play.html'));
    $('pin').textContent = pin.slice(0, 3) + ' ' + pin.slice(3);
    $('setTitle').textContent = setTitle + '・' + game.length + '問';
    var svg = qrSvg(base + 'play.html?pin=' + pin);
    if (svg) $('qr').innerHTML = svg; else $('qrcard').classList.add('hide');   /* QRのライブラリが読めなかったら、QRだけ隠す */
    showScreen('s-lobby');
  } catch (e) {
    setupErr('ルームを作れませんでした: ' + e.message);
    $('btnCreate').disabled = false; $('btnCreate').textContent = 'ルームを作る';
  }
};

/* ---------------------------------------------------------------- 待機室 */
var chipEls = {}, firstRender = true;
function renderLobby() {
  var ids = Object.keys(players);
  var cnt = $('pcount');
  if (cnt.textContent !== String(ids.length)) {
    cnt.textContent = ids.length;
    if (motionOn) { cnt.classList.remove('bump'); void cnt.offsetWidth; cnt.classList.add('bump'); }
  }
  $('btnStart').disabled = ids.length === 0 || started;
  var box = $('players');
  /* 増えた人だけ足し、いなくなった人だけ消す（全員を作り直すと、動きが毎回やり直しになるため） */
  ids.forEach(function (id, i) {
    if (chipEls[id]) { chipEls[id].children[1].textContent = players[id].nick; return; }
    var c = el('span', 'pill' + (firstRender ? '' : ' extra'));
    c.style.setProperty('--i', i);
    c.appendChild(avatarEl(players[id].av, id)); c.appendChild(el('span', '', players[id].nick));
    var b = el('button', 'chip-x', '退出'); b.title = 'この参加者を退出させる';
    b.onclick = function () { kick(id); };
    c.appendChild(b); box.appendChild(c); chipEls[id] = c;
  });
  Object.keys(chipEls).forEach(function (id) { if (!players[id]) { chipEls[id].remove(); delete chipEls[id]; } });
  firstRender = false;
}

async function kick(id) {
  var u = {}; u['kicked/' + id] = true; u['players/' + id] = null;
  await update(ref(db, 'rooms/' + pin), u);
}

/* ---------------------------------------------------------------- ゲーム本体 */
$('btnStart').onclick = function () {
  started = true;
  window.addEventListener('beforeunload', function (e) { if (!ended) { e.preventDefault(); e.returnValue = ''; } });
  runGame();
};

document.querySelectorAll('.hb-pause').forEach(function (b) {
  b.onclick = function () {
    paused = !paused;
    document.querySelectorAll('.hb-pause').forEach(function (x) { x.textContent = paused ? '再開' : '一時停止'; });
    document.querySelectorAll('.hb-badge').forEach(function (x) { x.classList.toggle('hide', !paused); });
  };
});
document.querySelectorAll('.hb-next').forEach(function (b) { b.onclick = function () { skip = true; }; });
document.querySelectorAll('.hb-end').forEach(function (b) { b.onclick = function () { if (confirm('ゲームを終了しますか？')) { ended = true; skip = true; } }; });

async function runGame() {
  for (var i = 0; i < game.length && !ended; i++) {
    await askQuestion(i);
    if (ended) break;
    await showResult(i);
    await hold(RESULT_SEC * 1000);
    if (ended) break;
    if (i < game.length - 1) {
      await showRanking(i);
      await hold(RANK_SEC * 1000);
    }
  }
  await finish();
}

/* 待つ。一時停止中は時間が進まない。「次へ」で飛ばせる */
async function hold(ms) {
  var t = 0;
  while (t < ms && !ended) {
    await sleep(100);
    if (skip) { skip = false; return; }
    if (!paused) t += 100;
  }
}

/* 選択肢のタイル（形・画像・文字） */
function tileEl(c, idx) {
  var d = el('div', 'tile t' + idx);
  d.appendChild(el('span', 'sh', CHOICE_STYLE[idx].shape));
  if (c.image) { var im = el('img', 'ch-img'); im.src = c.image; im.alt = ''; d.appendChild(im); }
  if (c.t) d.appendChild(el('span', 'tx', c.t));
  return d;
}

function activeIds() { return Object.keys(players); }
function ansLabel() {
  var n = activeIds().filter(function (id) { return answers[id]; }).length;
  return '回答 ' + n + ' / ' + activeIds().length + '人';
}

async function askQuestion(i) {
  var q = game[i];
  stopAnim(); showScreen('s-q');
  $('qno').textContent = '問題 ' + (i + 1) + ' / ' + game.length + (q.type === 'text' ? '・入力式' : q.multi ? '・複数選択' : '');
  $('qtext').textContent = q.text;
  var img = $('qimg');
  if (q.image) { img.src = q.image; img.classList.remove('hide'); } else { img.classList.add('hide'); }
  $('qcard').classList.toggle('hasimg', !!q.image);
  var tiles = $('tiles'); tiles.textContent = '';
  if (q.type === 'text') {
    tiles.className = 'grid4 textq';
    var tp = el('div', 'textprompt'); tp.appendChild(el('div', '', '✍️ 答えを入力してください'));
    if (q.numeric) tp.appendChild(el('div', 'sub', '（数字で答えます）'));
    tiles.appendChild(tp);
  } else {
    tiles.className = 'grid4 n' + q.choices.length;
    q.choices.forEach(function (c, idx) { tiles.appendChild(tileEl(c, idx)); });
  }
  var ring = $('ring'); ring.classList.remove('hurry'); ring.style.setProperty('--p', 100); ring.querySelector('b').textContent = q.limit;

  answers = {};
  $('ansCount').textContent = ansLabel();
  if (unsubAnswers) unsubAnswers();
  unsubAnswers = onValue(ref(db, 'rooms/' + pin + '/answers/' + i), function (s) {
    answers = s.val() || {};
    $('ansCount').textContent = ansLabel();
  });

  await set(ref(db, 'rooms/' + pin + '/state'), stateOf({
    phase: 'question', i: i, n: game.length, text: q.text, image: q.image,
    choices: q.choices, multi: q.multi, type: q.type || 'choice', numeric: !!q.numeric, limit: q.limit
  }));
  tStart = (await get(ref(db, 'rooms/' + pin + '/state/t'))).val();

  var limitMs = q.limit * 1000;
  while (!ended) {
    await sleep(100);
    var el_ = serverNow() - tStart;
    var left = Math.max(0, limitMs - el_);
    ring.style.setProperty('--p', left / limitMs * 100);
    ring.querySelector('b').textContent = Math.ceil(left / 1000);
    ring.classList.toggle('hurry', left <= 5000 && left > 0);
    if (el_ >= limitMs) break;
    if (skip) { skip = false; break; }
    var ids = activeIds();
    if (ids.length && ids.every(function (id) { return answers[id]; })) { await sleep(800); break; }
  }
  ring.classList.remove('hurry');
}

async function showResult(i) {
  var q = game[i], limitMs = q.limit * 1000;
  var counts = q.type === 'text' ? [0, 0] : q.choices.map(function () { return 0; });   /* 入力式は [正解の人数, 不正解の人数] */
  var answered = 0, typed = [];
  var prevTotals = {};
  Object.keys(scores).forEach(function (id) { prevTotals[id] = scores[id].total; });

  /* 採点。今いる参加者全員を対象にする（未回答は0点） */
  activeIds().forEach(function (id) {
    var prev = scores[id] ? scores[id].total : 0;
    var a = answers[id], pts = 0, ok = false, c = -1;
    if (a) {
      answered++;
      var el_ = a.t - tStart;
      if (q.type === 'text') {
        /* 入力式：打ち込まれた文字を、正解の候補と比べる */
        var typedText = String(a.s == null ? '' : a.s); c = 1;
        var rightT = isTextCorrect(typedText, q.accept);
        counts[rightT ? 0 : 1]++;
        if (!rightT) typed.push(typedText);
        if (rightT && el_ <= limitMs + 1500) { pts = calcScore(el_, limitMs); ok = true; }
      } else {
        var chosen = [];                                       /* 選んだ番号 */
        if (a.m != null) { for (var b = 0; b < counts.length; b++) if (a.m & (1 << b)) chosen.push(b); c = a.m; }
        else if (a.c != null) { chosen = [a.c]; c = a.c; }
        chosen.forEach(function (b) { if (b >= 0 && b < counts.length) counts[b]++; });
        var right = q.multi ? (a.m === maskOf(q.correct)) : (a.c != null && q.correct.indexOf(a.c) >= 0);
        if (right && el_ <= limitMs + 1500) { pts = calcScore(el_, limitMs); ok = true; }
      }
    }
    scores[id] = { nick: players[id].nick, total: prev + pts, last: pts, ok: ok, qi: i, c: c };
  });
  /* 退出した人の得点は残さない */
  Object.keys(scores).forEach(function (id) { if (!players[id]) delete scores[id]; });
  rankRows = computeRank(prevTotals);

  await set(ref(db, 'rooms/' + pin + '/scores'), scores);
  await set(ref(db, 'rooms/' + pin + '/state'), stateOf({
    phase: 'result', i: i, n: game.length, text: q.text, image: q.image,
    choices: q.choices, multi: q.multi, correct: q.correct, type: q.type || 'choice', accept: q.accept || null, counts: counts, answered: answered
  }));

  /* 画面：棒グラフの下に選択肢を並べる */
  stopAnim(); showScreen('s-reveal');
  $('rqno').textContent = '問題 ' + (i + 1) + ' / ' + game.length;
  $('rans').textContent = '回答 ' + answered + ' / ' + activeIds().length + '人';
  $('rqtext').textContent = q.text;
  if (q.type === 'text') { buildTextReveal(q, counts, answered, typed); return; }
  var max = Math.max.apply(null, counts.concat([1]));
  var dist = $('dist'); dist.textContent = ''; dist.className = 'dist n' + q.choices.length; dist.style.setProperty('--n', q.choices.length);
  q.choices.forEach(function (c, idx) {
    var isOk = q.correct.indexOf(idx) >= 0;
    var col = el('div', 'col' + (isOk ? '' : ' dim'));
    var bw = el('div', 'barwrap'), bar = el('i'); bar.style.height = Math.max(counts[idx] ? 4 : 0, counts[idx] / max * 100) + '%'; bar.style.background = CHOICE_STYLE[idx].color;
    var num = el('b', 'num', '0'); bar.appendChild(num); bw.appendChild(bar);
    var t = tileEl(c, idx); t.className += isOk ? ' right' : ' dim';
    col.appendChild(bw); col.appendChild(t); dist.appendChild(col);
    countUp(num, counts[idx], 800, 1150, false);
  });
}

/* 入力式の正解発表：正解の候補・正解/不正解の人数・よくある間違い */
function buildTextReveal(q, counts, answered, typed) {
  var dist = $('dist'); dist.textContent = ''; dist.className = 'dist textres'; dist.style.removeProperty('--n');
  var okl = el('div', 'okline'); okl.appendChild(el('span', 'lab', '✓ 正解'));
  q.accept.forEach(function (a) { okl.appendChild(el('b', 'ans', a)); });
  dist.appendChild(okl);
  var total = Math.max(1, activeIds().length);
  var bars = el('div', 'bars2');
  [['正解', counts[0], 'ok'], ['不正解', counts[1], 'ng'], ['未回答', Math.max(0, activeIds().length - answered), 'no']].forEach(function (r) {
    var row = el('div', 'brow ' + r[2]); row.appendChild(el('span', 'bl', r[0]));
    var bw = el('div', 'bw'), bi = el('i'); bi.style.width = (r[1] / total * 100) + '%'; bw.appendChild(bi); row.appendChild(bw);
    var n = el('b', 'bn', '0'); row.appendChild(n); countUp(n, r[1], 700, 800, false); bars.appendChild(row);
  });
  dist.appendChild(bars);
  /* よくある間違い（同じ誤答が2人以上。先生の画面だけに出す） */
  var tally = {};
  typed.forEach(function (s) { var k = normText(s); if (!k) return; tally[k] = tally[k] || { t: s.trim().slice(0, 24), n: 0 }; tally[k].n++; });
  var top = Object.keys(tally).map(function (k) { return tally[k]; }).filter(function (x) { return x.n >= 2; })
    .sort(function (a, b) { return b.n - a.n; }).slice(0, 5);
  if (top.length) {
    var wr = el('div', 'wrongs'); wr.appendChild(el('span', 'lab', 'よくある間違い'));
    top.forEach(function (x) { wr.appendChild(el('span', 'pill', x.t + '　×' + x.n)); });
    dist.appendChild(wr);
  }
}

/* 上位5人の、前後の得点と順位の動き */
function computeRank(prevTotals) {
  var ids = Object.keys(scores);
  var after = {}, prev = {};
  ids.forEach(function (id) { after[id] = scores[id].total; prev[id] = prevTotals[id] || 0; });
  function rankOf(t) { var r = {}; ids.forEach(function (id) { r[id] = ids.filter(function (o) { return t[o] > t[id]; }).length + 1; }); return r; }
  var rb = rankOf(prev), ra = rankOf(after);
  var ord = ids.slice().sort(function (a, b) { return after[b] - after[a] || (scores[a].nick < scores[b].nick ? -1 : 1); });
  var top = ord.slice(0, 5);
  var byPrev = top.slice().sort(function (a, b) { return prev[b] - prev[a] || ord.indexOf(a) - ord.indexOf(b); });
  return top.map(function (id, idx) {
    return { u: id, av: players[id] && players[id].av, nick: scores[id].nick, prev: prev[id], total: after[id], from: byPrev.indexOf(id), to: idx, mv: rb[id] - ra[id] };
  });
}

async function showRanking(i) {
  await set(ref(db, 'rooms/' + pin + '/state'), stateOf({
    phase: 'ranking', i: i, n: game.length,
    rows: rankRows.map(function (r) { return { u: r.u, av: r.av || '', nick: r.nick, prev: r.prev, total: r.total, from: r.from, to: r.to, mv: r.mv }; })
  }));
  stopAnim(); showScreen('s-rank');
  $('kprog').textContent = (i + 1) + ' / ' + game.length + '問 終了';
  buildRank($('rk'), rankRows.map(function (r) { return Object.assign({}, r); }), '');
}

function topList(n) {
  return Object.keys(scores).map(function (id) { return { u: id, av: (players[id] && players[id].av) || '', nick: scores[id].nick, total: scores[id].total }; })
    .sort(function (a, b) { return b.total - a.total; }).slice(0, n);
}

async function finish() {
  ended = true;
  if (unsubAnswers) { unsubAnswers(); unsubAnswers = null; }
  var top = topList(5);
  await set(ref(db, 'rooms/' + pin + '/state'), stateOf({ phase: 'end', n: game.length, top: top }));
  stopAnim(); showScreen('s-end');
  confetti($('conf'), 46);
  var pod = $('podium'); pod.textContent = '';
  [[1, 'p2'], [0, 'p1'], [2, 'p3']].forEach(function (pair) {
    var r = top[pair[0]]; if (!r) return;
    var p = el('div', 'p ' + pair[1]);
    if (pair[0] === 0) p.appendChild(el('div', 'crown', '👑'));
    var pav = el('div', 'pav'); pav.appendChild(avatarEl(r.av, r.u)); p.appendChild(pav);
    p.appendChild(el('b', '', r.nick)); p.appendChild(el('small', '', fmt(r.total) + '点'));
    p.appendChild(el('div', '', String(pair[0] + 1))); p.lastChild.style.cssText = 'font-size:' + (pair[0] === 0 ? '2.4em' : '2em') + ';margin-top:.3em';
    pod.appendChild(p);
  });
  $('rest').textContent = top.slice(3).map(function (r, i) { return (i + 4) + '位 ' + r.nick + '（' + fmt(r.total) + '点）'; }).join('　');
}

$('btnClose').onclick = async function () {
  await remove(ref(db, 'rooms/' + pin));
  location.reload();
};
</script>
