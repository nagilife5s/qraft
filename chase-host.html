<!DOCTYPE html>
<html lang="ja" data-bg="space">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qraft ジェットチェイス（先生）</title>
<link rel="icon" type="image/png" href="img/favicon-32.png">
<link rel="stylesheet" href="theme.css?v=20261113183431">
</head>
<body>
<div id="app">

<!-- ① 準備 -->
<section class="screen" id="s-setup">
  <div class="setup-wrap">
    <img class="logo-img" src="img/logo-wordmark.webp" alt="Qraft" style="height:5em">
    <div class="card setup">
      <div><a class="backlink" href="index.html">← もどる</a></div>
      <div class="jc-head"><img src="img/robot/boss.webp" alt=""><div><div class="jc-t">ジェットチェイス</div><div class="jc-s">みんなで協力して、ジェットロボから にげきれ！<br>クリアしたら、ミニゲーム（4種類からランダム）！</div></div></div>
      <label>問題セット（複数えらべます。家庭練習と同じ、正解が公開されたセットです）</label>
      <div id="picker"></div>
      <div class="selbar hide" id="selBar"><span id="selInfo"></span><span id="selChips"></span><button type="button" class="linkbtn" id="selClear">選びなおす</button></div>
      <div class="form-row"><b>1レベルの時間</b><div class="seg" id="segTl"><button type="button" data-v="120">2分</button><button type="button" data-v="180" class="on">3分</button><button type="button" data-v="240">4分</button></div></div>
      <div class="form-row"><b>ミニゲーム</b><div class="seg" id="segMg"><button type="button" data-v="all" class="on">4種類からランダム</button><button type="button" data-v="blast">ブラストだけ</button></div></div>
      <div class="form-row"><b>難易度</b><div class="seg" id="segDiff"><button type="button" data-v="easy">やさしい</button><button type="button" data-v="normal" class="on">ふつう</button><button type="button" data-v="hard">むずかしい</button></div></div>
      <div class="note" id="goalNote"></div>
      <div style="text-align:center;margin-top:1.4em"><button class="btn" id="btnCreate">ルームを作る</button></div>
      <div id="setupErr" class="err hide"></div>
    </div>
  </div>
</section>

<!-- ② 待機室 -->
<section class="screen" id="s-lobby" style="padding-top:2.2em; gap:1em">
  <div class="lobby-top"><img class="logo-img" src="img/logo-wordmark.webp" alt="Qraft" style="height:4.6em"><span class="qno" id="setTitle"></span></div>
  <div class="joinbox">
    <div class="card" style="flex:1.05"><div class="lab">① このアドレスを開く</div><div class="url" id="joinUrl"></div></div>
    <div class="card" style="flex:1.35"><div class="lab">② PINを入れる</div><div class="pin" id="pin">------</div></div>
    <div class="card" id="qrcard" style="flex:.55"><div class="qr" id="qr"></div><div class="lab" style="margin-top:.5em">QRで開く</div></div>
  </div>
  <div class="cnt-line">
    <b>👥 <span id="pcount">0</span>人が参加中</b>
    <div style="display:flex;gap:.8em;align-items:center">
      <button class="btn quit" id="btnQuitLobby" type="button">やめる</button>
      <button class="snd"></button>
      <button class="btn" id="btnStart" disabled>スタート！</button>
    </div>
  </div>
  <div class="players" id="players"></div>
</section>

<!-- ③ ゲーム中 -->
<section class="screen" id="s-run" style="gap:.4em; padding:.5em .6em">
  <div class="rhud">
    <span class="pill" id="hLevel"></span>
    <div class="rbar"><span class="ri">🤖</span><i id="hFill"></i><span class="fl">🏁</span></div>
    <span class="pill" id="hTime" style="background:#fff;color:var(--ink-dark)"></span>
    <span class="lives" id="hLives"></span>
  </div>
  <div id="sceneBox" style="flex:1; display:flex; min-height:0"></div>
  <div id="bombBox" class="hide" style="flex:1; min-height:0; overflow:auto"></div>
  <div class="chase-top"><span class="banner hide" id="hBanner"></span><span class="pill" id="hStat" style="margin-left:auto"></span><button class="snd"></button><button class="btn ghost" id="btnEnd">ゲームを終える</button></div>
</section>

<!-- ④ 終了 -->
<section class="screen" id="s-end" style="overflow-y:auto; padding-top:1.4em; padding-bottom:1.4em">
  <div class="confetti" id="conf"></div>
  <div class="center" style="flex:1 0 auto; display:flex; flex-direction:column; justify-content:safe center; gap:.6em">
    <div style="font-size:3em; line-height:1" id="endEm"></div>
    <div class="title2" style="font-size:2.3em; line-height:1.25" id="endTitle"></div>
    <div class="card" style="min-width:20em; padding:.9em 2em"><div class="mut" style="color:#5b5478;font-weight:800">クラス全体の正解数</div><div style="font-size:3.4em; font-weight:900; color:var(--bg2); line-height:1.1"><span id="endK">0</span><small style="font-size:.4em"> 問</small></div><div style="font-weight:800" id="endSub"></div></div>
    <button class="btn sub" id="btnClose" style="margin-top:.2em">ルームを閉じる</button>
  </div>
  <button class="snd fixed"></button>
</section>

</div>

<script src="firebase-config.js?v=20261113183431"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module">
import { mountSetPicker } from './lib.js?v=20261113183431';
import { INFO as MG, KINDS as MG_KINDS, pickKind, aspect as mgAspect, hostCreate, hostMarkInputs, hostStep, hostLeft, hostScores, hostLabel, hostLine, hostDraw } from './minigame.js?v=20261113183431';
import { shuffle, signIn, db, ref, set, get, update, remove, onValue, serverNow,
         avatarEl, ROBOT, ROBOT_LEVELS, setRobot, robotTarget, robotFrac, mountScene, parseAv,
         $, el, showScreen, confetti, qrSvg,
         loadBackgrounds, applyBg, buildBgPickers, mountStage } from './lib.js?v=20261113183431';
import { bgm, bgmRate, sfx, preload, wireSoundButtons } from './sound.js?v=20261113183431b';

mountStage();
wireSoundButtons(); preload(['top']); bgm('top');   /* 部屋を作る前の設定画面も、トップの曲を続けて鳴らす */

var uid = null, pin = null, BGS = [], curBg = 'space';
var SETS = [], picked = {}, picker = null;
var binMap = {}, mg = null, lastKind = '', bombTimer = null, bombRaf = null, bTotal = {}, bLevel = {};
var lastK = 0, players = {}, runs = {}, S = null, started = false, ended = false, tickId = null, scene = null, bannerUntil = 0;
var GL = { 0: 'すべて', 1: '1年', 2: '2年', 3: '3年' };

/* ------------------------------------------------------------ 準備 */
(async function init() {
  try {
    uid = (await signIn()).uid;
    BGS = await loadBackgrounds();
    applyBg(curBg, BGS, true);
    SETS = await (await fetch('home/index.json', { cache: 'no-cache' })).json();
    try { JSON.parse(localStorage.getItem('qraft.chase.picked') || '[]').forEach(function (f) { if (SETS.some(function (x) { return x.id === f; })) picked[f] = true; }); } catch (e) {}
    $('selClear').onclick = function () { Object.keys(picked).forEach(function (k) { delete picked[k]; }); picker.render(); updateSel(); };
    /* 時間と難易度（2026-11-12）。前回の選択を覚える */
    try { var lo = JSON.parse(localStorage.getItem('qraft.chase.opts') || '{}'); ['segTl', 'segDiff', 'segMg'].forEach(function (id) { var v = lo[id]; if (v) $(id).querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); }); }); } catch (e) {}
    ['segTl', 'segDiff', 'segMg'].forEach(function (id) { $(id).onclick = function (e) { var b = e.target.closest('button'); if (!b) return; this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); goalNote(); }; });
    goalNote();
    picker = mountSetPicker($('picker'), { sets: SETS, key: function (s) { return s.id; }, picked: picked, onChange: updateSel }); updateSel();
  } catch (e) { setupErr(e.message); $('btnCreate').disabled = true; }
  showScreen('s-setup');
})();

function updateSel() {
  var ids = Object.keys(picked), n = 0;
  ids.forEach(function (i) { var s = SETS.filter(function (x) { return x.id === i; })[0]; if (s) n += s.count; });
  $('selBar').classList.toggle('hide', !ids.length);
  $('selInfo').textContent = '選んだセット：' + ids.length + ' つ・合計 ' + n + ' 問';
  /* 選んでいるセットを全部、名前で見せる（前回の選択が残って、別の単元の問題が混じることがあったため。2026-11-12） */
  var chips = $('selChips'); chips.textContent = '';
  ids.forEach(function (k) {
    var s = SETS.filter(function (x) { return x.id === k; })[0]; if (!s) return;
    var c = el('span', 'chip2'); c.appendChild(el('span', '', (s.grade ? s.grade + '年 ' : '') + s.title));
    var x = el('button', '', '×'); x.type = 'button'; x.title = 'この選択をはずす'; x.setAttribute('aria-label', s.title + 'をはずす');
    x.onclick = function () { delete picked[k]; picker.render(); updateSel(); };
    c.appendChild(x); chips.appendChild(c);
  });
}
function segV(id) { var b = $(id).querySelector('button.on'); return b ? b.dataset.v : ''; }
function goalNote() {
  setRobot(Number(segV('segTl')), segV('segDiff'));
  $('goalNote').textContent = 'レベル1〜3。各レベル ' + (ROBOT.Tl / 60) + ' 分の中で、クラス全員の正解数の合計が「目標」に届けばクリア（目標は人数と難易度に合わせて自動で決まります）。追いつかれるとライフが1つ減って、そのレベルをやり直し。クリアすると、ミニゲーム（' + (segV('segMg') === 'blast' ? 'ブラストタイム' : 'ブラスト・スカイレース・ほりほりトレジャー・チーム綱引きから、前回とちがうものをランダム') + '）。ライフは ' + ROBOT.lives + ' つです。';
}
function setupErr(msg) { $('setupErr').textContent = msg; $('setupErr').classList.remove('hide'); }

$('btnCreate').onclick = async function () {
  $('setupErr').classList.add('hide'); $('btnCreate').disabled = true;
  try {
    var ids = Object.keys(picked).filter(function (i) { return SETS.some(function (x) { return x.id === i; }); });
    if (!ids.length) throw new Error('問題セットを1つ以上えらんでください');
    try { localStorage.setItem('qraft.chase.picked', JSON.stringify(ids)); localStorage.setItem('qraft.chase.opts', JSON.stringify({ segTl: segV('segTl'), segDiff: segV('segDiff'), segMg: segV('segMg') })); } catch (e) {}
    goalNote();
    for (var i = 0; i < 20; i++) {
      pin = String(Math.floor(100000 + Math.random() * 900000));
      if (!(await get(ref(db, 'rooms/' + pin + '/hostUid'))).exists()) break;
    }
    await set(ref(db, 'rooms/' + pin + '/hostUid'), uid);
    S = { mode: 'chase', phase: 'lobby', bg: curBg, sets: ids, fail: 0, Tl: ROBOT.Tl, diff: segV('segDiff') };   /* Tl・diff：生徒の端末も同じ値で動く */
    await set(ref(db, 'rooms/' + pin + '/state'), S);
    onValue(ref(db, 'rooms/' + pin + '/players'), function (s) { players = s.val() || {}; renderLobby(); });
    onValue(ref(db, 'rooms/' + pin + '/run'), function (s) { runs = s.val() || {}; });
    onValue(ref(db, 'rooms/' + pin + '/bin'), function (s) { binMap = s.val() || {}; });

    var base = location.href.replace(/chase-host\.html.*$/, ''), host = base.replace(/^https?:\/\//, ''), cut = host.indexOf('/');
    var u = $('joinUrl'); u.textContent = '';
    u.appendChild(document.createTextNode(cut < 0 ? host : host.slice(0, cut)));
    u.appendChild(document.createElement('wbr'));
    u.appendChild(document.createTextNode(cut < 0 ? 'chase‑play.html' : host.slice(cut) + 'chase‑play.html'));   /* ‑＝改行しないハイフン（chase- の後ろで折り返さないように） */
    $('pin').textContent = pin.slice(0, 3) + ' ' + pin.slice(3);
    $('setTitle').textContent = 'ジェットチェイス・3レベル';
    var svg = qrSvg(base + 'chase-play.html?pin=' + pin);
    if (svg) $('qr').innerHTML = svg; else $('qrcard').classList.add('hide');
    showScreen('s-lobby');
    preload(['lobby', 'chase', 'blast', 'podium']); bgm('lobby');
  } catch (e) {
    setupErr('ルームを作れませんでした: ' + e.message);
    $('btnCreate').disabled = false;
  }
};

/* ------------------------------------------------------------ 待機室 */
var chipEls = {};
function renderLobby() {
  var ids = Object.keys(players);
  $('pcount').textContent = ids.length;
  $('btnStart').disabled = ids.length === 0 || started;
  var box = $('players');
  ids.forEach(function (id) {
    if (chipEls[id]) { chipEls[id].children[1].textContent = players[id].nick; return; }
    var c = el('span', 'pill extra'); c.appendChild(avatarEl(players[id].av, id)); c.appendChild(el('span', '', players[id].nick));
    var b = el('button', 'chip-x', '退出'); b.onclick = function () { var u = {}; u['kicked/' + id] = true; u['players/' + id] = null; u['run/' + id] = null; update(ref(db, 'rooms/' + pin), u); };
    c.appendChild(b); box.appendChild(c); chipEls[id] = c; sfx('join');
  });
  Object.keys(chipEls).forEach(function (id) { if (!players[id]) { chipEls[id].remove(); delete chipEls[id]; } });
}

/* ------------------------------------------------------------ ゲーム進行（先生の画面がすべて決める） */
function sumK() { return Object.keys(runs).reduce(function (a, id) { return a + (players[id] ? (runs[id].k || 0) : 0); }, 0); }
function save(extra) { Object.assign(S, extra); return update(ref(db, 'rooms/' + pin + '/state'), extra); }
function levelStart(level) {
  var N = S.N;
  return { phase: 'quiz', level: level, target: robotTarget(N, level), qstart: serverNow(), base: sumK(), Tl: ROBOT.Tl };
}

$('btnStart').onclick = async function () {
  started = true; $('btnStart').disabled = true;
  window.addEventListener('beforeunload', function (e) { if (!ended) { e.preventDefault(); e.returnValue = ''; } });
  S.N = Object.keys(players).length; S.lives = ROBOT.lives; S.total = 0;
  await save(Object.assign({ N: S.N, lives: S.lives }, levelStart(1)));
  scene = mountScene($('sceneBox'), false); showScreen('s-run');
  sfx('go'); bgm('chase');
  tickId = setInterval(tick, 250);
};

function banner(msg, bad, sec) { var b = $('hBanner'); b.textContent = msg; b.classList.toggle('bad', !!bad); b.classList.remove('hide'); bannerUntil = Date.now() + sec * 1000; }

function tick() {
  if (!S || ended) return;
  var now = serverNow(), ids = Object.keys(players), list = ids.map(function (id) { return { uid: id, nick: players[id].nick, av: players[id].av }; });
  scene.setPlayers(list);
  var K = sumK(), C = K - (S.base || 0), p = Math.min(1, C / S.target), sec = (now - S.qstart) / 1000, frac = robotFrac(Math.max(0, sec), p);
  $('hLevel').textContent = 'レベル ' + S.level + ' / ' + ROBOT.levels;
  $('hLives').textContent = new Array(S.lives + 1).join('❤️') + new Array(ROBOT.lives - S.lives + 1).join('🖤');
  if (bannerUntil < Date.now()) $('hBanner').classList.add('hide');

  if (S.phase === 'quiz') {
    bgm('chase'); bgmRate(1 + 0.12 * Math.max(0, Math.min(1, (frac - 0.5) / 0.5)));   /* ロボットが近いほど、曲を速く */
    if (K > lastK) sfx('step');                                                        /* だれかが正解した */
    lastK = K;
    var left = Math.max(0, S.Tl - sec);
    $('hTime').textContent = Math.floor(left / 60) + ':' + String(Math.floor(left % 60)).padStart(2, '0');
    $('hFill').style.width = p * 100 + '%';
    $('hStat').textContent = '正解 ' + C + ' / ' + S.target;
    var ks = {}; ids.forEach(function (id) { ks[id] = (runs[id] && runs[id].k) || 0; });
    scene.draw({ phase: 'quiz', frac: frac, ks: ks });
    if (sec < 3) { if (bannerUntil < Date.now()) banner('レベル ' + S.level + ' スタート！ 問題に答えて ロボットから にげろ！', false, 3); return; }
    if (p >= 1) {
      var nk = pickKind(lastKind, segV('segMg') === 'blast' ? ['blast'] : MG_KINDS);
      banner('クリア！ ' + MG[nk].em + ' ' + MG[nk].name + 'へ！', false, 3);
      sfx('levelup'); startBomb(nk);
    } else if (frac >= 1 || sec >= S.Tl) {
      var lives = S.lives - 1;
      if (lives <= 0) return finish('lose', lives);
      banner('ロボットにつかまった！ ライフ −1　もう一度！', true, 4); sfx('caught');
      save(Object.assign({ lives: lives, fail: (S.fail || 0) + 1 }, levelStart(S.level)));
    }
  } else if (S.phase === 'bombres') {
    $('hTime').textContent = '';
    if (now - S.brstart > 6000) {
      if (S.level >= ROBOT.levels) finish('clear', S.lives); else { showBomb(false); save(levelStart(S.level + 1)); }
    }
  }
}

/* ------------------------------------------------------------ ミニゲーム（先生の画面が全グループを計算して、盤面を配る）
   4種類（ブラスト・スカイレース・ほりほりトレジャー・チーム綱引き）。中身は minigame.js */
function nickOf(u) { return players[u] ? players[u].nick : '?'; }
function avOf(u) { return parseAv(players[u] && players[u].av, u); }
function startBomb(kind) {
  lastKind = kind;
  mg = hostCreate(kind, shuffle(Object.keys(players)), 5000);
  hostMarkInputs(mg, binMap);
  var start = serverNow() + 4000;
  Promise.all([set(ref(db, 'rooms/' + pin + '/bgrp'), mg.bgrp), set(ref(db, 'rooms/' + pin + '/bd'), mg.bd)]).then(function () {
    save({ phase: 'bomb', bstart: start, mg: kind });
  });
  S.phase = 'bomb'; S.bstart = start; S.mg = kind; bgmRate(1); bgm('blast');                     /* この間に quiz 判定が再び走らないように、手元はすぐ切り替える */
  showBomb(true); buildBombBoxes();
  clearInterval(bombTimer); bombTimer = setInterval(bombTick, 100);
  cancelAnimationFrame(bombRaf); (function loop() { bombDraw(); bombRaf = requestAnimationFrame(loop); })();
}
var bcanv = [], bcoreEls = [];
function buildBombBoxes() {
  var box = $('bombBox'); box.textContent = '';
  /* 画面に全部の盤面が収まる、いちばん大きい並べ方を探す（列の数を1〜盤面の数で試す） */
  var n = mg.boards.length, ar = mgAspect(mg.kind);
  var availH = Math.max(200, box.clientHeight || (window.innerHeight - 140)), availW = box.clientWidth || (window.innerWidth - 30);
  var best = { w: 0, cols: 1 };
  for (var cols = 1; cols <= n; cols++) {
    var rows = Math.ceil(n / cols), w = Math.min((availW - (cols - 1) * 10) / cols - 10, (availH / rows - 56) * ar, 1600);
    if (w > best.w) best = { w: w, cols: cols };
  }
  var cellW = Math.max(120, Math.floor(best.w));
  var grid = el('div', 'grid7'); grid.style.cssText = 'display:grid; gap:.6em; grid-template-columns:repeat(' + best.cols + ', ' + cellW + 'px); justify-content:center; width:100%;';
  bcanv = []; bcoreEls = [];
  mg.boards.forEach(function (bd, gi) {
    var cell = el('div', 'bcell'); cell.style.cssText = 'background:rgba(0,0,0,.35); border-radius:.6em; padding:.3em; color:#fff; font-weight:800; font-size:.85em;';
    cell.appendChild(el('div', '', hostLabel(mg, gi)));
    var fr = el('div', 'bframe mini'); fr.style.display = 'block'; var cv = el('canvas'); cv.width = cellW; cv.height = Math.floor(cellW / ar); cv.style.cssText = 'width:100%; display:block;'; fr.appendChild(cv); cell.appendChild(fr);
    var sc = el('div', 'gsc'); sc.style.cssText = 'line-height:1.5; margin-top:.2em;'; cell.appendChild(sc);
    grid.appendChild(cell); bcanv.push(cv); bcoreEls.push(sc);
  });
  box.appendChild(grid);
}
function showBomb(on) { $('bombBox').classList.toggle('hide', !on); $('sceneBox').classList.toggle('hide', on); if (!on) { clearInterval(bombTimer); cancelAnimationFrame(bombRaf); } }
function bombDraw() { if (!mg) return; mg.boards.forEach(function (bd, gi) { if (bcanv[gi]) hostDraw(mg, gi, bcanv[gi], avOf, nickOf); }); }
var SFX_OF = { boom: 'boom', kill: 'kill', bigstar: 'kill', hit: 'ng', find: 'ok', sync: 'step', end: 'fanfare' };
function bombTick() {
  if (S.phase !== 'bomb' || !mg) return;
  var now = serverNow(), left = (S.bstart - now) / 1000;
  if (left > 0) { $('hTime').textContent = '開始まで ' + Math.ceil(left); return; }
  /* 先生のタブが裏に回ると、タイマーが1秒に1回まで遅くなる（2026-11-13 授業で空が流れなかった）。
     遅れた分は、何ステップかまとめて進めて追いつく */
  var due = Math.floor((now - S.bstart) / 100), g0 = mg.boards[0] && mg.boards[0].g, n = 1;
  if (mg.kind !== 'tug' && g0) n = Math.max(1, Math.min(30, due - g0.t));
  var r = { upd: {}, over: false, ev: [] };
  for (var k = 0; k < n && !r.over; k++) { var r1 = hostStep(mg, binMap, now - S.bstart); Object.assign(r.upd, r1.upd); r.ev = r.ev.concat(r1.ev); r.over = r1.over; }
  mg.stepAt = performance.now();
  r.ev.forEach(function (e) { if (SFX_OF[e]) sfx(SFX_OF[e]); });
  mg.boards.forEach(function (bd, gi) { bcoreEls[gi].textContent = hostLine(mg, gi, nickOf); });
  update(ref(db, 'rooms/' + pin + '/bd'), r.upd).catch(function () {});
  var lf = hostLeft(mg, now - S.bstart);
  $('hTime').textContent = '0:' + String(Math.ceil(lf)).padStart(2, '0'); $('hStat').textContent = MG[mg.kind].stat;
  if (r.over) endBomb();
}
function endBomb() {
  clearInterval(bombTimer);
  bLevel = {}; var rows = [], sc = hostScores(mg);
  Object.keys(sc).forEach(function (u) { bLevel[u] = sc[u]; bTotal[u] = (bTotal[u] || 0) + sc[u]; rows.push({ n: nickOf(u), s: sc[u] }); });
  rows.sort(function (a, b) { return b.s - a.s; });
  update(ref(db, 'rooms/' + pin + '/bscore'), bTotal).catch(function () {});
  save({ phase: 'bombres', brstart: serverNow() }); sfx('fanfare');
  banner(MG[mg.kind].name + 'のMVP：' + rows.slice(0, 3).map(function (r, i) { return (i + 1) + '位 ' + r.n + '（' + r.s + '点）'; }).join('　'), false, 6);
}

async function finish(result, lives) {
  if (ended) return; ended = true; clearInterval(tickId);
  var K = sumK();
  showBomb(false);
  var topB = Object.keys(bTotal).map(function (u) { return { n: players[u] ? players[u].nick : '?', s: bTotal[u] }; }).sort(function (a, b) { return b.s - a.s; }).slice(0, 5);
  await update(ref(db, 'rooms/' + pin + '/state'), { phase: 'end', result: result, total: K, lives: Math.max(0, lives), top: topB });
  var win = result === 'clear';
  $('endEm').textContent = win ? '🎉' : '🤖';
  $('endTitle').textContent = win ? '全レベル クリア！ ロボットから にげきった！' : 'ロボットに つかまってしまった…';
  $('endK').textContent = K;
  $('endSub').textContent = (S.level && !win ? 'レベル ' + S.level + ' で ゲームオーバー' : '') + (win ? '残りライフ ' + lives + ' / ' + ROBOT.lives : '') + (topB.length ? '　ミニゲーム上位：' + topB.map(function (r, i) { return (i + 1) + '位 ' + r.n + '（' + r.s + '点）'; }).join('　') : '');
  showScreen('s-end'); if (win) confetti($('conf'), 46);
  bgmRate(1); if (win) { bgm('podium'); sfx('fanfare'); } else { bgm(null); sfx('lose'); }
}
/* 確認用：自分のPC（localhost）で ?mg=1 を付けて開いたときだけ、ミニゲームをすぐ始められる（例：qraftDebug.mini('dig')） */
if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]mg=1/.test(location.search)) window.qraftDebug = { mini: function (k) { banner('確認用：' + MG[k].name, false, 2); startBomb(k); } };
$('btnEnd').onclick = function () { if (confirm('ゲームを終えますか？')) finish('lose', 0); };
/* ロビーでやめる：ルームを消して、準備画面にもどる */
$('btnQuitLobby').onclick = function () { if (confirm('ルームを閉じて、準備画面にもどりますか？（参加している生徒には終了が表示されます）')) $('btnClose').onclick(); };
$('btnClose').onclick = async function () { bgm(null); await remove(ref(db, 'rooms/' + pin)); location.reload(); };
</script>
