<!DOCTYPE html>
<html lang="ja" data-bg="space">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qraft ロボットラン（先生）</title>
<link rel="icon" type="image/png" href="img/favicon-32.png">
<link rel="stylesheet" href="theme.css?v=20261022200113">
</head>
<body>
<div id="app">

<!-- ① 準備 -->
<section class="screen" id="s-setup">
  <div class="setup-wrap">
    <img class="logo-img" src="img/logo-wordmark.webp" alt="Qraft" style="height:5em">
    <div class="card setup">
      <div style="font-weight:900; font-size:1.3em">🤖 ロボットラン（みんなで ロボットから にげきれ！）</div>
      <label>問題セット（複数えらべます。家庭練習と同じ、正解が公開されたセットです）</label>
      <div class="pk-row" id="gradeRow"></div>
      <div class="pk-row small" id="unitRow"></div>
      <input type="text" id="setFilter" placeholder="題名でさがす" autocomplete="off">
      <div class="setlist" id="setList"></div>
      <div class="selbar hide" id="selBar"><span id="selInfo"></span><button type="button" class="linkbtn" id="selClear">選びなおす</button></div>
      <div class="note" id="goalNote"></div>
      <label>背景</label><div class="bgrow"></div>
      <div style="text-align:center;margin-top:1.4em"><button class="btn" id="btnCreate">ルームを作る</button></div>
      <div id="setupErr" class="err hide"></div>
    </div>
  </div>
</section>

<!-- ② 待機室 -->
<section class="screen" id="s-lobby" style="padding-top:2.2em; gap:1em">
  <div class="lobby-top"><img class="logo-img" src="img/logo-wordmark.webp" alt="Qraft" style="height:4.6em"><span class="qno" id="setTitle"></span></div>
  <div class="joinbox">
    <div class="card" style="flex:1.05"><div class="lab">① このアドレスを開く</div><div class="url" id="joinUrl"></div></div>
    <div class="card" style="flex:1.35"><div class="lab">② PINを入れる</div><div class="pin" id="pin">------</div></div>
    <div class="card" id="qrcard" style="flex:.55"><div class="qr" id="qr"></div><div class="lab" style="margin-top:.5em">QRで開く</div></div>
  </div>
  <div class="cnt-line">
    <b>👥 <span id="pcount">0</span>人が参加中</b>
    <div style="display:flex;gap:.8em;align-items:center">
      <div class="bgpick"><button type="button" class="fab">🎨 背景</button><div class="sw"></div></div>
      <button class="btn" id="btnStart" disabled>スタート！</button>
    </div>
  </div>
  <div class="players" id="players"></div>
</section>

<!-- ③ ゲーム中 -->
<section class="screen" id="s-run" style="gap:.5em">
  <div class="rhud">
    <span class="pill" id="hLevel"></span>
    <div class="rbar"><span class="ri">🤖</span><i id="hFill"></i><span class="fl">🏁</span></div>
    <span class="pill" id="hTime" style="background:#fff;color:var(--ink-dark)"></span>
    <span class="lives" id="hLives"></span>
  </div>
  <div id="sceneBox" style="flex:1; display:flex; min-height:0"></div>
  <div class="chase-top"><span class="banner hide" id="hBanner"></span><span class="pill" id="hStat" style="margin-left:auto"></span><button class="btn ghost" id="btnEnd">ゲームを終える</button></div>
</section>

<!-- ④ 終了 -->
<section class="screen" id="s-end">
  <div class="confetti" id="conf"></div>
  <div class="center" style="flex:1; display:flex; flex-direction:column; gap:.6em">
    <div style="font-size:5em" id="endEm"></div>
    <div class="title2" style="font-size:2.8em" id="endTitle"></div>
    <div class="card" style="min-width:20em"><div class="mut" style="color:#5b5478;font-weight:800">クラス全体の正解数</div><div style="font-size:4em; font-weight:900; color:var(--bg2); line-height:1.1"><span id="endK">0</span><small style="font-size:.4em"> 問</small></div><div style="font-weight:800" id="endSub"></div></div>
    <button class="btn sub" id="btnClose" style="margin-top:1em">ルームを閉じる</button>
  </div>
  <div class="bgpick fixed"><button type="button" class="fab">🎨 背景</button><div class="sw"></div></div>
</section>

</div>

<script src="firebase-config.js?v=20261022200113"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module">
import { signIn, db, ref, set, get, update, remove, onValue, serverNow,
         avatarEl, ROBOT, robotTarget, robotFrac, zonePlan, zoneEval, mountScene,
         $, el, showScreen, confetti, qrSvg,
         loadBackgrounds, applyBg, buildBgPickers, mountStage } from './lib.js?v=20261022200113';

mountStage();

var uid = null, pin = null, BGS = [], curBg = 'space';
var SETS = [], picked = {}, gradeSel = 0, unitSel = '';
var players = {}, runs = {}, S = null, started = false, ended = false, tickId = null, scene = null, bannerUntil = 0;
var GL = { 0: 'すべて', 1: '1年', 2: '2年', 3: '3年' };

function pill(text, on, onclick, field) { var b = el('button', 'pk' + (on ? ' on' : ''), text); b.type = 'button'; if (field) b.dataset.f = field; b.onclick = onclick; return b; }
function pickBg(k) { curBg = k; applyBg(k, BGS); if (pin) update(ref(db, 'rooms/' + pin + '/state'), { bg: k }).catch(function () {}); }

/* ------------------------------------------------------------ 準備 */
(async function init() {
  try {
    uid = (await signIn()).uid;
    BGS = await loadBackgrounds();
    applyBg(curBg, BGS, true); buildBgPickers(BGS, curBg, pickBg);
    SETS = await (await fetch('home/index.json', { cache: 'no-cache' })).json();
    try { JSON.parse(localStorage.getItem('qraft.chase.picked') || '[]').forEach(function (f) { if (SETS.some(function (x) { return x.id === f; })) picked[f] = true; }); } catch (e) {}
    $('setFilter').oninput = renderList; $('selClear').onclick = function () { picked = {}; renderList(); };
    $('goalNote').textContent = 'レベル1〜3。各レベル ' + (ROBOT.Tl / 60) + ' 分の中で、クラス全員の正解数の合計が「目標」に届けばクリア（目標は人数に合わせて自動で決まります）。追いつかれるとライフが1つ減って、そのレベルをやり直し。クリアすると「安全地帯」ミニゲーム。ライフは ' + ROBOT.lives + ' つです。';
    renderPicker();
  } catch (e) { setupErr(e.message); $('btnCreate').disabled = true; }
  showScreen('s-setup');
})();

function renderPicker() {
  var gr = $('gradeRow'); gr.textContent = '';
  [0, 1, 2, 3].forEach(function (g) {
    var n = SETS.filter(function (s) { return !g || s.grade === g; }).length;
    gr.appendChild(pill(GL[g] + '（' + n + '）', g === gradeSel, function () { gradeSel = g; unitSel = ''; renderPicker(); }));
  });
  var ur = $('unitRow'); ur.textContent = '';
  var seen = {}, units = [];
  SETS.filter(function (s) { return !gradeSel || s.grade === gradeSel; }).forEach(function (s) {
    if (!seen[s.unit]) { seen[s.unit] = { unit: s.unit, uo: s.uo, g: s.grade, f: s.field, n: 0 }; units.push(seen[s.unit]); }
    seen[s.unit].n++;
  });
  units.sort(function (a, b) { return a.uo - b.uo; });
  ur.appendChild(pill('すべての単元', unitSel === '', function () { unitSel = ''; renderPicker(); }));
  units.forEach(function (u) {
    ur.appendChild(pill((gradeSel || !u.g ? '' : u.g + '年・') + u.unit + '（' + u.n + '）', unitSel === u.unit, function () { unitSel = u.unit; renderPicker(); }, u.f));
  });
  renderList();
}
function renderList() {
  var f = $('setFilter').value.trim(), box = $('setList'); box.textContent = '';
  SETS.filter(function (s) { return (!gradeSel || s.grade === gradeSel) && (!unitSel || s.unit === unitSel) && (!f || s.title.indexOf(f) >= 0); })
    .forEach(function (s) {
      var row = el('label', 'setrow' + (picked[s.id] ? ' on' : ''));
      var cb = el('input'); cb.type = 'checkbox'; cb.checked = !!picked[s.id];
      cb.onchange = function () { if (cb.checked) picked[s.id] = true; else delete picked[s.id]; row.classList.toggle('on', cb.checked); updateSel(); };
      row.appendChild(cb);
      var nm = el('div', 'nm'); nm.appendChild(el('span', '', s.title));
      if (!unitSel) nm.appendChild(el('span', 'tag', (s.grade ? s.grade + '年・' : '') + s.unit));
      row.appendChild(nm); row.appendChild(el('div', 'meta', s.count + '問'));
      box.appendChild(row);
    });
  updateSel();
}
function updateSel() {
  var ids = Object.keys(picked), n = 0;
  ids.forEach(function (i) { var s = SETS.filter(function (x) { return x.id === i; })[0]; if (s) n += s.count; });
  $('selBar').classList.toggle('hide', !ids.length);
  $('selInfo').textContent = '選んだセット：' + ids.length + ' つ・合計 ' + n + ' 問';
}
function setupErr(msg) { $('setupErr').textContent = msg; $('setupErr').classList.remove('hide'); }

$('btnCreate').onclick = async function () {
  $('setupErr').classList.add('hide'); $('btnCreate').disabled = true;
  try {
    var ids = Object.keys(picked).filter(function (i) { return SETS.some(function (x) { return x.id === i; }); });
    if (!ids.length) throw new Error('問題セットを1つ以上えらんでください');
    try { localStorage.setItem('qraft.chase.picked', JSON.stringify(ids)); } catch (e) {}
    for (var i = 0; i < 20; i++) {
      pin = String(Math.floor(100000 + Math.random() * 900000));
      if (!(await get(ref(db, 'rooms/' + pin + '/hostUid'))).exists()) break;
    }
    await set(ref(db, 'rooms/' + pin + '/hostUid'), uid);
    S = { mode: 'chase', phase: 'lobby', bg: curBg, sets: ids, fail: 0 };
    await set(ref(db, 'rooms/' + pin + '/state'), S);
    onValue(ref(db, 'rooms/' + pin + '/players'), function (s) { players = s.val() || {}; renderLobby(); });
    onValue(ref(db, 'rooms/' + pin + '/run'), function (s) { runs = s.val() || {}; });

    var base = location.href.replace(/chase-host\.html.*$/, ''), host = base.replace(/^https?:\/\//, ''), cut = host.indexOf('/');
    var u = $('joinUrl'); u.textContent = '';
    u.appendChild(document.createTextNode(cut < 0 ? host : host.slice(0, cut)));
    u.appendChild(document.createElement('wbr'));
    u.appendChild(document.createTextNode(cut < 0 ? 'chase-play.html' : host.slice(cut) + 'chase-play.html'));
    $('pin').textContent = pin.slice(0, 3) + ' ' + pin.slice(3);
    $('setTitle').textContent = 'ロボットラン・3レベル';
    var svg = qrSvg(base + 'chase-play.html?pin=' + pin);
    if (svg) $('qr').innerHTML = svg; else $('qrcard').classList.add('hide');
    showScreen('s-lobby');
  } catch (e) {
    setupErr('ルームを作れませんでした: ' + e.message);
    $('btnCreate').disabled = false;
  }
};

/* ------------------------------------------------------------ 待機室 */
var chipEls = {};
function renderLobby() {
  var ids = Object.keys(players);
  $('pcount').textContent = ids.length;
  $('btnStart').disabled = ids.length === 0 || started;
  var box = $('players');
  ids.forEach(function (id) {
    if (chipEls[id]) { chipEls[id].children[1].textContent = players[id].nick; return; }
    var c = el('span', 'pill extra'); c.appendChild(avatarEl(players[id].av, id)); c.appendChild(el('span', '', players[id].nick));
    var b = el('button', 'chip-x', '退出'); b.onclick = function () { var u = {}; u['kicked/' + id] = true; u['players/' + id] = null; u['run/' + id] = null; update(ref(db, 'rooms/' + pin), u); };
    c.appendChild(b); box.appendChild(c); chipEls[id] = c;
  });
  Object.keys(chipEls).forEach(function (id) { if (!players[id]) { chipEls[id].remove(); delete chipEls[id]; } });
}

/* ------------------------------------------------------------ ゲーム進行（先生の画面がすべて決める） */
function sumK() { return Object.keys(runs).reduce(function (a, id) { return a + (players[id] ? (runs[id].k || 0) : 0); }, 0); }
function save(extra) { Object.assign(S, extra); return update(ref(db, 'rooms/' + pin + '/state'), extra); }
function levelStart(level) {
  var N = S.N;
  return { phase: 'quiz', level: level, target: robotTarget(N, level), qstart: serverNow(), base: sumK(), caps: zonePlan(N, level), Tl: ROBOT.Tl, Zt: ROBOT.Zt };
}

$('btnStart').onclick = async function () {
  started = true; $('btnStart').disabled = true;
  window.addEventListener('beforeunload', function (e) { if (!ended) { e.preventDefault(); e.returnValue = ''; } });
  S.N = Object.keys(players).length; S.lives = ROBOT.lives; S.total = 0;
  await save(Object.assign({ N: S.N, lives: S.lives }, levelStart(1)));
  scene = mountScene($('sceneBox'), false); showScreen('s-run');
  tickId = setInterval(tick, 250);
};

function banner(msg, bad, sec) { var b = $('hBanner'); b.textContent = msg; b.classList.toggle('bad', !!bad); b.classList.remove('hide'); bannerUntil = Date.now() + sec * 1000; }

function tick() {
  if (!S || ended) return;
  var now = serverNow(), ids = Object.keys(players), list = ids.map(function (id) { return { uid: id, nick: players[id].nick, av: players[id].av }; });
  scene.setPlayers(list);
  var K = sumK(), C = K - (S.base || 0), p = Math.min(1, C / S.target), sec = (now - S.qstart) / 1000, frac = robotFrac(Math.max(0, sec), p);
  var choice = {}, caught = S.zres || [];
  ids.forEach(function (id) { var r = runs[id]; if (r && r.z != null && r.zt >= (S.zstart || 0)) choice[id] = r.z; });

  $('hLevel').textContent = 'レベル ' + S.level + ' / ' + ROBOT.levels;
  $('hLives').textContent = new Array(S.lives + 1).join('❤️') + new Array(ROBOT.lives - S.lives + 1).join('🖤');
  if (bannerUntil < Date.now()) $('hBanner').classList.add('hide');

  if (S.phase === 'quiz') {
    var left = Math.max(0, S.Tl - sec);
    $('hTime').textContent = Math.floor(left / 60) + ':' + String(Math.floor(left % 60)).padStart(2, '0');
    $('hFill').style.width = p * 100 + '%';
    $('hStat').textContent = '正解 ' + C + ' / ' + S.target;
    var ks = {}; ids.forEach(function (id) { ks[id] = (runs[id] && runs[id].k) || 0; });
    scene.draw({ phase: 'quiz', frac: frac, ks: ks });
    if (sec < 3) { if (bannerUntil < Date.now()) banner('レベル ' + S.level + ' スタート！ 問題に答えて ロボットから にげろ！', false, 3); return; }
    if (p >= 1) {
      banner('クリア！ 安全地帯へ急げ！', false, 3);
      save({ phase: 'zone', zstart: serverNow(), zres: null });
    } else if (frac >= 1 || sec >= S.Tl) {
      var lives = S.lives - 1;
      if (lives <= 0) return finish('lose', lives);
      banner('ロボットにつかまった！ ライフ −1　もう一度！', true, 4);
      save(Object.assign({ lives: lives, fail: (S.fail || 0) + 1 }, levelStart(S.level)));
    }
  } else if (S.phase === 'zone') {
    var zl = Math.max(0, S.Zt - (now - S.zstart) / 1000);
    $('hTime').textContent = '0:' + String(Math.ceil(zl)).padStart(2, '0');
    $('hFill').style.width = '100%';
    var chosen = Object.keys(choice).length;
    $('hStat').textContent = 'ゾーンに入った ' + chosen + ' / ' + ids.length + ' 人';
    scene.draw({ phase: 'zone', caps: S.caps, choice: choice });
    if (bannerUntil < Date.now()) banner('安全地帯に入れ！ 定員を超えると つかまる！ 相談しよう', false, 1);
    if (zl <= 0) {
      var cg = zoneEval(ids, runs, S.caps, S.zstart), tol = 1 + Math.floor(S.N / 10), lives2 = S.lives - (cg.length >= tol ? 1 : 0);
      save({ phase: 'zoneres', zres: cg, lives: lives2, zrstart: serverNow() });
      if (lives2 <= 0) finish('lose', lives2);
    }
  } else if (S.phase === 'zoneres') {
    scene.draw({ phase: 'zoneres', caps: S.caps, choice: choice, caught: S.zres || [] });
    var nc = (S.zres || []).length, tol2 = 1 + Math.floor(S.N / 10);
    if (bannerUntil < Date.now()) banner(nc ? nc + '人が つかまった！' + (nc >= tol2 ? ' ライフ −1' : '（セーフ）') : '全員 無事に入れた！', nc >= tol2, 1);
    $('hTime').textContent = '';
    if (now - S.zrstart > 5000) {
      if (S.level >= ROBOT.levels) finish('clear', S.lives); else save(levelStart(S.level + 1));
    }
  }
}

async function finish(result, lives) {
  if (ended) return; ended = true; clearInterval(tickId);
  var K = sumK();
  await update(ref(db, 'rooms/' + pin + '/state'), { phase: 'end', result: result, total: K, lives: Math.max(0, lives) });
  var win = result === 'clear';
  $('endEm').textContent = win ? '🎉' : '🤖';
  $('endTitle').textContent = win ? '全レベル クリア！ ロボットから にげきった！' : 'ロボットに つかまってしまった…';
  $('endK').textContent = K;
  $('endSub').textContent = (S.level && !win ? 'レベル ' + S.level + ' で ゲームオーバー' : '') + (win ? '残りライフ ' + lives + ' / ' + ROBOT.lives : '');
  showScreen('s-end'); if (win) confetti($('conf'), 46);
}
$('btnEnd').onclick = function () { if (confirm('ゲームを終えますか？')) finish('lose', 0); };
$('btnClose').onclick = async function () { await remove(ref(db, 'rooms/' + pin)); location.reload(); };
</script>
</body>
</html>
