<!DOCTYPE html>
<html lang="ja" data-bg="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リカリア チーム戦（先生）</title>
<link rel="icon" type="image/png" href="img/favicon-32.png">
<link rel="stylesheet" href="theme.css?v=20261113170142">
<link rel="stylesheet" href="quest.css?v=20261113170142">
<link rel="stylesheet" href="rikaria.css?v=20261113170142">
<style>
  #app { background:url(img/rikaria/title-bg.webp) center/cover no-repeat, #1d1648; }
  .q-bg-r { background:rgba(10,6,36,.6); }
  #s-run { padding:.6em; gap:.5em; background:#0a0720; }
  .pj-grid { flex:1; display:grid; gap:.5em; min-height:0; }
  .gp-card { background:rgba(14,8,40,.8); border-radius:1em; padding:.7em 1em; display:flex; flex-direction:column; gap:.4em; }
  .gp-card .mem-mini span { display:inline-flex; align-items:center; gap:.2em; margin:0 .4em .2em 0; font-weight:800; }
  .gp-card .mem-mini img { height:2em; }
  .gp-card .mem-mini .ko { opacity:.45; }
  .gp-card .prog { font-size:.85em; opacity:.85; }
  .tm .lead { position:absolute; right:.6em; bottom:2em; z-index:41; font-size:.75em; }
  #obRow select { font-size:1em; padding:.3em .5em; border-radius:.5em; }
  /* テストプレイ（2026-11-13）の直し */
  #s-setup .qp-white { max-height:none; }                       /* 問題セットの一覧が2行しか見えなかった（二重のスクロール） */
  #s-setup .selbar { color:#fff; } #s-setup .chip2 { color:var(--ink-dark); } #s-setup .selbar .linkbtn { color:var(--q-gold); }   /* 白い字・赤い字が背景にとけていた */
  #pw { width:17em; max-width:100%; }
  #s-lobby { padding:2em 2.6em; }
  #s-lobby .tc-grid { flex:1 1 0; min-height:0; align-content:start; grid-template-columns:repeat(auto-fill, minmax(14em, 1fr)) !important; }   /* 4班より先が画面の下に切れて見えなかった */
  #s-lobby { gap:.7em !important; }
  #s-lobby .gp-card { position:relative; padding:.45em .8em .5em; gap:.15em; }   /* 40人・8班が1画面に入る低さに */
  #s-lobby .gp-card > small { position:absolute; right:.9em; top:.6em; font-size:.72em; }
  #s-lobby .gp-card .mem-mini { gap:0 .5em; align-items:center; }
  #s-lobby .gp-card .mem-mini span { flex-direction:row; font-size:.7em; margin:0; white-space:nowrap; line-height:1.2; }
  #s-lobby .gp-card .mem-mini img { height:1.75em; }
  #s-lobby .chip-x { min-width:1.7em; min-height:1.7em; padding:0; }
  #s-end .tc-grid { max-height:52%; }
</style>
</head>
<body>
<div id="app">

<!-- ① 準備 -->
<section class="screen q-bg-r" id="s-setup" style="overflow:auto">
  <div class="wrap">
    <div class="row"><a class="backlink" href="rikaria.html">← リカリアへ</a><div class="grow"></div></div>
    <div class="row" style="gap:.8em"><img src="img/rikaria/logo.webp" alt="Rikaria" style="height:3.6em"><div class="q-title">チーム戦（先生）</div></div>
    <div class="panel" style="display:flex;flex-direction:column;gap:.8em">
      <div class="form-row"><b>クラス</b>
        <select id="selG" aria-label="学年"><option value="1">1年</option><option value="2">2年</option><option value="3">3年</option></select>
        <select id="selC" aria-label="組"></select>
        <span class="q-sub" id="townInfo"></span>
        <button type="button" class="iconbtn" id="btnTown" aria-label="町の名前を変える" title="町の名前を変える" aria-expanded="false">✏️</button>
        <span id="townEdit" class="hide"><input type="text" id="townName" maxlength="12" autocomplete="off" aria-label="町の名前（12文字まで）" placeholder="ルーメンの村">
          <button type="button" class="btn sub" id="townSave">決定</button> <button type="button" class="linkbtn" id="townCancel" style="color:#fff">やめる</button></span></div>
      <div class="form-row"><b>戦い</b><div class="seg" id="segMode"><button type="button" data-v="dg" class="on">ダンジョン</button><button type="button" data-v="ob">オブリオン戦（学期末）</button></div></div>
      <div class="form-row hide" id="obRow"><b>オブリオン</b><select id="selOb" aria-label="戦う形態"></select>
        <div class="seg" id="segSem"><button type="button" data-v="3" class="on">3学期制</button><button type="button" data-v="2">2学期制</button></div>
        <span class="q-sub" id="obInfo"></span></div>
      <div class="form-row"><b>時間</b><div class="seg" id="segTime"><button type="button" data-v="300">5分</button><button type="button" data-v="600" class="on">10分</button><button type="button" data-v="900">15分</button></div></div>
      <div class="form-row"><b>パスワード</b><input type="password" id="pw" autocomplete="off" placeholder="問題ファイルのパスワード"></div>
      <div class="tc-note" id="setupNote">地図でえらんだ単元が、冒険するダンジョンになります。どこで終わっても、班ごとに続きから始まります。</div>
    </div>
    <!-- 冒険の地図：場所を押すと、その単元になる。霧＝まだボスを倒していない・旗＝クリア -->
    <div class="panel am-wrap" id="amWrap">
      <div class="row" style="flex-wrap:wrap"><b class="grow">🗺 冒険の地図：行き先（単元）をえらぶ</b>
        <span class="am-list"><label for="selUnit">単元</label><select id="selUnit"></select></span></div>
      <div class="am-map" id="amMap"></div>
      <div class="q-sub" id="amNote"></div>
    </div>
    <div class="qp-white"><div id="picker"></div></div>
    <div class="selbar hide" id="selBar"><span id="selInfo"></span><span id="selChips"></span><button type="button" class="linkbtn" id="selClear">選びなおす</button></div>
    <div style="text-align:center"><button class="btn" id="btnCreate" type="button">部屋を作る</button></div>
    <div id="setupErr" class="err hide" role="alert"></div>
  </div>
</section>

<!-- ② 待機室（班ごと） -->
<section class="screen q-bg-r" id="s-lobby" style="gap:1em">
  <div class="tc-head">
    <div class="grow"><div class="q-sub" id="lbSub"></div><div class="q-title" id="lbTitle"></div></div>
    <div class="panel row" style="padding:.5em 1em"><span class="q-sub">参加コード</span><span class="tc-pin" id="pin"></span></div>
    <div class="panel" id="qrcard" style="padding:.4em"><div class="qr" id="qr" style="width:6em"></div></div>
  </div>
  <div class="panel"><span class="q-sub">① このアドレスを開く：</span> <b id="joinUrl"></b>　<span class="q-sub">② 参加コード・出席番号・班を入れる　③ 技をえらんで準備OK</span></div>
  <div class="row"><b class="grow">👥 <span id="pcount">0</span>人が参加中　<span id="lbHint" class="q-sub"></span></b>
    <button class="btn quit" id="btnQuit" type="button">やめる</button><button class="snd"></button>
    <button class="btn tc-big" id="btnStart" type="button" disabled>出発！</button></div>
  <div class="tc-grid" id="groups" style="grid-template-columns:repeat(auto-fill,minmax(16em,1fr))"></div>
</section>

<!-- ③ 冒険中：全班を分割して映す -->
<section class="screen" id="s-run">
  <div class="pj-head"><div><span class="q-sub" id="runSub"></span> <span class="q-title" id="runTitle"></span></div>
    <div class="row" style="gap:.6em"><button class="snd"></button><div class="panel" style="padding:.3em 1em">のこり <b style="color:var(--q-gold)" id="clock">0:00</b></div><button class="btn ghost" id="btnEnd" type="button">終了して保存</button></div></div>
  <div class="pj-grid" id="pjGrid"></div>
</section>

<!-- ④ 結果 -->
<section class="screen center q-bg-r" id="s-end" style="gap:1em">
  <div class="confetti" id="conf"></div>
  <div class="lvup" id="endTitle" style="font-size:2.4em">今日の冒険おわり</div>
  <div class="tc-grid" id="endGroups" style="width:min(70em,94%);grid-template-columns:repeat(auto-fill,minmax(16em,1fr))"></div>
  <div class="q-sub" id="endNote"></div>
  <button class="btn sub" id="btnClose" type="button">部屋を閉じる</button>
</section>

<!-- 物語の場面（章の始まり・単元ボス・オブリオン・エンディング）。「つぎへ」で閉じる -->
<div class="story-ov hide" id="story" role="dialog" aria-modal="true" aria-labelledby="stH">
  <img class="st-pic" id="stPic" alt="">
  <h2 id="stH"></h2><p id="stS"></p>
  <div class="row" style="gap:1em"><span class="st-n" id="stN"></span><button class="btn" id="stNext" type="button">つぎへ</button></div>
</div>

</div>

<script src="firebase-config.js?v=20261113170142"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module">
import { signIn, db, ref, set, get, update, remove, onValue, serverNow, shuffle, mountSetPicker,
         decryptSet, prepareQuestion, maskOf, $, showScreen, confetti, qrSvg } from './lib.js?v=20261113170142';
import { onChildAdded, onChildChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { fiscalYear } from './quest.js?v=20261113170142';
import { TOWN, TOWN_DEFAULT, TOWN_MAX, townStart, JOBS, heroImg, statsOf, unitOf, addExp, bossSp, bossTitle, migrateChar, battleBg, LV_MAX, OBLION, OB_FORMS, obNext, obFirst, obTitle, oblionImg, REWARD, ELEM,
         unitById, unitsOf, advMap, townName, goldOf, isCarry, storyOpen, storyBoss, storyOb, storyEnding } from './rikaria-data.js?v=20261113170142';
import * as E from './rikaria-engine.js?v=20261113170142';
import { el, esc, drawField, moveField, cameraOf, ovban, MAP, spiritHtml } from './rikaria-view.js?v=20261113170142';
import { bgm, sfx, preload, wireSoundButtons } from './sound.js?v=20261113170142b';

wireSoundButtons(); preload(['top']); bgm('top');
var TS = { '.sv': 'timestamp' };
var uid = null, pin = null, YEAR = fiscalYear(), SETS = [], picked = {}, picker = null, POOL = [];
var S = null, U = null, CLS = null, players = {}, GR = {}, P = {}, ended = false, loopId = null, endsAt = 0;
var O = null, OBW = {}, obDown = false;   /* オブリオン戦：クラスで1体の体・その形態に参加した人 */
function isOb() { return S ? S.kind === 'ob' : segVal('segMode') === 'ob'; }

function opt(sel, v, t) { var o = el('option', '', t); o.value = v; sel.appendChild(o); }
for (var c = 1; c <= 9; c++) opt($('selC'), c, c + '組');
function segVal(id) { return document.querySelector('#' + id + ' button.on').dataset.v; }
document.querySelectorAll('.seg').forEach(function (s) { s.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; s.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); }); });
function clsKey() { return $('selG').value + '-' + $('selC').value; }
function qpath(p) { return 'quest/' + YEAR + '/' + p; }
function setupErr(m) { $('setupErr').textContent = m; $('setupErr').classList.remove('hide'); }
function num(sid) { return Number(String(sid || '').split('-')[2]) || 0; }

/* ------------------------------------------------------------ 準備 */
(async function init() {
  showScreen('s-setup');
  try {
    uid = (await signIn()).uid;
    if ((await get(ref(db, 'admins/' + uid))).val() !== true) throw new Error('この端末は先生の端末として登録されていません。先に記録画面（records.html）で登録してください。');
    var all = await (await fetch('questions/index.json', { cache: 'no-cache' })).json();
    SETS = all.filter(function (s) { return !(s.types && s.types.text); });
    try { $('pw').value = sessionStorage.getItem('qraft.pw') || ''; } catch (e) {}
    try { var last = JSON.parse(localStorage.getItem('qraft.rikaria.last') || '{}'); if (last.g) $('selG').value = last.g; if (last.c) $('selC').value = last.c; if (last.t) document.querySelectorAll('#segTime button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === String(last.t)); }); if (last.m) { document.querySelectorAll('#segMode button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === last.m); }); modeUi(); } (last.sets || []).forEach(function (f) { if (SETS.some(function (s) { return s.file === f; })) picked[f] = true; }); if (last.u && unitById(last.u).id === last.u && unitById(last.u).g === Number($('selG').value)) selUnit = last.u; } catch (e) {}
    mountPicker(); drawMap();
    $('selClear').onclick = function () { Object.keys(picked).forEach(function (k) { delete picked[k]; }); picker.render(); updateSel(); };
    $('selG').onchange = function () { selUnit = ''; mountPicker(); showTown(); }; $('selC').onchange = showTown; showTown();
    $('selUnit').onchange = function () { pickUnit($('selUnit').value); };
    $('segMode').addEventListener('click', function () { setTimeout(modeUi, 0); });
    $('segSem').addEventListener('click', function () { setTimeout(function () { fillOb(null); }, 0); });
  } catch (e) { setupErr(e.message); $('btnCreate').disabled = true; }
})();
/* ------------------------------------------------------------ 冒険の地図で単元をえらぶ（霧＝まだボスを倒していない・旗＝クリア） */
var selUnit = '';   /* えらんだ単元の id（空＝まだ。そのときは最初に選んだセットの単元） */
function mountPicker() {
  var u = selUnit ? unitById(selUnit) : null;
  var sets = u ? SETS.filter(function (x) { return x.unit === u.unit && (!x.grade || x.grade === u.g); }) : SETS;
  if (!sets.length) sets = SETS;   /* その単元の問題セットがまだ無いときは、ぜんぶ出す */
  picker = mountSetPicker($('picker'), { sets: sets, key: function (x) { return x.file; }, picked: picked, onChange: updateSel }); updateSel();
}
function pickUnit(id) { selUnit = id && unitById(id).id === id ? id : ''; mountPicker(); drawMap(); }
function drawMap() {
  var g = Number($('selG').value), M = advMap(g), us = unitsOf(g), areas = CLSV.areas || {}, box = $('amMap');
  if (selUnit && !us.some(function (u) { return u.id === selUnit; })) selUnit = '';
  box.style.aspectRatio = M.ratio; box.style.backgroundImage = 'url(' + M.img + ')';
  var done = function (u) { return !!(areas[u.id] && areas[u.id].done); };
  var h = us.map(function (u) { var p = M.at[u.id]; return done(u) ? '' : '<div class="am-fog" style="left:' + p[0] + '%;top:' + (p[1] - 3) + '%"></div>'; }).join('');
  h += '<span class="am-mark" style="left:' + M.town[0] + '%;top:' + M.town[1] + '%">🏠 ' + esc(CLSV.town || TOWN_DEFAULT) + '</span><span class="am-mark" style="left:' + M.castle[0] + '%;top:' + M.castle[1] + '%">🏰 忘却の城</span>';
  h += us.map(function (u) {
    var p = M.at[u.id], d = done(u), on = u.id === selUnit;
    return '<button type="button" class="am-node' + (d ? ' clear' : '') + (on ? ' on' : '') + '" data-u="' + u.id + '" aria-pressed="' + (on ? 'true' : 'false') + '" style="left:' + p[0] + '%;top:' + p[1] + '%">' +
      (d ? '<span class="flag" aria-hidden="true">🚩</span>' : '') + '<i class="pin"></i><b>' + esc(u.area) + '</b><small>' + esc(u.unit) + ' ・ ' + (d ? 'クリア' : '霧の中') + '</small></button>';
  }).join('');
  box.innerHTML = h;
  box.querySelectorAll('.am-node').forEach(function (b) { b.onclick = function () { pickUnit(b.dataset.u); }; });
  var sel = $('selUnit'); sel.textContent = ''; opt(sel, '', '（地図でえらぶ）');
  us.forEach(function (u) { opt(sel, u.id, u.unit + '：' + u.area + (done(u) ? '（クリア）' : '（霧の中）')); }); sel.value = selUnit;
  var su = selUnit ? unitById(selUnit) : null;
  $('amNote').textContent = su ? 'ダンジョン：' + su.area + '（' + su.unit + '）。下に、この単元の問題セットが出ています。' : '場所を押すと、その単元がダンジョンになります（押さないときは、最初に選んだセットの単元）。';
}
function curUnit() { var f = firstSet(); return selUnit ? unitById(selUnit) : f ? unitOf(f.grade, f.unit) : null; }
function firstSet() { var ids = Object.keys(picked); return SETS.filter(function (x) { return x.file === ids[0]; })[0]; }
function updateSel() {
  var ids = Object.keys(picked), n = 0;
  ids.forEach(function (f) { var s = SETS.filter(function (x) { return x.file === f; })[0]; if (s) n += s.count; });
  $('selBar').classList.toggle('hide', !ids.length);
  var u = curUnit();
  $('selInfo').textContent = '選んだセット：' + ids.length + ' つ・合計 ' + n + ' 問' + (u ? '　ダンジョン：' + u.area + '（' + u.unit + '）' : '');
  var chips = $('selChips'); chips.textContent = '';
  ids.forEach(function (k) {
    var s = SETS.filter(function (x) { return x.file === k; })[0]; if (!s) return;
    var c = el('span', 'chip2'); c.appendChild(el('span', '', (s.grade ? s.grade + '年 ' : '') + s.title));
    var x = el('button', '', '×'); x.type = 'button'; x.setAttribute('aria-label', s.title + 'をはずす');
    x.onclick = function () { delete picked[k]; picker.render(); updateSel(); };
    c.appendChild(x); chips.appendChild(c);
  });
}
var CLSV = {};
/* 1回だけ読む（get() が返ってこないことがあったため、onValue の1回読みにする） */
function once(path) { return new Promise(function (ok, ng) { onValue(ref(db, path), function (sn) { ok(sn.val()); }, function (e) { ng(e); }, { onlyOnce: true }); }); }
function townLine() { var v = CLSV; $('townInfo').textContent = '町：' + (v.town || TOWN_DEFAULT) + '（' + TOWN[Math.min(TOWN_MAX, v.stage != null ? v.stage : townStart(Number($('selG').value)))].n + '）'; }   /* 部屋を作る前は S がない */
/* 町の名前（学級で決めて、先生が入れる。組ごとにいつでも変えられる。空にすると「ルーメンの村」にもどる） */
function townEdit(open) { $('townEdit').classList.toggle('hide', !open); $('btnTown').setAttribute('aria-expanded', open ? 'true' : 'false'); if (open) { $('townName').value = CLSV.town && CLSV.town !== TOWN_DEFAULT ? CLSV.town : ''; $('townName').focus(); } }
$('btnTown').onclick = function () { townEdit($('townEdit').classList.contains('hide')); };
$('townCancel').onclick = function () { townEdit(false); };
$('townName').onkeydown = function (e) { if (e.key === 'Enter') $('townSave').click(); if (e.key === 'Escape') townEdit(false); };
$('townSave').onclick = async function () {
  var key = clsKey(), nm = townName($('townName').value);
  $('setupErr').classList.add('hide');
  try { await set(ref(db, qpath('classes/' + key + '/town')), nm); if (key === clsKey()) { CLSV.town = nm; townLine(); drawMap(); } townEdit(false); }
  catch (e) { setupErr('町の名前を保存できませんでした: ' + e.message); }
};
async function showTown() {
  CLSV = {}; townEdit(false); drawMap(); fillOb(null); $('obInfo').textContent = 'クラスの記録を読みこみ中…';   /* 読みこむ前に、学年から決まる形態を先に出しておく */
  var key = clsKey(), v;
  try { v = await once(qpath('classes/' + key)); } catch (e) { $('obInfo').textContent = 'クラスの記録を読みこめませんでした（' + e.message + '）'; return; }
  if (key !== clsKey()) return;   /* 読みこむ間にクラスを変えた */
  CLSV = v = v || {};
  townLine(); drawMap();
  var sem = v.ob && v.ob.sem ? String(v.ob.sem) : '3';
  document.querySelectorAll('#segSem button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === sem); });
  fillOb(v.ob && v.ob.k != null ? v.ob.k : null);
}
/* オブリオン：クラスの「次に戦う形態」を出す（はじめてのときは学年から。2学期制・3年から受け持つクラスはここで直す） */
function fillOb(k) {
  var sem = Number(segVal('segSem')), forms = OB_FORMS[sem], sel = $('selOb'), ob = CLSV.ob || {};
  if (k == null || (k && forms.indexOf(k) < 0)) k = ob.k != null && forms.indexOf(ob.k) >= 0 ? ob.k : obFirst(Number($('selG').value), sem);
  sel.textContent = '';
  forms.forEach(function (f, i) { opt(sel, f, '形態' + f + '　' + OBLION[f - 1].n + '（' + (Math.floor(i / (forms.length / 3)) + 1) + '年' + (i % (forms.length / 3) + 1) + (sem === 3 ? '学期' : '期') + '末）'); });
  if (k) sel.value = String(k);
  $('obInfo').textContent = !k && ob.k === 0 ? 'このクラスは9形態すべてを倒しました' : ob.k === k && ob.hp > 0 ? '前回の続き：残りHP ' + Math.ceil(100 * ob.hp / ob.mx) + '%' : 'はじめての戦い';
}
function modeUi() {
  var ob = segVal('segMode') === 'ob';
  $('obRow').classList.toggle('hide', !ob);
  $('setupNote').textContent = ob ? 'クラス全員で1体のオブリオンと戦います（出題は選んだセットから）。倒せなかったら、HPは次の授業に持ち越します。' : '地図でえらんだ単元が、冒険するダンジョンになります。どこで終わっても、班ごとに続きから始まります。';
}

$('btnCreate').onclick = async function () {
  $('setupErr').classList.add('hide'); $('btnCreate').disabled = true;
  try {
    var files = Object.keys(picked).filter(function (f) { return SETS.some(function (s) { return s.file === f; }); });
    if (!files.length) throw new Error('問題セットを1つ以上えらんでください');
    var pwv = $('pw').value; POOL = [];
    for (var i = 0; i < files.length; i++) {
      var data = await (await fetch('questions/' + files[i])).json();
      if (data.enc) { if (!pwv) throw new Error('パスワードを入れてください'); data = await decryptSet(data, pwv); }

    }

  g.style.gridTemplateColumns = '1fr'; g.style.gridTemplateRows = '1fr auto';
  g.innerHTML = '<div class="ob-stage" id="obStage"><div class="ob-bg"></div><img id="obImg" alt="" src="' + oblionImg(O.k) + '">' +
    '<div class="ob-hud"><b id="obName"></b><div class="bar hp obbar"><i></i><b id="obPct"></b></div><span class="ob-st" id="obSt"></span></div></div>' +
    '<div class="ob-gps many" style="grid-template-columns:repeat(' + (ns.length > 5 ? Math.ceil(ns.length / 2) : ns.length) + ',1fr)">' + ns.map(function (n) { return '<div class="gp-card ob-gp" id="tm' + n + '"></div>'; }).join('') + '</div>';
}
function drawObStage(evs) {
  var st = $('obStage'); if (!st) return;
  var e9 = O.sw === 'guard', col = e9 ? '#fff' : ELEM[O.t[O.ei]].col;
  $('obImg').style.setProperty('--obc', col); $('obImg').classList.toggle('cast', !!O.cast); $('obImg').classList.toggle('dead', O.hp <= 0);
  $('obName').textContent = '👑 ' + O.n + '　' + (e9 ? '班ごとに色が変わる' : 'いまの色：' + ELEM[O.t[O.ei]].ic + ELEM[O.t[O.ei]].n);
  var pct = O.hp / O.mx; st.querySelector('.obbar i').style.width = (100 * pct) + '%'; $('obPct').textContent = 'クラスのHP ' + Math.ceil(100 * pct) + '%';
  $('obSt').textContent = O.hp <= 0 ? '🎉 たおした！' : O.cast ? '✨「' + O.sk[O.cast.i].n + '」のかまえ！' : O.ward > 0 ? '🛡 守りを固めている' : O.rage > 0 ? '💢 怒っている' : '';
  evs.forEach(function (e) { if (e.s && e.t !== 'bsk') ovban(st, e.s, e.big || e.t === 'cast' || e.t === 'clear'); });
}
function drawObTile(n, v, q0) {
  var c = $('tm' + n); if (!c) return;
  var mem = Object.keys(v.mem).map(function (id) { var o = v.mem[id]; return '<span class="' + (o.dn ? 'ko' : '') + '"><img alt="" src="' + heroImg(o.j, o.lk) + '">' + spiritHtml(o) + '<i class="hpb"><i style="width:' + (100 * o.hp / o.mx) + '%"></i></i><b class="nm">' + (o.sl ? '🔒' : '') + (o.ps ? '☠' : '') + esc(o.n) + '</b></span>'; }).join('');
  var f = v.foes[0] || {}, st = v.ph === 'rest' ? '💤 全滅… あと' + v.rt + '秒で立ち上がる' : f.chg > 0 ? '⚠ 強い攻撃まで ' + f.chg + '秒（ガード ' + (v.gc || 0) + '/4）' : v.ph === 'result' ? '🎉 勝利！' : '戦闘中';
  var col = f.t && ELEM[f.t] ? ELEM[f.t].col : '#fff';
  c.className = 'gp-card ob-gp' + (v.ph === 'rest' ? ' rest' : '') + (f.chg > 0 ? ' cg' : '');
  c.innerHTML = '<b>' + n + '班 <i class="dot" style="background:' + col + '"></i></b><div class="mem-mini">' + mem + '</div><small>' + st + '</small>';
  (v.ev || []).forEach(function (e) { if (e.q > q0 && !e.ob && (e.t === 'wipe' || (e.t === 'ban' && /ガード成功/.test(e.s)))) ovban(c, e.s, false); });
}

/* ------------------------------------------------------------ 終了：班の進み具合・キャラ・町を保存 */
$('btnEnd').onclick = function () { finish(); };
/* ごほうびは、いま保存されているキャラに足す（授業中に生徒が上げた技のランク・技えらび・使った持ち物を、参加したときの写しで上書きしないため） */
async function freshChar(sid, ch) {
  var c = null;
  try { c = (await get(ref(db, qpath('chars/' + sid)))).val(); if (c) migrateChar(c); } catch (e) {}
  if (!c) c = JSON.parse(JSON.stringify(ch));
  delete c.guest; return c;
}
async function finish() {
  if (ended) return; ended = true; clearInterval(loopId); clearTimeout(R_END);
  var cls = CLS || {}, areas = cls.areas || {}, stage0 = cls.stage != null ? cls.stage : townStart(S.g);
  /* 町が育つのは、その単元のボスをクラスで最初の1班が倒したとき */
  var firstBoss = !O && !(areas[U.id] && areas[U.id].done) && Object.keys(GR).some(function (n) { return GR[n].bossLaps.some(function (l) { return l === 0; }); });
  var stage1 = firstBoss ? Math.min(TOWN_MAX, stage0 + 1) : stage0;
  S.phase = 'saving'; S.tw = { n: cls.town || TOWN_DEFAULT, st: stage1 };   /* tw＝生徒の結果画面の物語に使う（町の名前・段階） */
  await update(ref(db, 'rooms/' + pin + '/state'), { phase: 'saving', tw: S.tw, story: null });
  if (O) return finishOb();
  var up = {}, res = {};
  for (var n of Object.keys(GR)) {
    var R = GR[n], G = R.G, out = E.results(G), snap = E.snapshot(G);
    G.order.forEach(function (u) { if (players[u]) R.who[players[u].sid] = true; });
    up[progPath(n)] = { fl: snap.fl, keys: snap.keys, wins: snap.wins, lap: snap.lap, lead: players[R.lead] ? players[R.lead].sid : '', snap: snap, who: R.who, t: TS };
    for (var u of G.order) {
      var p = players[u], ch = CH[u], o = out[u]; if (!p || !ch || !o) continue;
      var r = { exp: o.exp, gold: o.gold, ok: o.ok, ans: o.ans, fl: snap.fl, keys: snap.keys, boss: R.bossLaps.length ? 1 : 0 };
      if (!ch.guest && (await owns(u, p.sid))) {
        var c2 = await freshChar(p.sid, ch);
        var lv0 = c2.lv || 1; r.up = addExp(c2, o.exp); r.lv = c2.lv; r.sp = r.up;
        c2.gold = (c2.gold || 0) + o.gold;
        R.bossLaps.forEach(function (l) { var b = bossSp(l); c2.sp = (c2.sp || 0) + b; c2.spt = (c2.spt || 0) + b; r.sp += b; });
        if (R.bossLaps.length) { r.ttl = bossTitle(U, Math.max.apply(null, R.bossLaps)); c2.ttl = Object.assign({}, c2.ttl || {}); c2.ttl[U.id] = r.ttl; }
        c2.u = TS; up[qpath('chars/' + p.sid)] = c2;
      }
      res[u] = r;
    }
  }
  if (firstBoss) { up[qpath('classes/' + S.g + '-' + S.c + '/stage')] = stage1; up[qpath('classes/' + S.g + '-' + S.c + '/areas/' + U.id + '/done')] = true; }
  if (!cls.town) up[qpath('classes/' + S.g + '-' + S.c + '/town')] = TOWN_DEFAULT;
  if (!firstBoss && cls.stage == null) up[qpath('classes/' + S.g + '-' + S.c + '/stage')] = townStart(S.g);   /* クラス替えのあとは学年の4月の段階から */
  var saveErr = '';
  try { await update(ref(db), up); } catch (e) { saveErr = '記録を保存できませんでした（' + e.message + '）'; }
  await set(ref(db, 'rooms/' + pin + '/res'), res);
  await update(ref(db, 'rooms/' + pin + '/state'), { phase: 'end' });
  bgm(null); showEnd(firstBoss, saveErr);
  if (firstBoss) story([storyBoss(U, S.tw.n, stage1)]);   /* 単元ボスの場面＋町の様子 */
}
/* オブリオン戦の保存：クラスの「次の形態・残りHP・参加した人」。倒したら、その形態に一度でも参加した人全員にごほうび */
function obReward(c2, r) {
  var lvUp = addExp(c2, REWARD.ob.exp), gd = goldOf('ob', S.g); c2.gold = (c2.gold || 0) + gd;   /* 学年の倍率（1年100・2年190・3年300）。クラスの学年で決まる */
  c2.sp = (c2.sp || 0) + REWARD.ob.sp; c2.spt = (c2.spt || 0) + REWARD.ob.sp;
  c2.ttl = Object.assign({}, c2.ttl || {}); c2.ttl['ob' + O.k] = obTitle(O.k);
  if (r) { r.ttl = obTitle(O.k); r.sp = (r.sp || 0) + REWARD.ob.sp + lvUp; r.up = (r.up || 0) + lvUp; r.lv = c2.lv; r.exp += REWARD.ob.exp; r.gold += gd; }
}
async function finishOb() {
  var up = {}, res = {}, ck = qpath('classes/' + S.g + '-' + S.c), done = O.hp <= 0, today = {};
  Object.keys(GR).forEach(function (n) { GR[n].G.order.forEach(function (u) { if (players[u]) { OBW[players[u].sid] = true; today[players[u].sid] = true; } }); });
  up[ck + '/ob'] = done ? { k: obNext(O.k, S.sem), hp: 0, mx: 0, who: {}, sem: S.sem, t: TS } : { k: O.k, hp: Math.max(1, Math.round(O.hp)), mx: O.mx, who: OBW, sem: S.sem, t: TS };
  if (done) up[ck + '/obDone/' + O.k] = true;
  if (!(CLS || {}).town) up[ck + '/town'] = TOWN_DEFAULT;
  for (var n of Object.keys(GR)) {
    var G = GR[n].G, out = E.results(G);
    for (var u of G.order) {
      var p = players[u], ch = CH[u], o = out[u]; if (!p || !ch || !o) continue;
      var r = { exp: o.exp, gold: o.gold, ok: o.ok, ans: o.ans, dmg: o.dmg, ob: O.k, obWin: done ? 1 : 0, obHp: Math.ceil(100 * Math.max(0, O.hp) / O.mx) };
      if (!ch.guest && (await owns(u, p.sid))) {
        var c2 = await freshChar(p.sid, ch);
        r.up = addExp(c2, o.exp); r.lv = c2.lv; r.sp = r.up; c2.gold = (c2.gold || 0) + o.gold;
        if (done) obReward(c2, r);
        c2.u = TS; up[qpath('chars/' + p.sid)] = c2;
      }
      res[u] = r;
    }
  }
  var saveErr = '';
  if (done) {   /* 今日来ていない人（前の授業で参加した人）にも */
    for (var sid of Object.keys(OBW)) {
      if (today[sid]) continue;
      try { var c3 = (await get(ref(db, qpath('chars/' + sid)))).val(); if (!c3) continue; migrateChar(c3); obReward(c3, null); c3.u = TS; up[qpath('chars/' + sid)] = c3; } catch (e) { saveErr = '一部の人のごほうびを保存できませんでした'; }
    }
  }
  try { await update(ref(db), up); } catch (e) { saveErr = '記録を保存できませんでした（' + e.message + '）'; }
  await set(ref(db, 'rooms/' + pin + '/res'), res);
  await update(ref(db, 'rooms/' + pin + '/state'), { phase: 'end' });
  bgm(null);
  var box = $('endGroups'); box.textContent = '';
  $('endTitle').textContent = done ? O.n + ' を封じた！' : '今日の戦いおわり';
  if (done) confetti($('conf'), 60);
  var c = el('div', 'gp-card'); c.appendChild(el('b', '', done ? '🎉 クラスでたおした！　参加した ' + Object.keys(OBW).length + '人に ごほうび（' + goldOf('ob', S.g) + 'G・SP +' + REWARD.ob.sp + '・称号「' + obTitle(O.k) + '」）' : '残りHP ' + Math.ceil(100 * O.hp / O.mx) + '%　次の授業で続きから'));
  box.appendChild(c);
  box.style.gridTemplateColumns = 'minmax(0, 44em)'; box.style.justifyContent = 'center';   /* 1枚だけなので、まん中に */
  $('endNote').textContent = saveErr || (done ? (obNext(O.k, S.sem) ? '次の学期末は「' + OBLION[obNext(O.k, S.sem) - 1].n + '」です。' : '9つの形態を、すべて封じました。') : 'オブリオンのHPと、参加した人を保存しました。');
  showScreen('s-end');
  /* 倒した日だけ「倒したあと」の場面。形態9（最後）のあとはエンディング */
  if (done) story([storyOb(O.k, 'a', S.tw.n)].concat(O.k === 9 ? storyEnding(S.tw.n) : []));
}
function showEnd(firstBoss, saveErr) {
  var box = $('endGroups'); box.textContent = '';
  Object.keys(GR).sort(function (a, b) { return a - b; }).forEach(function (n) {
    var G = GR[n].G, c = el('div', 'gp-card');
    c.appendChild(el('b', '', n + '班　' + (G.kind === 'boss' || G.fl > 4 ? 'ボスの間' : G.fl + '階') + '　🔑' + G.keys + (G.lap ? '　' + (G.lap + 1) + '周目' : '')));
    if (GR[n].bossLaps.length) c.appendChild(el('div', '', '🎉 ' + U.boss.n + ' をたおした！'));
    c.appendChild(el('div', 'prog', G.ph === 'battle' ? '戦闘の途中で止めた（次は続きから）' : '探索の途中で止めた（次は続きから）'));
    box.appendChild(c);
  });
  if (firstBoss) { $('endTitle').textContent = U.area + 'の霧が晴れた！'; confetti($('conf'), 50); }
  $('endNote').textContent = saveErr || 'キャラ・班の進み具合を保存しました。次の授業は、班ごとに続きから始まります。';
  showScreen('s-end');
}
$('btnClose').onclick = async function () { await remove(ref(db, 'rooms/' + pin)); location.reload(); };
</script>
