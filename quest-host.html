<!DOCTYPE html>
<html lang="ja" data-bg="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qraft クエスト（先生）</title>
<link rel="icon" type="image/png" href="img/favicon-32.png">
<link rel="stylesheet" href="theme.css?v=20261112060951">
<link rel="stylesheet" href="quest.css?v=20261112060951">
</head>
<body>
<div id="app">

<!-- ① 準備 -->
<section class="screen q-bg-lab" id="s-setup" style="overflow:auto">
  <div class="wrap">
    <div class="row"><a class="backlink" href="index.html" style="color:#fff">← もどる</a><div class="grow"></div></div>
    <div class="q-title">⚔️ クエスト ・ チームモード</div>
    <div class="panel" style="display:flex;flex-direction:column;gap:.8em">
      <div class="form-row"><b>クラス</b>
        <select id="selG"><option value="1">1年</option><option value="2">2年</option><option value="3">3年</option></select>
        <select id="selC"></select>
        <span class="q-sub" id="townInfo"></span></div>
      <div class="form-row"><b>今回の戦い</b><div class="seg" id="segBattle"><button type="button" data-v="zako" class="on">雑魚戦</button><button type="button" data-v="boss">ボス戦</button></div></div>
      <div class="form-row"><b>制限時間</b><div class="seg" id="segTime"><button type="button" data-v="300">5分</button><button type="button" data-v="480" class="on">8分</button><button type="button" data-v="600">10分</button></div></div>
      <div class="form-row"><b>パスワード</b><input type="password" id="pw" autocomplete="off" placeholder="問題ファイルのパスワード"></div>
      <div class="tc-note">問題セットは、選択式だけのセットから選べます（入力式が入ったセットは出しません）。最初に選んだセットの単元が、冒険するエリアになります。</div>
    </div>
    <div class="qp-white"><div id="picker"></div></div>
    <div class="selbar hide" id="selBar"><span id="selInfo"></span><button type="button" class="linkbtn" id="selClear">選びなおす</button></div>
    <div style="text-align:center"><button class="btn" id="btnCreate">ルームを作る</button></div>
    <div id="setupErr" class="err hide"></div>
  </div>
</section>

<!-- ② 待機室 -->
<section class="screen q-bg-lab" id="s-lobby" style="gap:1em">
  <div class="tc-head">
    <div class="grow"><div class="q-sub" id="lbSub"></div><div class="q-title" id="lbTitle"></div></div>
    <div class="panel row" style="padding:.5em 1em"><span class="q-sub">参加コード</span><span class="tc-pin" id="pin"></span></div>
    <div class="panel" id="qrcard" style="padding:.4em"><div class="qr" id="qr" style="width:6em"></div></div>
  </div>
  <div class="panel"><span class="q-sub">① このアドレスを開く：</span> <b id="joinUrl"></b>　<span class="q-sub">② 参加コードと出席番号を入れる</span></div>
  <div class="row"><b class="grow">👥 <span id="pcount">0</span>人が参加中（<span id="lbHint">そろったら「班を決める」。そのあと生徒が持ち物を選んで準備OKにします</span>）</b>
    <button class="btn quit" id="btnQuitLobby" type="button">やめる</button><button class="snd"></button>
    <button class="btn tc-big" id="btnStart" disabled>班を決める</button></div>
  <div class="tc-grid" id="players" style="grid-template-columns:repeat(auto-fill,minmax(9em,1fr))"></div>
</section>

<!-- ③ 戦闘中 -->
<section class="screen q-bg-lab" id="s-battle" style="gap:.8em">
  <div class="tc-head">
    <div class="grow"><div class="q-sub" id="btSub"></div><div class="q-title" id="btTitle"></div></div>
    <div class="panel" style="text-align:center;padding:.4em 1.2em"><div class="q-sub" style="font-size:.8em">のこり時間</div><div class="big-timer" id="clock">0:00</div></div>
    <div class="panel" style="padding:.5em 1em;font-weight:900;line-height:1.7"><div>たおした数 <span id="sumKill">0</span></div><div>クラスの正答率 <span id="sumRate">-</span></div></div>
  </div>
  <div class="boss-head panel hide" id="bossPanel">
    <img src="img/quest/boss-alchemira.webp" alt="" style="height:5em;transform:scaleX(-1)" id="bossImg">
    <div class="grow"><div class="row"><b style="font-size:1.6em" id="bossName"></b><div class="grow"></div><span class="q-sub" id="bossNote"></span></div>
      <div class="bar boss"><i id="bhp"></i><b id="bhpT"></b></div></div>
    <div class="log" id="log" style="width:24em;max-height:9em"></div>
  </div>
  <div class="tc-grid" id="teams" style="flex:1;align-content:start"></div>
  <div class="tc-foot"><button class="snd"></button><button class="btn ghost" id="btnEnd">終了して結果へ</button></div>
</section>

<!-- ④ 結果 -->
<section class="screen center q-bg-town" id="s-end" style="gap:1em">
  <div class="confetti" id="conf"></div>
  <div class="lvup" id="endTitle" style="font-size:2.6em"></div>
  <div class="story panel hide" id="endStory"></div>
  <div class="reward" id="endCards"></div>
  <div class="q-sub" id="endNote"></div>
  <button class="btn sub" id="btnClose">ルームを閉じる</button>
</section>

</div>

<script src="firebase-config.js?v=20261112060951"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module">
import { signIn, db, ref, set, get, update, remove, onValue, serverNow, shuffle, mountSetPicker,
         decryptSet, prepareQuestion, maskOf, $, el, showScreen, confetti, qrSvg, sleep } from './lib.js?v=20261112060951';
import { onChildAdded, onChildChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { fiscalYear, JOBS, MP_MAX, heroImg, lvMult, CHEER, addExp, ENEMIES, BOSS, areaOf, enemyFor,
         zakoHp, enemyHit, bossHp, REWARD, TOWN, TOWN_DEFAULT, storyClear, statsOf, canUse, skMult, ITEMS } from './quest.js?v=20261112060951';
import { bgm, sfx, preload, wireSoundButtons } from './sound.js?v=20261112060951b';

wireSoundButtons();

var uid = null, pin = null, YEAR = fiscalYear(), SETS = [], picked = {}, picker = null;
var S = null, players = {}, G = {}, T = [], POOL = [], AREA = null, CLS = null, AR = null, ended = false, tickId = null, endsAt = 0;
var boss = null, logs = [];

function opt(sel, v, t) { var o = el('option', '', t); o.value = v; sel.appendChild(o); }
for (var c = 1; c <= 9; c++) opt($('selC'), c, c + '組');
function segVal(id) { return document.querySelector('#' + id + ' button.on').dataset.v; }
document.querySelectorAll('.seg').forEach(function (s) { s.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; s.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); }); });
function clsKey() { return $('selG').value + '-' + $('selC').value; }
function qpath(p) { return 'quest/' + YEAR + '/' + p; }
function setupErr(m) { $('setupErr').textContent = m; $('setupErr').classList.remove('hide'); }

/* ------------------------------------------------------------ 準備 */
(async function init() {
  showScreen('s-setup');
  try {
    uid = (await signIn()).uid;
    if ((await get(ref(db, 'admins/' + uid))).val() !== true)
      throw new Error('この端末は先生の端末として登録されていません。先に記録画面（records.html）で登録してください。');
    var all = await (await fetch('questions/index.json', { cache: 'no-cache' })).json();
    SETS = all.filter(function (s) { return !(s.types && s.types.text); });
    try { $('pw').value = localStorage.getItem('qraft.pw') || ''; } catch (e) {}
    try { var last = JSON.parse(localStorage.getItem('qraft.quest.last') || '{}'); if (last.g) $('selG').value = last.g; if (last.c) $('selC').value = last.c; (last.sets || []).forEach(function (f) { if (SETS.some(function (s) { return s.file === f; })) picked[f] = true; }); } catch (e) {}
    picker = mountSetPicker($('picker'), { sets: SETS, key: function (s) { return s.file; }, picked: picked, onChange: updateSel }); updateSel();
    $('selClear').onclick = function () { Object.keys(picked).forEach(function (k) { delete picked[k]; }); picker.render(); updateSel(); };
    $('selG').onchange = $('selC').onchange = showTown; showTown();
  } catch (e) { setupErr(e.message); $('btnCreate').disabled = true; }
})();
function updateSel() {
  var ids = Object.keys(picked), n = 0;
  ids.forEach(function (f) { var s = SETS.filter(function (x) { return x.file === f; })[0]; if (s) n += s.count; });
  $('selBar').classList.toggle('hide', !ids.length);
  var first = SETS.filter(function (x) { return x.file === ids[0]; })[0];
  $('selInfo').textContent = '選んだセット：' + ids.length + ' つ・合計 ' + n + ' 問' + (first ? '　エリア：' + areaOf(first).name : '');
}
async function showTown() {
  var v = (await get(ref(db, qpath('classes/' + clsKey())))).val() || {};
  var st = v.stage || 0;
  $('townInfo').textContent = '町：' + (v.town || TOWN_DEFAULT) + '（' + TOWN[st].n + '）';
}

$('btnCreate').onclick = async function () {
  $('setupErr').classList.add('hide'); $('btnCreate').disabled = true;
  try {
    var files = Object.keys(picked).filter(function (f) { return SETS.some(function (s) { return s.file === f; }); });
    if (!files.length) throw new Error('問題セットを1つ以上えらんでください');
    var pwv = $('pw').value;
    POOL = [];
    for (var i = 0; i < files.length; i++) {
      var data = await (await fetch('questions/' + files[i])).json();
      if (data.enc) { if (!pwv) throw new Error('パスワードを入れてください'); data = await decryptSet(data, pwv); }
      data.questions.forEach(function (q) { if (q.type !== 'text') POOL.push(q); });
    }
    if (!POOL.length) throw new Error('選択式の問題がありません');
    try { if (pwv) localStorage.setItem('qraft.pw', pwv); localStorage.setItem('qraft.quest.last', JSON.stringify({ g: $('selG').value, c: $('selC').value, sets: files })); } catch (e) {}
    AREA = areaOf(SETS.filter(function (s) { return s.file === files[0]; })[0]);
    CLS = (await get(ref(db, qpath('classes/' + clsKey())))).val() || {};
    AR = (CLS.areas && CLS.areas[AREA.id]) || {};
    var battle = segVal('segBattle');
    if (battle === 'boss' && AR.done) throw new Error('このクラスは、' + AREA.name + 'のボスをもう倒しています。雑魚戦にするか、別の単元を選んでください。');
    for (var k = 0; k < 20; k++) { pin = String(Math.floor(100000 + Math.random() * 900000)); if (!(await get(ref(db, 'rooms/' + pin + '/hostUid'))).exists()) break; }
    await set(ref(db, 'rooms/' + pin + '/hostUid'), uid);
    S = { mode: 'quest', phase: 'lobby', bg: 'lab', y: YEAR, g: Number($('selG').value), c: Number($('selC').value), battle: battle, Tl: Number(segVal('segTime')),
          area: { id: AREA.id, name: AREA.name }, town: CLS.town || TOWN_DEFAULT };
    await set(ref(db, 'rooms/' + pin + '/state'), S);
    onValue(ref(db, 'rooms/' + pin + '/players'), function (s) { players = s.val() || {}; renderLobby(); lateJoin(); });
    var base = location.href.replace(/quest-host\.html.*$/, '');
    $('joinUrl').textContent = base.replace(/^https?:\/\//, '') + 'quest-play.html';
    $('pin').textContent = pin.slice(0, 3) + ' ' + pin.slice(3);
    $('lbSub').textContent = S.g + '年' + S.c + '組 ・ ' + (battle === 'boss' ? 'ボス戦' : '雑魚戦') + ' ・ ' + (S.Tl / 60) + '分';
    $('lbTitle').textContent = AREA.name + 'へ';
    var svg = qrSvg(base + 'quest-play.html?pin=' + pin); if (svg) $('qr').innerHTML = svg; else $('qrcard').classList.add('hide');
    showScreen('s-lobby'); preload(['lobby', 'quiz', 'podium']); bgm('lobby');
  } catch (e) { setupErr('ルームを作れませんでした: ' + e.message); $('btnCreate').disabled = false; }
};

/* ------------------------------------------------------------ 待機室 */
function renderLobby() {
  var ids = Object.keys(players);
  $('pcount').textContent = ids.length;
  $('btnStart').disabled = !ids.length || busy || (S.phase !== 'lobby' && S.phase !== 'prep');
  if (S.phase === 'prep') return renderPrep();
  if (S.phase !== 'lobby') return;
  var box = $('players'); box.textContent = '';
  ids.forEach(function (id) {
    var p = players[id], c = el('div', 'tc-g');
    var r = el('div', 'row'); var im = el('img', 'hero sm'); im.src = heroImg(p.j, p.lk); r.appendChild(im);
    var t = el('div', 'grow'); t.appendChild(el('b', '', p.nick)); t.appendChild(el('small', '', (JOBS[p.j] ? JOBS[p.j].name : '') + ' Lv.' + (p.lv || 1) + '・' + Number(p.sid.split('-')[2]) + '番'));
    r.appendChild(t); c.appendChild(r);
    var x = el('button', 'chip-x', '退出'); x.onclick = function () { var u = {}; u['kicked/' + id] = true; u['players/' + id] = null; update(ref(db, 'rooms/' + pin), u); };
    c.appendChild(x); box.appendChild(c);
  });
}

/* ------------------------------------------------------------ 班とキャラの状態（先生の画面だけが持つ） */
var CH = {}, busy = false;
/* キャラ（スキル・装備・持ち物）を読む。先生の端末は admins なので読める */
/* 生徒が名乗った番号が、本当にその端末のものか（合言葉で持ち主になっているか）。ちがえば報酬を書かない */
var OWN = {};
async function owns(u, sid) { var k = sid + '/' + u; if (OWN[k] == null) { try { OWN[k] = (await get(ref(db, qpath('owners/' + k)))).exists(); } catch (e) { OWN[k] = false; } } return OWN[k]; }
async function loadChar(u) {
  if (!CH[u]) CH[u] = ((await owns(u, players[u].sid)) && (await get(ref(db, qpath('chars/' + players[u].sid)))).val()) || { j: players[u].j, lv: players[u].lv || 1 };
  return CH[u];
}
function addPlayer(u, team) {
  var p = players[u], ch = CH[u] || { j: p.j, lv: p.lv || 1 }, job = JOBS[ch.j] ? ch.j : 'warrior', st = statsOf(ch, true);
  G[u] = { team: team, job: job, ch: ch, atk: st.atk, def: st.def, lv: ch.lv || 1, sid: p.sid, nick: p.nick, lk: p.lk, hp: st.mhp, mhp: st.mhp, mp: 0, streak: 0, ko: false, buff: false,
           item: '', used: '', n: 0, cur: null, wait: '', queue: [], dmg: 0, contrib: 0, kills: 0, killExp: 0, gold: 0, ok: 0, ans: 0 };
  T[team].mem.push(u);
}
/* 準備のあとから来た子：人数の少ない班に入れる */
async function lateJoin() {
  if (S.phase !== 'prep' && S.phase !== 'battle') return;
  for (var u of Object.keys(players)) {
    if (G[u] || G[u] === null) continue;
    G[u] = null; await loadChar(u); addPlayer(u, smallestTeam());
    var tm = {}; tm[u] = G[u].team; await update(ref(db, 'rooms/' + pin + '/state/tm'), tm);
    if (S.phase === 'battle') { writeTeam(G[u].team); sendQ(u); }
  }
  if (S.phase === 'prep') renderPrep();
}
/* 準備画面（先生）：班ごとに、準備OKと持ち物を見せる */
function renderPrep() {
  var box = $('players'); box.textContent = ''; box.style.gridTemplateColumns = '';
  var ready = 0;
  T.forEach(function (t, i) {
    var c = el('div', 'tc-g'), all = t.mem.length > 0, jobs = {};
    c.appendChild(el('div', 't', (i + 1) + '班'));
    var mm = el('div', 'mem-mini');
    t.mem.forEach(function (u) { var p = players[u], g = G[u]; if (!p || !g) return; jobs[g.job] = 1; if (!p.rd) all = false;
      var sp = el('span', p.rd ? '' : 'ko'); var im = el('img'); im.src = heroImg(g.job, p.lk); sp.appendChild(im); sp.appendChild(document.createTextNode(p.nick + (p.it && ITEMS[p.it] ? ' ' + ITEMS[p.it].ic : ''))); mm.appendChild(sp); });
    c.appendChild(mm);
    c.appendChild(el('small', '', all ? '✅ 準備OK' : '準備中（うすい子がまだ）'));
    if (!jobs.priest) c.appendChild(el('small', 'warn', '⚠️ 回復役（僧侶）がいない'));
    if (all) { c.classList.add('ready'); ready++; }
    box.appendChild(c);
  });
  $('lbHint').textContent = '準備OKの班 ' + ready + ' / ' + T.length + '（全班そろっていなくても出発できます）';
}
async function doPrep() {
  busy = true; $('btnStart').disabled = true;
  window.addEventListener('beforeunload', function (e) { if (!ended) { e.preventDefault(); e.returnValue = ''; } });
  var ids = Object.keys(players);
  await Promise.all(ids.map(loadChar));
  /* 班：職業がかたよらないように、職業順に並べてから配る（4人前後） */
  ids = shuffle(ids); var order = { warrior: 0, priest: 1, mage: 2 };
  ids.sort(function (a, b) { return (order[players[a].j] || 0) - (order[players[b].j] || 0); });
  var nT = Math.max(1, Math.round(ids.length / 4));
  T = []; for (var i = 0; i < nT; i++) T.push({ mem: [], ei: i, e: null, hitters: {}, kills: 0, ok: 0, ans: 0, log: '', lastTag: '' });
  ids.forEach(function (u, k) { addPlayer(u, k % nT); });
  var tm = {}; Object.keys(G).forEach(function (u) { if (G[u]) tm[u] = G[u].team; });
  S.phase = 'prep'; await update(ref(db, 'rooms/' + pin + '/state'), { phase: 'prep', tm: tm, nT: nT });
  $('btnStart').textContent = '出発！'; busy = false; renderLobby();
}
function smallestTeam() { var b = 0; T.forEach(function (t, i) { if (t.mem.length < T[b].mem.length) b = i; }); return b; }
function newEnemy(t) {
  var i = t.ei++, q = t.lastTag;
  var k = enemyFor(q, i), max = zakoHp(t.mem.length);
  t.e = { k: k, hp: max, max: max }; t.hitters = {};
}

$('btnStart').onclick = async function () {
  if (S.phase === 'lobby') return doPrep();
  $('btnStart').disabled = true; busy = true;
  var ids = Object.keys(G).filter(function (u) { return G[u]; }), nT = T.length;
  /* 持ち物：準備画面で選んだ物を、キャラが本当に持っていれば持たせる */
  ids.forEach(function (u) { var p = players[u] || {}, inv = (G[u].ch.inv || {}); if (p.it && ITEMS[p.it] && ITEMS[p.it].team && inv[p.it] > 0) G[u].item = p.it; });
  if (S.battle === 'boss') {
    var avg = ids.reduce(function (a, u) { return a + G[u].lv; }, 0) / ids.length;
    var max = AR.max || bossHp(ids.length, avg, S.Tl);
    boss = { hp: AR.hp != null ? AR.hp : max, max: max, tries: (AR.tries || 0) + 1 };
    $('bossPanel').classList.remove('hide'); $('bossName').textContent = BOSS.n;
    $('bossNote').textContent = boss.tries + '回目のボス戦' + (boss.tries > 1 ? '（前回までに ' + Math.round((1 - boss.hp / boss.max) * 100) + '% 削った）' : '');
    await set(ref(db, 'rooms/' + pin + '/bv'), { hp: boss.hp, max: boss.max });
  } else T.forEach(newEnemy);
  endsAt = serverNow() + 4000 + S.Tl * 1000;
  var tm = {}; ids.forEach(function (u) { tm[u] = G[u].team; });
  S.phase = 'battle';
  await update(ref(db, 'rooms/' + pin + '/state'), { phase: 'battle', tm: tm, ends: endsAt, nT: nT });
  T.forEach(function (t, i) { writeTeam(i); });
  onChildAdded(ref(db, 'rooms/' + pin + '/answers'), onAnsBucket); onChildChanged(ref(db, 'rooms/' + pin + '/answers'), onAnsBucket);
  onChildAdded(ref(db, 'rooms/' + pin + '/act'), onAct); onChildChanged(ref(db, 'rooms/' + pin + '/act'), onAct);
  $('btSub').textContent = $('lbSub').textContent; $('btTitle').textContent = AREA.name;
  showScreen('s-battle'); sfx('go'); bgm('quiz');
  setTimeout(function () { ids.forEach(sendQ); }, 4000);
  tickId = setInterval(tick, 250); renderTeams();
};

/* ------------------------------------------------------------ 出題と採点 */
function sendQ(u) {
  var g = G[u]; if (!g || ended) return;
  if (!g.queue.length) g.queue = shuffle(POOL.map(function (_, i) { return i; }));
  var qi = g.queue.pop(), q = prepareQuestion(POOL[qi], true); q.qi = qi; q.tag = POOL[qi].tag || '';
  g.n++; g.cur = q; g.wait = 'ans';
  set(ref(db, 'rooms/' + pin + '/qs/' + u), { n: g.n, t: q.text, img: q.image || '', ch: q.choices, mu: q.multi ? 1 : 0, ko: g.ko ? 1 : 0 });
}
function onAnsBucket(snap) {
  var n = Number(snap.key), v = snap.val() || {};
  Object.keys(v).forEach(function (u) { var g = G[u]; if (g && g.n === n && g.wait === 'ans') grade(u, v[u]); });
}
function grade(u, a) {
  var g = G[u], q = g.cur, t = T[g.team], mask = a.c != null ? (1 << a.c) : a.m, cor = maskOf(q.correct), ok = mask === cor;
  g.ans++; t.ans++; g.wait = '';
  if (q.tag) t.lastTag = q.tag;
  var res = { n: g.n, ok: ok ? 1 : 0, cor: cor };
  if (ok) {
    g.ok++; t.ok++; g.streak++; g.mp = Math.min(MP_MAX, g.mp + 1);
    t.hitters[u] = 1;                 /* この敵と戦っている間に正解した子は、撃破ボーナスをもらえる */
    if (g.ko) {                       /* 気絶中の正解：復活して、仲間を応援 */
      g.ko = false; g.hp = Math.ceil(g.mhp / 2); res.rev = 1;
      t.mem.forEach(function (m) { if (m !== u && G[m]) G[m].buff = true; });
      t.log = g.nick + ' が復活！ 仲間に応援（次の攻撃 ×' + CHEER + '）';
      setTimeout(function () { sendQ(u); }, 1500);
    } else { g.wait = 'act'; res.act = 1; g.actTimer = setTimeout(function () { if (g.wait === 'act') applyAct(u, 0); }, 10000); }
  } else {
    g.streak = 0;
    var d = Math.max(3, enemyHit(g.job, !!boss) - (g.def - JOBS[g.job].def)); g.hp = Math.max(0, g.hp - d); res.dmg = d;
    if (!g.hp && !g.ko) { g.ko = true; t.log = g.nick + ' は気絶した…（次の正解で復活）'; }
    var pos = Math.min(g.queue.length, 3 + Math.floor(Math.random() * 4)); g.queue.splice(g.queue.length - pos, 0, q.qi);   /* まちがえた問題は、数問あとにもう一度 */
    setTimeout(function () { sendQ(u); }, 2600);
  }
  writeTeam(g.team); renderTeams();
  set(ref(db, 'rooms/' + pin + '/qs/' + u + '/r'), res);   /* 班の状態（MP）を先に書いてから結果を出す */
}
function onAct(snap) {
  var u = snap.key, v = snap.val() || {}, g = G[u];
  if (g && v.a === 9) return useItem(u);
  if (g && g.wait === 'act' && v.n === g.n) applyAct(u, v.a);
}
/* 持ち物を使う（1回だけ）。回復のしずく：HP+20（気絶中なら復活）、マナの実：MP+3 */
function useItem(u) {
  var g = G[u], t = T[g.team]; if (!g.item || g.used) return;
  g.used = g.item;
  if (g.item === 'potion') { if (g.ko) g.ko = false; g.hp = Math.min(g.mhp, g.hp + 20); }
  if (g.item === 'ether') g.mp = Math.min(MP_MAX, g.mp + 3);
  t.log = g.nick + ' は' + ITEMS[g.item].n + 'を使った！';
  writeTeam(g.team); renderTeams();
}
function applyAct(u, ai) {
  var g = G[u], t = T[g.team], acts = JOBS[g.job].acts, act = acts[ai] || acts[0];
  clearTimeout(g.actTimer); g.wait = '';
  if (!canUse(g.ch, ai) || g.mp < act.mp || (act.streak && g.streak < act.streak)) { act = acts[0]; ai = 0; }
  g.mp -= act.mp;
  var sm = skMult(g.ch, ai);
  var dmg = Math.round(g.atk * act.a * sm * lvMult(g.lv) * (g.buff ? CHEER : 1) * (0.9 + Math.random() * 0.2));
  g.buff = false;
  var msg = g.nick + ' の' + act.n + '！';
  var healed = 0, rev = 0;   /* 回復は、実際に減っていた分だけ数える */
  if (act.heal) t.mem.forEach(function (m) { var x = G[m]; if (!x) return; if (act.revive && x.ko) { x.ko = false; rev++; } if (!x.ko) { var b = x.hp; x.hp = Math.min(x.mhp, x.hp + Math.ceil(x.mhp * act.heal * sm)); healed += x.hp - b; } });
  g.contrib += dmg + REWARD.healRate * healed + REWARD.reviveBonus * rev;
  if (act.heal) msg += act.revive ? ' 班全員が元気になった！' : ' 班のHPが回復！';
  if (dmg > 0) {
    g.dmg += dmg; msg += ' ' + dmg + 'のダメージ';
    if (boss) {
      boss.hp = Math.max(0, boss.hp - dmg);
      addLog(g.nick + ' の<em>' + act.n + '</em>！ ' + dmg);
      update(ref(db, 'rooms/' + pin + '/bv'), { hp: boss.hp });
      if (!boss.hp && !boss.down) bossDown();
    } else {
      t.hitters[u] = 1; t.e.hp = Math.max(0, t.e.hp - dmg);
      if (!t.e.hp) {
        msg += '　' + ENEMIES[t.e.k].n + ' をたおした！'; t.kills++;
        Object.keys(t.hitters).forEach(function (m) { var x = G[m]; if (!x) return; x.kills++; x.killExp += Math.round(t.e.max * REWARD.killExpRate); x.gold += REWARD.killGold; });
        newEnemy(t); sfx('levelup');
      }
    }
  }
  t.log = msg;
  writeTeam(g.team); renderTeams();
  setTimeout(function () { sendQ(u); }, 900);
}
function writeTeam(i) {
  var t = T[i], m = {};
  t.mem.forEach(function (u) { var g = G[u]; if (g) m[u] = { nm: g.nick, j: g.job, lk: g.lk || 'a', it: g.item && !g.used ? g.item : '', hp: g.hp, mhp: g.mhp, mp: g.mp, ko: g.ko ? 1 : 0, bf: g.buff ? 1 : 0, st: g.streak }; });
  var e = boss ? null : { k: t.e.k, hp: t.e.hp, max: t.e.max };
  set(ref(db, 'rooms/' + pin + '/tv/' + i), { m: m, e: e, log: t.log, kills: t.kills, at: serverNow() }).catch(function () {});
}
function addLog(html) {
  logs.unshift(html); logs = logs.slice(0, 6);
  $('log').innerHTML = logs.map(function (h) { return '<div>' + h + '</div>'; }).join('');
}

/* ------------------------------------------------------------ 先生の大画面（個人の正答率や順位は出さない） */
function renderTeams() {
  var box = $('teams'); box.textContent = '';
  var K = 0, ok = 0, ans = 0;
  T.forEach(function (t, i) {
    K += t.kills; ok += t.ok; ans += t.ans;
    var c = el('div', 'tc-g');
    var h = el('div', 't'); h.appendChild(el('span', '', (i + 1) + '班')); h.appendChild(el('span', '', 'たおした ' + t.kills)); c.appendChild(h);
    var mm = el('div', 'mem-mini');
    t.mem.forEach(function (u) { var g = G[u]; if (!g) return; var s = el('span', g.ko ? 'ko' : ''); var im = el('img'); im.src = heroImg(g.job, g.lk); s.appendChild(im); s.appendChild(document.createTextNode(g.nick)); mm.appendChild(s); });
    c.appendChild(mm);
    if (t.e) {
      var en = el('div', 'en'); var ei = el('img'); ei.src = ENEMIES[t.e.k].img; en.appendChild(ei);
      var bw = el('div', 'grow'); bw.appendChild(el('small', '', ENEMIES[t.e.k].n));
      var bar = el('div', 'bar hp'); var bi = el('i'); bi.style.width = (t.e.hp / t.e.max * 100) + '%'; bar.appendChild(bi); bw.appendChild(bar); en.appendChild(bw); c.appendChild(en);
    }
    c.appendChild(el('small', '', '正答率 ' + (t.ans ? Math.round(t.ok / t.ans * 100) + '%' : '-')));
    if (t.log) c.appendChild(el('small', 'warn', t.log));
    box.appendChild(c);
  });
  $('sumKill').textContent = K; $('sumRate').textContent = ans ? Math.round(ok / ans * 100) + '%' : '-';
  if (boss) { $('bhp').style.width = (boss.hp / boss.max * 100) + '%'; $('bhpT').textContent = boss.hp + ' / ' + boss.max; }
}
function tick() {
  if (ended) return;
  var left = Math.max(0, (endsAt - serverNow()) / 1000), sec = Math.min(S.Tl, left);
  $('clock').textContent = left > S.Tl ? '準備…' : Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
  if (left <= 0) finish();
}
function bossDown() { boss.down = true; sfx('fanfare'); addLog('<em>' + BOSS.n + ' をたおした！</em>'); setTimeout(finish, 2500); }

/* ------------------------------------------------------------ 終了：報酬をキャラに書き、クラスの町とエリアを進める */
async function finish() {
  if (ended) return; ended = true; clearInterval(tickId);
  Object.keys(G).forEach(function (u) { if (G[u]) clearTimeout(G[u].actTimer); });
  await update(ref(db, 'rooms/' + pin + '/state'), { phase: 'saving' });
  var down = !!(boss && boss.down), clsPath = qpath('classes/' + S.g + '-' + S.c), up = {}, res = {};
  var who = Object.assign({}, AR.who || {});
  var ok = {}; for (var u0 of Object.keys(G)) ok[u0] = !!G[u0] && await owns(u0, G[u0].sid);
  if (boss) Object.keys(G).forEach(function (u) { if (ok[u]) who[G[u].sid] = true; });
  for (var u of Object.keys(G)) {
    var g = G[u]; if (!g || !ok[u]) continue;
    var cp = qpath('chars/' + g.sid), ch = (await get(ref(db, cp))).val();
    if (!ch) continue;
    if (g.used && ch.inv && ch.inv[g.used] > 0) { ch.inv[g.used]--; }
    var br = { ok: REWARD.expPerOk * g.ok, act: Math.round(REWARD.contribRate * g.contrib), kill: g.killExp, boss: down ? REWARD.bossExp : 0 };
    var exp = br.ok + br.act + br.kill, gold = g.gold;
    if (down) { exp += REWARD.bossExp; gold += REWARD.bossGold; }
    var lv0 = ch.lv; ch.gold = (ch.gold || 0) + gold; var ups = addExp(ch, exp);
    if (down) { ch.ttl = ch.ttl || {}; ch.ttl[AREA.id] = BOSS.title; }
    ch.u = { '.sv': 'timestamp' };
    up[cp] = ch;
    res[u] = { exp: exp, gold: gold, lv: ch.lv, lv0: lv0, up: ups, ok: g.ok, ans: g.ans, kills: g.kills, ttl: down ? BOSS.title : '', br: br };
  }
  /* 前の回に参加して、今回いなかった子にも、ボス撃破の報酬を入れる */
  if (down) {
    var here = {}; Object.keys(G).forEach(function (u) { if (G[u]) here[G[u].sid] = 1; });
    for (var sid of Object.keys(who)) {
      if (here[sid]) continue;
      var p2 = qpath('chars/' + sid), c2 = (await get(ref(db, p2))).val(); if (!c2) continue;
      c2.gold = (c2.gold || 0) + REWARD.bossGold; addExp(c2, REWARD.bossExp); c2.ttl = c2.ttl || {}; c2.ttl[AREA.id] = BOSS.title; c2.u = { '.sv': 'timestamp' }; up[p2] = c2;
    }
  }
  if (boss) up[clsPath + '/areas/' + AREA.id] = { hp: boss.hp, max: boss.max, tries: boss.tries, done: down, who: who };
  var stage = CLS.stage || 0;
  if (down) { stage = Math.min(TOWN.length - 1, stage + 1); up[clsPath + '/stage'] = stage; }
  if (!CLS.town) up[clsPath + '/town'] = S.town;
  var saveErr = '';
  try { await update(ref(db), up); } catch (e) { saveErr = '記録を保存できませんでした（' + e.message + '）'; }
  await set(ref(db, 'rooms/' + pin + '/res'), res);
  await update(ref(db, 'rooms/' + pin + '/state'), { phase: 'end', down: down, story: down ? storyClear(AREA, S.town, stage) : '' });
  showEnd(down, stage, res, saveErr);
}
function showEnd(down, stage, res, saveErr) {
  var K = T.reduce(function (a, t) { return a + t.kills; }, 0), ok = 0, ans = 0, lvups = 0;
  Object.keys(res).forEach(function (u) { ok += res[u].ok; ans += res[u].ans; if (res[u].up) lvups++; });
  $('endTitle').textContent = down ? BOSS.n + ' を たおした！' : boss ? 'ボスの残りHP ' + Math.round(boss.hp / boss.max * 100) + '%　次の授業に持ち越し！' : '冒険おわり！';
  if (down) { $('endStory').textContent = storyClear(AREA, S.town, stage); $('endStory').classList.remove('hide'); confetti($('conf'), 46); }
  var box = $('endCards'); box.textContent = '';
  [['たおした数', boss ? (down ? 'ボス' : '-') : K], ['クラスの正答率', ans ? Math.round(ok / ans * 100) + '%' : '-'], ['レベルアップ', lvups + '人']].forEach(function (x) {
    var c = el('div', 'card'); c.appendChild(el('span', 'mut', x[0])); c.appendChild(el('b', '', String(x[1]))); box.appendChild(c);
  });
  $('endNote').textContent = saveErr || '経験値とゴールドを、全員のキャラに記録しました。';
  showScreen('s-end'); bgm('podium');
}
$('btnEnd').onclick = function () { if (confirm('ここで終了して、結果を記録しますか？')) finish(); };
$('btnQuitLobby').onclick = function () { if (confirm('ルームを閉じて、準備画面にもどりますか？')) $('btnClose').onclick(); };
$('btnClose').onclick = async function () { ended = true; bgm(null); await remove(ref(db, 'rooms/' + pin)); location.reload(); };
</script>
