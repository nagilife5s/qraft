<!DOCTYPE html>
<html lang="ja" data-bg="space">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qraft ジェットチェイス</title>
<link rel="icon" type="image/png" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="theme.css?v=20261022204718">
<style>
  .brow { display:flex; gap:.4em; align-items:center; background:rgba(255,255,255,.92); color:var(--ink-dark); border-radius:.6em; padding:.15em .6em; font-weight:800; font-size:.95em; }
  .brow.me { outline:.15em solid #ffd23f; }
  .pad { display:grid; grid-template-columns:repeat(3,2.8em); grid-template-rows:repeat(2,2.8em); gap:.25em; }
  .pad button, .bombbtn { font:inherit; font-size:1.2em; font-weight:900; border:0; border-radius:.6em; background:#fff; color:var(--ink-dark); box-shadow:var(--shadow); touch-action:none; }
  .bombbtn { width:3.8em; height:3.8em; border-radius:50%; background:#ff5a5a; color:#fff; }
  .fb { text-align:center; font-weight:900; font-size:1.3em; min-height:1.6em; }
  .fb.ok { color:#8bf0b0; } .fb.ng { color:#ffd23f; }
</style>
</head>
<body>
<div id="app">
<div class="cflash" id="flash"></div>

<!-- 参加 -->
<section class="screen" id="s-join">
  <div class="center" style="flex:1; display:flex; flex-direction:column; gap:1.2em">
    <img class="logo-img" src="img/logo-wordmark.webp" alt="Qraft" style="height:7.6em">
    <div class="joincol">
      <div class="flabel">PIN（先生の画面の6けた）</div>
      <input class="field" id="pin" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="123456">
      <div class="flabel">ニックネーム</div>
      <input class="field" id="nick" autocomplete="off" maxlength="20" placeholder="なまえ">
      <div class="flabel">キャラ</div>
      <div id="avBox"></div>
      <button class="btn" id="btnJoin" style="margin-top:.4em">参加する</button>
      <div id="joinErr" class="err hide"></div>
    </div>
  </div>
</section>

<!-- 待機 -->
<section class="screen" id="s-wait">
  <div class="center" style="flex:1; display:flex; flex-direction:column; gap:.7em">
    <div style="font-size:4em">🤖</div>
    <div style="font-weight:900; font-size:2.4em">参加できました！</div>
    <div class="pill" id="meNick" style="font-size:1.6em"></div>
    <div class="mut" style="font-size:1.3em; margin-top:.4em">先生がスタートするのを待っています</div>
    <div class="dots" style="margin-top:.6em"><span></span><span></span><span></span></div>
  </div>
</section>

<!-- ゲーム中 -->
<section class="screen" id="s-q" style="gap:.5em">
  <div class="rhud">
    <span class="pill" id="hLevel"></span>
    <div class="rbar"><span class="ri">🤖</span><i id="hFill"></i><span class="fl">🏁</span></div>
    <span class="pill" id="hTime" style="background:#fff;color:var(--ink-dark)"></span>
    <span class="lives" id="hLives"></span>
  </div>
  <div id="sceneBox"></div>
  <div class="banner hide" id="banner"></div>
  <div id="quizBox" style="display:flex; flex-direction:column; gap:.5em; flex:1; min-height:0">
    <div class="stu-q" id="sq"><img id="sqimg" class="qimg hide" alt=""><span id="sqtext"></span></div>
    <div class="stu-tiles" id="stiles"></div>
    <div id="textbox" class="hide">
      <input type="text" id="textAns" maxlength="40" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="ここに答えを入力">
      <div class="tnote" id="tnote"></div>
    </div>
    <div class="q-foot">
      <button class="btn hide" id="btnSubmit">答える</button>
      <div class="fb" id="fb"></div>
    </div>
  </div>
  <div id="bombBoxS" class="hide" style="display:flex; flex-direction:column; gap:.5em; flex:1; min-height:0; align-items:center; position:relative">
    <div class="banner hide" id="bIntro" style="position:absolute; z-index:5; top:18%; left:6%; right:6%;">💣 ボンバーマン！<br><small style="font-size:.6em">小さいロボット🤖を、爆弾でたおせ！ 矢印キー／WASDで動く・スペースで爆弾。爆発に巻き込まれると減点（5秒で復活）</small></div>
    <div class="bframe"><canvas id="bcv"></canvas></div>
    <div style="display:flex; gap:.8em; align-items:center; justify-content:center; flex-wrap:wrap; width:100%">
      <div id="brank" style="display:flex; flex-wrap:wrap; gap:.3em; justify-content:center"></div>
      <div id="bpad" class="hide" style="display:flex; gap:.4em; align-items:center">
        <div class="pad"><span></span><button data-d="1">▲</button><span></span><button data-d="3">◀</button><button data-d="2">▼</button><button data-d="4">▶</button></div>
        <button class="bombbtn" id="bbtn">💣</button>
      </div>
    </div>
  </div>
</section>

<!-- 終了 -->
<section class="screen" id="s-end">
  <div class="confetti" id="conf-end"></div>
  <div class="center" style="flex:1; display:flex; flex-direction:column; gap:.6em">
    <div style="font-size:4em" id="endEm"></div>
    <div class="title2" style="font-size:2.2em" id="endTitle"></div>
    <div class="card" style="min-width:16em">
      <div class="mut" style="color:#5b5478; font-weight:800">あなたの正解</div>
      <div style="font-size:3.6em; font-weight:900; color:var(--bg2); line-height:1.1"><span id="endk">0</span><small style="font-size:.4em"> 問（<span id="enda">0</span>問中）</small></div>
      <div class="mut" style="color:#5b5478; font-weight:800; margin-top:.3em">クラス全体 <span id="endAll">0</span> 問</div>
    </div>
  </div>
</section>

<section class="screen" id="s-kicked"><div class="center" style="flex:1; display:flex; flex-direction:column; gap:.7em"><div style="font-weight:900; font-size:2.2em">この部屋から退出になりました</div></div></section>
<section class="screen" id="s-closed"><div class="center" style="flex:1; display:flex; flex-direction:column; gap:.7em"><div style="font-weight:900; font-size:2.4em">ゲームは終了しました</div><div class="mut">ありがとうございました！</div></div></section>

</div>

<script src="firebase-config.js?v=20261022204718"></script>
<script type="module">
import { newView, applyData, draw as bdraw, RULE as BRULE, W as BW, H as BH } from './bomb.js?v=20261022204718';
import { parseAv, mountAvatarPicker, avatarEl, signIn, db, ref, set, get, onValue, serverNow, CHOICE_STYLE, shuffle,
         ROBOT, robotFrac, mountScene, prepareQuestion, maskOf, isTextCorrect,
         $, el, showScreen, confetti, loadBackgrounds, applyBg, mountStage } from './lib.js?v=20261022204718';

mountStage();

var uid = null, pin = null, nick = '', avPick = null;
var state = null, runs = {}, players = {}, kicked = false, closed = false, BGS = [], bgReady = false;
var started = false, finished = false, timerId = null, scene = null;
var k = 0, a = 0, pool = [], queue = [], run = null, locked = false, selMask = 0;
var lastLevel = 0, lastFail = 0, lastPhase = '', bannerUntil = 0;
var bgrp = {}, myG = -1, myI = -1, bView = newView(), bUnsub = null, bRaf = null, held = [], curD = 0, bcount = 0, sentKey = '', bActive = false;

/* ------------------------------------------------------------ 参加（クラシックと同じ入り口） */
(async function boot() {
  BGS = await loadBackgrounds(); bgReady = true; applyBg('space', BGS, true);
  showScreen('s-join');
  try { uid = (await signIn()).uid; } catch (e) { joinErr(e.message); $('btnJoin').disabled = true; return; }
  avPick = mountAvatarPicker($('avBox'), uid);
  var saved = null; try { saved = JSON.parse(localStorage.getItem('qraft.player') || 'null'); } catch (e) {}
  var qp = new URLSearchParams(location.search).get('pin');
  if (saved) { $('pin').value = saved.pin; $('nick').value = saved.nick; }
  if (qp && /^\d{6}$/.test(qp)) { $('pin').value = qp; if (saved && saved.pin !== qp) $('nick').value = saved.nick || ''; }
  if (saved && saved.pin && saved.nick && (!qp || qp === saved.pin)) join(saved.pin, saved.nick, true);
  else if (qp) $('nick').focus();
})();
function joinErr(m) { $('joinErr').textContent = m; $('joinErr').classList.remove('hide'); }
$('btnJoin').onclick = function () { join($('pin').value.trim(), $('nick').value.trim(), false); };
$('nick').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnJoin').click(); });

async function join(p, n, silent) {
  $('joinErr').classList.add('hide');
  if (!/^\d{6}$/.test(p)) { if (!silent) joinErr('PINは6けたの数字です'); return; }
  if (!n) { if (!silent) joinErr('ニックネームを入れてください'); return; }
  $('btnJoin').disabled = true;
  try {
    if (!(await get(ref(db, 'rooms/' + p + '/hostUid'))).exists()) {
      try { localStorage.removeItem('qraft.player'); } catch (e) {}
      throw new Error(silent ? '' : 'その PIN の部屋が見つかりません。');
    }
    if ((await get(ref(db, 'rooms/' + p + '/kicked/' + uid))).exists()) kicked = true;
    else await set(ref(db, 'rooms/' + p + '/players/' + uid), { nick: n, av: avPick.get() });
    pin = p; nick = n;
    try { localStorage.setItem('qraft.player', JSON.stringify({ pin: p, nick: n })); } catch (e) {}
    start();
  } catch (e) { if (e.message) joinErr(e.message); $('btnJoin').disabled = false; }
}

function start() {
  $('waitEm').textContent = ''; $('waitEm').className = 'resav'; $('waitEm').id = 'waitAv'; $('waitAv').appendChild(avatarEl(avPick.get(), uid));
  $('meNick').textContent = ''; $('meNick').appendChild(avatarEl(avPick.get(), uid)); $('meNick').appendChild(document.createTextNode(' ' + nick));
  onValue(ref(db, 'rooms/' + pin + '/state'), function (s) {
    state = s.val();
    if (!state) { closed = true; try { localStorage.removeItem('qraft.player'); } catch (e) {} }
    else if (bgReady) applyBg(state.bg || 'space', BGS);
    render();
  });
  onValue(ref(db, 'rooms/' + pin + '/run'), function (s) { runs = s.val() || {}; });
  onValue(ref(db, 'rooms/' + pin + '/players'), function (s) { players = s.val() || {}; });
  onValue(ref(db, 'rooms/' + pin + '/bgrp'), function (s) { bgrp = s.val() || {}; });
  onValue(ref(db, 'rooms/' + pin + '/kicked/' + uid), function (s) { if (s.val()) { kicked = true; render(); } });
  render();
}

function render() {
  if (kicked) { showScreen('s-kicked'); return; }
  if (closed) { if (!finished) showScreen('s-closed'); return; }
  if (!state) return;
  if (state.mode !== 'chase') { location.replace('play.html?pin=' + pin + (/[?&]sess=1/.test(location.search) ? '&sess=1' : '')); return; }
  if (state.phase === 'lobby') { if (!started) showScreen('s-wait'); }
  else if (state.phase === 'end') { if (!finished) endGame(); }
  else if (!started && !finished) beginRun();
}

/* ------------------------------------------------------------ ゲーム */
async function beginRun() {
  started = true;
  try {
    pool = [];
    for (var i = 0; i < (state.sets || []).length; i++) pool = pool.concat((await (await fetch('home/' + state.sets[i] + '.json')).json()).questions);
  } catch (e) { alert('問題を読めませんでした。ページを更新してください。'); started = false; return; }
  scene = mountScene($('sceneBox'), true); showScreen('s-q');
  nextQuestion();
  timerId = setInterval(tick, 250); tick();
}

function sumK() { return Object.keys(runs).reduce(function (x, id) { return x + (players[id] ? (runs[id].k || 0) : 0); }, 0); }
function banner(msg, bad, sec) { var b = $('banner'); b.textContent = msg; b.classList.toggle('bad', !!bad); b.classList.remove('hide'); bannerUntil = Date.now() + sec * 1000; }

function tick() {
  if (finished || !state || state.phase === 'lobby') return;
  var st = state, now = serverNow(), ids = Object.keys(players);
  scene.setPlayers(ids.map(function (id) { return { uid: id, nick: players[id].nick, av: players[id].av }; }));
  var C = sumK() - (st.base || 0), p = Math.min(1, C / st.target), sec = (now - st.qstart) / 1000;
  $('hLevel').textContent = 'レベル ' + st.level + ' / ' + ROBOT.levels;
  $('hLives').textContent = new Array(st.lives + 1).join('❤️') + new Array(ROBOT.lives - st.lives + 1).join('🖤');
  if (bannerUntil < Date.now()) $('banner').classList.add('hide');
  if (st.level !== lastLevel) { lastLevel = st.level; }
  if ((st.fail || 0) !== lastFail) { lastFail = st.fail || 0; banner('ロボットにつかまった！ ライフ −1　もう一度！', true, 4); }

  if (st.phase === 'quiz') {
    if (lastPhase !== 'quiz') { var back = lastPhase === 'bomb' || lastPhase === 'bombres'; lastPhase = 'quiz'; leaveBomb(); $('quizBox').classList.remove('hide'); if (back) nextQuestion(); if (st.level > 1 || sec < 3) banner('レベル ' + st.level + ' スタート！', false, 3); }
    var left = Math.max(0, st.Tl - sec);
    $('hTime').textContent = Math.floor(left / 60) + ':' + String(Math.floor(left % 60)).padStart(2, '0');
    $('hFill').style.width = p * 100 + '%';
    var ks = {}; ids.forEach(function (id) { ks[id] = (runs[id] && runs[id].k) || 0; });
    scene.draw({ phase: 'quiz', frac: robotFrac(Math.max(0, sec), p), me: uid, ks: ks });
  } else if (st.phase === 'bomb' || st.phase === 'bombres') {
    if (lastPhase !== st.phase) { var first = lastPhase !== 'bomb' && lastPhase !== 'bombres'; lastPhase = st.phase; if (first) enterBomb(); }
    var left2 = (st.bstart - now) / 1000;
    if (st.phase === 'bomb') {
      bActive = left2 <= 0;
      $('bIntro').classList.toggle('hide', !(left2 > -1));      /* 始まる前と、始まって1秒のあいだ、説明を出す */
      $('hTime').textContent = left2 > 0 ? '開始まで ' + Math.ceil(left2) : '0:' + String(Math.ceil(Math.max(0, (BRULE.length - bView.t) / 10))).padStart(2, '0');
    } else {
      bActive = false; setInput(0); $('bIntro').classList.add('hide'); $('hTime').textContent = '';
      var mine = bView.players[myI]; if (bannerUntil < Date.now()) banner(mine ? 'ミニゲーム終了！ あなたは ' + mine.score + ' 点' : 'ミニゲーム終了！', false, 1);
    }
    $('hFill').style.width = '100%';
    if (myG < 0 && bgrp[uid]) joinBoard();
    if (myG < 0 && Object.keys(bgrp).length && !bgrp[uid]) $('hTime').textContent = '次のレベルから参加できます';
  }
}

/* ---- ボンバーマン */
function enterBomb() {
  $('sceneBox').classList.add('hide'); $('quizBox').classList.add('hide'); $('bombBoxS').classList.remove('hide');
  $('bpad').classList.toggle('hide', !('ontouchstart' in window));
  sizeBoard(); myG = -1; myI = -1; bView = newView(); curD = 0; sentKey = '';
  cancelAnimationFrame(bRaf); (function loop() { drawBoard(); bRaf = requestAnimationFrame(loop); })();
}
function leaveBomb() {
  if (bUnsub) { bUnsub(); bUnsub = null; }
  cancelAnimationFrame(bRaf); bActive = false; held = []; setInput(0);
  myG = -1; myI = -1;
  $('bombBoxS').classList.add('hide'); $('sceneBox').classList.remove('hide');
}
function joinBoard() {
  var t = bgrp[uid].split('.'); myG = Number(t[0]); myI = Number(t[1]);
  bUnsub = onValue(ref(db, 'rooms/' + pin + '/bd/' + myG), function (s) { if (s.val()) applyData(bView, s.val()); });
}
function sizeBoard() {
  var px = Math.max(240, Math.min(window.innerWidth - 40, (window.innerHeight - 250) * BW / BH, 660)), cv = $('bcv');
  cv.width = Math.floor(px); cv.height = Math.floor(px / BW * BH); cv.style.width = cv.width + 'px'; cv.style.height = cv.height + 'px';
}
addEventListener('resize', function () { if (!$('bombBoxS').classList.contains('hide')) sizeBoard(); });
function members() {
  return Object.keys(bgrp).filter(function (u) { return bgrp[u].split('.')[0] === String(myG); }).sort(function (a, b) { return Number(bgrp[a].split('.')[1]) - Number(bgrp[b].split('.')[1]); });
}
var lastRank = '';
function drawBoard() {
  if (myG < 0) return;
  var ms = members(), chars = [], accs = [], names = [];
  ms.forEach(function (u) { var v = parseAv(players[u] && players[u].av, u); chars.push(v.c); accs.push(v.a); names.push(players[u] ? players[u].nick : '?'); });
  bdraw($('bcv').getContext('2d'), bView, $('bcv').width, { me: myI, chars: chars, accs: accs, names: names, emojis: [] });
  var key = ms.map(function (u, i) { return bView.players[i] ? bView.players[i].score : 0; }).join(',');
  if (key !== lastRank) {
    lastRank = key; var box = $('brank'); box.textContent = '';
    ms.map(function (u, i) { return { u: u, i: i, s: bView.players[i] ? bView.players[i].score : 0 }; }).sort(function (a, b) { return b.s - a.s; }).forEach(function (r) {
      var row = el('div', 'brow' + (r.i === myI ? ' me' : '')); row.appendChild(avatarEl(players[r.u] && players[r.u].av, r.u)); row.appendChild(el('span', '', (players[r.u] ? players[r.u].nick : '?') + ' ' + r.s)); box.appendChild(row);
    });
  }
}
/* 操作：押している向き(d)と、爆弾を置いた回数(b)を送る。変わったときだけ */
function setInput(d) {
  curD = d; var key = d + ':' + bcount; if (key === sentKey || !pin || !uid) return; sentKey = key;
  set(ref(db, 'rooms/' + pin + '/bin/' + uid), { d: d, b: bcount }).catch(function () {});
}
var KEYS = { ArrowUp: 1, w: 1, W: 1, ArrowDown: 2, s: 2, S: 2, ArrowLeft: 3, a: 3, A: 3, ArrowRight: 4, d: 4, D: 4 };
addEventListener('keydown', function (e) {
  if (!bActive) return;
  if (KEYS[e.key]) { e.preventDefault(); if (held.indexOf(KEYS[e.key]) < 0) held.push(KEYS[e.key]); setInput(held[held.length - 1]); }
  else if (e.key === ' ') { e.preventDefault(); if (!e.repeat) { bcount = (bcount + 1) % 9000; sentKey = ''; setInput(curD); } }
});
addEventListener('keyup', function (e) { if (KEYS[e.key]) { held = held.filter(function (d) { return d !== KEYS[e.key]; }); setInput(held.length ? held[held.length - 1] : 0); } });
document.querySelectorAll('#bpad .pad button').forEach(function (b) { var d = Number(b.dataset.d); b.onpointerdown = function () { if (!bActive) return; held.push(d); setInput(d); }; b.onpointerup = b.onpointerleave = function () { held = held.filter(function (x) { return x !== d; }); setInput(held.length ? held[held.length - 1] : 0); }; });
$('bbtn').onpointerdown = function () { if (!bActive) return; bcount = (bcount + 1) % 9000; sentKey = ''; setInput(curD); };

function report() {
  var o = { k: k, a: a, u: serverNow() };
  o.u = { '.sv': 'timestamp' };
  set(ref(db, 'rooms/' + pin + '/run/' + uid), o).catch(function () {});
}

/* ---- 問題（正解で進捗に加算。まちがえた問題は、あとでもう一度出る） */
function nextQuestion() {
  if (!queue.length) queue = shuffle(pool.map(function (_, i) { return i; }));
  var qi = queue.pop(), q = prepareQuestion(pool[qi], true); q.qi = qi;
  run = q; locked = false; selMask = 0;
  $('sqtext').textContent = q.text;
  var im = $('sqimg'); if (q.image) { im.src = q.image; im.classList.remove('hide'); } else im.classList.add('hide');
  $('sq').classList.toggle('hasimg', !!q.image);
  var isText = q.type === 'text', box = $('stiles');
  box.textContent = ''; box.className = 'stu-tiles n' + q.choices.length; box.classList.toggle('hide', isText);
  $('textbox').classList.toggle('hide', !isText);
  q.choices.forEach(function (c, idx) {
    var b = el('button', 'tile t' + idx);
    b.appendChild(el('span', 'sh', CHOICE_STYLE[idx].shape));
    if (c.image) { var i2 = el('img', 'ch-img'); i2.src = c.image; i2.alt = ''; b.appendChild(i2); }
    if (c.t) b.appendChild(el('span', 'tx', c.t));
    b.onclick = function () {
      if (locked) return;
      if (q.multi) { selMask ^= (1 << idx); b.classList.toggle('sel', !!(selMask & (1 << idx))); $('btnSubmit').disabled = !selMask; }
      else judge(maskOf([idx]), null);
    };
    box.appendChild(b);
  });
  $('btnSubmit').classList.toggle('hide', !(q.multi || isText)); $('btnSubmit').disabled = true;
  $('fb').className = 'fb'; $('fb').textContent = q.multi ? 'あてはまるものを すべて選んで「答える」' : '';
  if (isText) {
    var inp = $('textAns'); inp.value = ''; inp.disabled = false; inp.inputMode = q.numeric ? 'decimal' : 'text';
    $('tnote').textContent = q.numeric ? '数字で答えてね' : '答えを打ち込んで、Enter か「答える」';
    setTimeout(function () { inp.focus(); }, 200);
  }
}
$('textAns').addEventListener('input', function () { $('btnSubmit').disabled = !this.value.trim(); });
$('textAns').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing && this.value.trim() && !locked) { e.preventDefault(); $('btnSubmit').click(); } });
$('btnSubmit').onclick = function () {
  if (locked) return;
  if (run.type === 'text') judge(null, $('textAns').value.trim()); else if (selMask) judge(selMask, null);
};
function flash(bad) { var f = $('flash'); f.className = 'cflash' + (bad ? ' bad' : ''); void f.offsetWidth; f.classList.add('on'); }

function judge(mask, text) {
  if (finished) return;
  locked = true;
  var q = run, ok = q.type === 'text' ? isTextCorrect(text, q.accept) : mask === maskOf(q.correct);
  if (q.type === 'text') $('textAns').disabled = true;
  document.querySelectorAll('#stiles .tile').forEach(function (b, i) {
    b.style.pointerEvents = 'none';
    var isC = q.correct.indexOf(i) >= 0, picked = !!(mask & (1 << i));
    if (isC) b.classList.add('right-ans'); else if (!picked) b.classList.add('dim');
  });
  a++;
  $('btnSubmit').classList.add('hide');
  var fb = $('fb');
  if (ok) { k++; fb.className = 'fb ok'; fb.textContent = '✓ せいかい！ チームが すすんだ！'; flash(false); }
  else {
    fb.className = 'fb ng'; flash(true);
    fb.textContent = '✕ ざんねん… ' + (q.type === 'text' ? '正解は 「' + q.accept.slice(0, 3).join(' ／ ') + '」' : '');
    var pos = Math.min(queue.length, 3 + Math.floor(Math.random() * 5)); queue.splice(queue.length - pos, 0, q.qi);   /* まちがえた問題は、数問あとにもう一度 */
  }
  report();
  setTimeout(function () { if (!finished && state && state.phase === 'quiz') nextQuestion(); }, ok ? 700 : 1900);
}

function endGame() {
  if (finished) return; finished = true; clearInterval(timerId);
  var win = state.result === 'clear';
  $('endEm').textContent = win ? '🎉' : '🤖';
  $('endTitle').textContent = win ? '全レベルクリア！ にげきった！' : 'ロボットにつかまってしまった…';
  $('endk').textContent = k; $('enda').textContent = a; $('endAll').textContent = state.total != null ? state.total : sumK();
  showScreen('s-end'); if (win) confetti($('conf-end'), 40);
}
</script>
</body>
</html>
